<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>みんなの日本語 初級Ⅱ 语法总结详细版</title><style>:root{--bg:#f7f7fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--accent2:#7c3aed;--soft:#eff6ff;--warn:#fff7ed}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC','Hiragino Sans','Microsoft YaHei',sans-serif;line-height:1.8;background:var(--bg);color:var(--text)}header{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:28px 18px 24px}.wrap,main{max-width:980px;margin:0 auto}h1{margin:0;font-size:25px;line-height:1.35}header p{margin:10px 0 0;opacity:.92}.card,section{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0;box-shadow:0 8px 24px rgba(15,23,42,.05)}main{padding:16px}h2{font-size:20px;margin:0 0 12px;border-left:5px solid var(--accent);padding-left:10px}h3{font-size:17px;margin:20px 0 8px}.muted{color:var(--muted)}.select-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}select,button{font-size:16px;border-radius:12px;border:1px solid var(--line);padding:10px 12px;background:#fff}button{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}button.secondary{background:#fff;color:var(--accent)}table{width:100%;border-collapse:collapse;margin:10px 0}th,td{border:1px solid var(--line);padding:10px;vertical-align:top;text-align:left}th{background:var(--soft);color:#1e3a8a}.tag{display:inline-block;background:#ecfeff;color:#155e75;border:1px solid #a5f3fc;border-radius:999px;padding:3px 9px;font-size:13px;margin:0 6px 6px 0}.box{background:#f9fafb;border-left:4px solid #93c5fd;padding:12px 14px;margin:10px 0;border-radius:10px}.note{background:var(--warn);border:1px solid #fed7aa;border-radius:12px;padding:12px 14px;margin:10px 0}.jp{font-weight:700;font-size:18px;color:#111827}.cn{color:var(--muted)}footer{text-align:center;color:var(--muted);font-size:13px;padding:20px 10px 34px}@media(max-width:700px){h1{font-size:21px}main{padding:12px}.card,section{padding:14px}.select-row{display:grid;grid-template-columns:1fr 1fr}.select-row label,.select-row select{grid-column:1/-1}.select-row button{width:100%}th,td{font-size:14px;padding:8px}.jp{font-size:17px}}</style></head><body><header><div class="wrap"><h1>《みんなの日本語 初級Ⅱ》语法总结详细版</h1><p>第26～50课｜按第26课详细格式：语法表、接续、中文解析、例句、区别提醒</p></div></header><main><div class="card"><h2>选择课程</h2><div class="select-row"><label for="lesson"><b>课程：</b></label><select id="lesson"></select><button onclick="render(lesson.value)">查看</button><button class="secondary" onclick="copyLink()">复制本课链接</button></div><p class="muted">选择课程后，下面直接显示详细语法总结。</p></div><section id="content"></section></main><footer>Minna no Nihongo Grammar Review Detailed</footer><script>
const lessons={
26:{t:'第26课：说明情况与委婉请求',m:'本课核心是用「んです」解释背景，再用委婉句型提出请求或询问建议。',items:[['普通形＋んです','其实是……；是因为……；情况是这样的','动词/い形容词普通形＋んです；名词/な形容词现在肯定＋なんです','它不是单纯的“是”，而是在解释原因、说明背景、确认状况。',['どうして遅れたんですか。= 你为什么迟到了？','電車が遅れたんです。= 是因为电车晚点了。','あしたから旅行なんです。= 我明天开始要去旅行。']],['～んですが、～','我是……，所以想……；有点……想请问……','普通形＋んですが、后接请求/询问/建议','先说明自己的情况，再提出请求，比直接说更自然、更礼貌。',['生け花を習いたいんですが、いい先生を紹介していただけませんか。= 我想学插花，能不能请您介绍一位好老师？','日本語でレポートを書いたんですが、ちょっと見ていただけませんか。= 我写了日语报告，能不能请您看一下？']],['疑问词＋たらいいですか','……的话好呢？该怎么……？','どう/どこ/だれ/何＋たらいいですか','用来询问方法、建议、选择。',['どうしたらいいですか。= 我该怎么办？','ごみはどこに出したらいいですか。= 垃圾应该倒在哪里？']],['～ていただけませんか','能不能请您帮我……？','动词て形＋いただけませんか','非常礼貌的请求。比「～てください」更客气。',['電話番号を教えていただけませんか。= 能不能请您告诉我电话号码？','ちょっと見ていただけませんか。= 能不能请您帮我看一下？']]],note:'最常用组合：～んですが、～ていただけませんか。／～んですが、どうしたらいいですか。'},
27:{t:'第27课：可能形与看得见/听得见',m:'本课核心是“能不能做某事”，以及自然看到、自然听到、建成、只有。',items:[['可能形','能……；会……；可以……','一类：う段→え段＋ます，如話します→話せます；二类：去ます＋られます；三类：します→できます，来ます→来られます','可能形表示能力或可能性。原来用「を」的对象，变可能形后常用「が」。',['日本語を話します。= 说日语。','日本語が話せます。= 会说日语。','このATMは夜も使えます。= 这个ATM晚上也能用。']],['～が見えます','看得见……','名词＋が見えます','表示东西自然进入视野，不是主动去看。',['窓から海が見えます。= 从窗户看得见海。','ここから富士山が見えます。= 从这里看得见富士山。']],['～が聞こえます','听得见……','名词＋が聞こえます','表示声音自然传到耳朵里，不是主动听。',['鳥の声が聞こえます。= 听得见鸟叫声。','電話の声がよく聞こえません。= 电话里的声音听不太清楚。']],['～ができます','建成；做好；出现；交到朋友','名词＋ができます','除了“能做”，还可以表示某物建成、事情出现、朋友交到。',['駅の前にスーパーができました。= 车站前建了超市。','日本で友達ができました。= 在日本交到了朋友。']],['～しか～ません','只……；仅仅……','名词/数量词＋しか＋否定形','「しか」后面必须是否定，语气常有“不多、不够”的感觉。',['1000円しかありません。= 只有1000日元。','日本語が少ししか話せません。= 只会说一点日语。']]],note:'区别：見ます=主动看；見えます=看得见。聞きます=主动听；聞こえます=听得见。'},
28:{t:'第28课：同时进行、习惯与列举理由',m:'本课核心是“一边做一边做”、习惯性动作、列举多个理由。',items:[['～ながら','一边……一边……','动词ます形去ます＋ながら','两个动作同时进行，后面的动作是主要动作。',['音楽を聞きながら、勉強します。= 一边听音乐一边学习。','テレビを見ながら、ご飯を食べます。= 一边看电视一边吃饭。']],['～ています','经常……；从事……','动词て形＋います','除了“正在……”，还可以表示长期习惯、职业、反复做的事情。',['毎朝ジョギングをしています。= 每天早上跑步。','父は銀行で働いています。= 爸爸在银行工作。']],['～し、～し、～','又……又……；而且……','普通形＋し、普通形＋し','列举理由或特点，暗示还有其他理由。名词/な形容词用「だし」。',['この店は安いし、おいしいし、よく来ます。= 这家店又便宜又好吃，所以常来。','地下鉄は速いし、便利だし、地下鉄で行きましょう。= 地铁又快又方便，坐地铁去吧。']],['それに','而且；再加上','句子。それに、句子。','补充同方向信息。',['この店は安いです。それに、おいしいです。= 这家店便宜，而且好吃。']],['それで','所以；因此','原因。それで、结果。','表示前面是原因，后面是结果。',['電車が止まりました。それで、遅れました。= 电车停了，所以迟到了。']]],note:'それに=补充；それで=原因导致结果。'},
29:{t:'第29课：自动词结果状态与遗憾',m:'本课重点是用自动词描述眼前状态，以及用「てしまいました」表达完成或遗憾。',items:[['自動詞＋ています','……着；……了','自动词て形＋います','描述动作发生后留下的状态。重点不是谁做的，而是现在看到的结果。',['ドアが開いています。= 门开着。','電気がついています。= 灯亮着。','窓が閉まっています。= 窗户关着。']],['～てしまいました','……完了；糟糕，……了','动词て形＋しまいました','可以表示动作完全结束，也可以表示后悔、遗憾、意外。',['宿題をしてしまいました。= 作业做完了。','財布をなくしてしまいました。= 钱包弄丢了。','パスポートを忘れてしまいました。= 把护照忘了。']],['自动词常用搭配','开着、关着、坏着等状态','開く→開いています；閉まる→閉まっています；壊れる→壊れています','这些表达常用于描述房间、设备、门窗、交通工具状态。',['エレベーターが壊れています。= 电梯坏了。','車が止まっています。= 车停着。']]],note:'第29课多用自动词：ドアが開いています。第30课多用他动词：ドアが開けてあります。'},
30:{t:'第30课：人为结果状态与事先准备',m:'本课重点是“已经人为做好了”和“事先准备”。',items:[['他動詞＋てあります','已经……好了','他动词て形＋あります','表示有人为了某目的做完某动作，结果现在还保留着。',['カレンダーに予定が書いてあります。= 日历上写好了安排。','机の上に資料が置いてあります。= 桌子上放好了资料。']],['～ておきます','事先……；先……','动词て形＋おきます','为了将来方便，提前做准备。口语里常变成「～ときます」。',['旅行の前にホテルを予約しておきます。= 旅行前先订好酒店。','会議の前に資料をコピーしておきます。= 会议前先复印好资料。']],['そのままにしておきます','保持原样；先放着','そのままにしておきます','表示不改变现状，暂时放着。',['これはそのままにしておいてください。= 这个请保持原样。']]],note:'区别：開いています=门开着；開けてあります=有人把门开好了。'},
31:{t:'第31课：意向形、计划与打算',m:'本课学习如何表达“打算做”“计划做”“还没做”。',items:[['意向形','做吧；打算做','一类う段→お段＋う：行く→行こう；二类去る＋よう：食べる→食べよう；する→しよう；来る→来よう','可用于邀请、建议、自言自语，也可接「と思っています」表达打算。',['ちょっと休もう。= 休息一下吧。','いっしょに行こう。= 一起去吧。']],['意向形＋と思っています','我打算……','意向形＋と思っています','表示自己心里已有的计划，比临时想法更稳定。',['日本で働こうと思っています。= 我打算在日本工作。']],['～つもりです','打算……','辞书形/ない形＋つもりです','表达较明确的个人意图。',['来年国へ帰るつもりです。= 打算明年回国。','車は買わないつもりです。= 打算不买车。']],['～予定です','计划……','动词辞书形/名词の＋予定です','偏客观日程、安排、计划。',['会議は3時からの予定です。= 会议计划3点开始。','来月出張する予定です。= 计划下月出差。']],['まだ～ていません','还没有……','まだ＋动词て形＋いません','表示事情到现在还没完成。',['宿題はまだしていません。= 作业还没做。']]],note:'つもり=个人打算；予定=日程安排。'},
32:{t:'第32课：建议、推测与可能性',m:'本课学习如何给建议，以及表达“大概”“也许”。',items:[['～たほうがいいです','最好……','动词た形＋ほうがいいです','用于建议对方做某事。',['病院へ行ったほうがいいです。= 最好去医院。','薬を飲んだほうがいいです。= 最好吃药。']],['～ないほうがいいです','最好不要……','动词ない形＋ほうがいいです','用于劝阻。',['無理をしないほうがいいです。= 最好不要勉强。','今日は出かけないほうがいいです。= 今天最好不要出门。']],['～でしょう','大概……吧','普通形＋でしょう','表示较有把握的推测。',['あしたは雨が降るでしょう。= 明天大概会下雨。']],['～かもしれません','也许……；可能……','普通形＋かもしれません','表示不太确定的可能性。',['約束の時間に間に合わないかもしれません。= 可能赶不上约定时间。']]],note:'でしょう 比 かもしれません 更有把握。'},
33:{t:'第33课：命令、禁止与传话',m:'本课学习命令形、禁止形，以及看标志、解释意思、转述别人说的话。',items:[['命令形','做！','一类う段→え段：急ぐ→急げ；二类去る＋ろ：見る→見ろ；する→しろ；来る→来い','语气强，多用于口令、交通标志、男性强硬语气，日常要慎用。',['急げ。= 快点！','止まれ。= 停！']],['禁止形','不要做！','动词辞书形＋な','表示强烈禁止。',['入るな。= 不要进！','ここに車を止めるな。= 不要在这里停车。']],['～と書いてあります','写着……','句子/词语＋と書いてあります','用于读标志、说明、纸条。',['ここに「止まれ」と書いてあります。= 这里写着“停”。']],['～という意味です','意思是……','词语＋は＋解释＋という意味です','用于解释词语、标志含义。',['「立入禁止」は入ってはいけないという意味です。= “禁止进入”的意思是不能进去。']],['～と言っていました','他说……','普通形＋と言っていました','转述别人说过的话。',['田中さんはあとで電話すると言っていました。= 田中说稍后打电话。']]],note:'命令形/禁止形很强，平时请求别人不要直接用。'},
34:{t:'第34课：按照、之后、不做A做B',m:'本课学习按照某个标准做、做完之后再做，以及伴随状态。',items:[['～とおりに','按照……','名词の＋とおりに；动词た形/辞书形＋とおりに','表示照说明、图纸、老师说的话去做。',['説明書のとおりに組み立てます。= 按说明书组装。','私が言ったとおりにしてください。= 请按我说的做。']],['～たあとで','……之后','动词た形＋あとで；名词の＋あとで','前项完成后，再做后项。',['ご飯を食べたあとで、勉強します。= 吃饭后学习。','会議のあとで、電話します。= 会议后打电话。']],['～て／～ないで','做A而做B；不做A而做B','动词て形/ない形＋ないで','表示伴随状态或选择。',['傘を持って出かけます。= 带着伞出门。','朝ご飯を食べないで学校へ行きました。= 没吃早饭就去学校了。']]],note:'あとで 强调顺序；ながら 强调同时。'},
35:{t:'第35课：条件形',m:'本课核心是“如果……就……”，以及根据话题提出建议。',items:[['条件形～ば','如果……就……','一类う段→え段＋ば；二类去る＋れば；い形容词去い＋ければ','表示条件成立后出现结果。',['雨が降れば、行きません。= 如果下雨就不去。','安ければ、買います。= 如果便宜就买。']],['～なら','如果是……的话','名词/な形容词＋なら；普通形＋なら','常用于承接对方话题，再提出建议或判断。',['日本語を勉強するなら、この本がいいです。= 如果学日语，这本书不错。']],['疑问词＋ばいいですか','怎么……好？','どう/どこ/だれ/何＋ばいいですか','询问建议和方法。',['駅へ行きたいんですが、どう行けばいいですか。= 想去车站，怎么走好？']]],note:'なら 常有“说到这个话题的话……”的感觉。'},
36:{t:'第36课：目标、变化与努力做到',m:'本课学习“为了能……”“变得会……”“尽量做到……”。',items:[['～ように','为了能……；为了不……','动词辞书形/ない形＋ように','表示目标。前面常是可能形或无意志动词。',['日本語が話せるように、毎日練習します。= 为了会说日语，每天练习。','忘れないように、メモします。= 为了不忘记，做笔记。']],['～ようになりました','变得会……；变得……','动词辞书形/ない形＋ようになりました','表示能力、习惯、状态发生变化。',['日本語の新聞が読めるようになりました。= 变得能读日语报纸了。']],['～ようにしています','尽量做到……','动词辞书形/ない形＋ようにしています','表示平时努力坚持。',['毎日運動するようにしています。= 尽量每天运动。']],['～ようにしてください','请尽量……','动词辞书形/ない形＋ようにしてください','委婉要求对方保持某种行为。',['忘れないようにしてください。= 请不要忘记。']]],note:'ために 多用于有意志目的；ように 多用于能力、状态目标。'},
37:{t:'第37课：被动形',m:'本课学习“被……”，以及受害被动和客观说明。',items:[['被动形变化','被……','一类ない形去ない＋れる：書く→書かれる；二类去る＋られる；する→される；来る→来られる','表示动作从受影响者角度来讲。',['私は先生にほめられました。= 我被老师表扬了。']],['AはBに～られます','A被B……','受事者は＋动作发出者に＋被动形','直接被动。',['私は犬にかまれました。= 我被狗咬了。']],['受害被动','被……弄得困扰','人は＋别人动作＋被动形','日语中常用被动表示“我受到了影响/困扰”。',['電車で足を踏まれました。= 在电车上脚被踩了。']],['物/作品が～られます','被建造；被制作；被发现','物/作品は＋时间/人＋被动形','用于客观介绍建筑、作品、发明。',['このお寺は500年前に建てられました。= 这座寺庙是500年前建的。']]],note:'被动形也可作尊敬语，第49课会再学。'},
38:{t:'第38课：动词名词化',m:'本课用「の」把动词句变成名词成分。',items:[['Vのは＋形容词','做……这件事……','动词辞书形＋のは＋形容词です','把动作整体当作主题。',['日本語を勉強するのは楽しいです。= 学日语很开心。']],['Vのが好き/上手','喜欢/擅长做……','动词辞书形＋のが＋好き/嫌い/上手/下手','表达喜好、能力。',['私は料理を作るのが好きです。= 我喜欢做饭。','妹は絵を描くのが上手です。= 妹妹擅长画画。']],['Vのを忘れました','忘记做……','动词辞书形＋のを＋忘れました','「の」后面接「を」，动作变成宾语。',['電気を消すのを忘れました。= 忘了关灯。']],['知っています/知りません','知道/不知道','肯定：知っています；否定回答：知りません','日语不说「知っていません」作为普通否定回答。',['山田さんを知っていますか。いいえ、知りません。= 你认识山田吗？不，不认识。']]],note:'のは=做主题；のが=做喜好/能力对象；のを=做宾语。'},
39:{t:'第39课：原因理由',m:'本课学习用「て」「で」「ので」表达原因。',items:[['～て','因为……所以……','动词て形/い形容词て形＋结果','常接感情、状态、不能控制的结果。',['ニュースを聞いて、びっくりしました。= 听到新闻吓了一跳。','寒くて、眠れませんでした。= 因为冷，没睡着。']],['名词/な形容词＋で','因为……','名词/な形容词＋で＋结果','常用于事故、灾害、病、原因。',['地震でビルが倒れました。= 因为地震大楼倒了。','病気で会社を休みました。= 因病请假。']],['～ので','因为……所以……','普通形＋ので；名词/な形容词＋なので','比「から」更客气、更柔和。',['用事があるので、先に帰ります。= 因为有事，先回去。','静かなので、よく勉強できます。= 因为安静，所以能好好学习。']]],note:'から较直接，ので较柔和，适合解释理由。'},
40:{t:'第40课：是否、疑问句嵌入与试做',m:'本课学习把疑问句放进大句子里，以及“试着做”。',items:[['疑问词＋普通形＋か','……呢','疑问词疑问句普通形＋か＋动词','把“几点、哪里、谁、什么”等问题放进句子。',['会議は何時に始まるか、知っていますか。= 你知道会议几点开始吗？','どこで買ったか、忘れました。= 忘了在哪里买的。']],['普通形＋かどうか','是否……','没有疑问词的疑问句＋かどうか','表示“是不是、有没有、会不会”。',['あした雨が降るかどうか、わかりません。= 不知道明天是否下雨。']],['～てみます','试着……','动词て形＋みます','尝试做某事，看结果如何。',['この靴を履いてみます。= 试穿这双鞋。','日本語で話してみます。= 试着用日语说。']]],note:'有疑问词用「～か」，没有疑问词用「～かどうか」。'},
41:{t:'第41课：授受表达',m:'本课学习更礼貌的“给、得到、为我做”。',items:[['いただきます','得到；收下','人に/から＋名词を＋いただきます','「もらいます」的谦让语，降低自己，尊重对方。',['先生に辞書をいただきました。= 从老师那里得到了字典。']],['くださいます','给我/我方','人が＋我方に＋名词を＋くださいます','「くれます」的尊敬语，尊敬给东西的人。',['先生が写真をくださいました。= 老师给了我照片。']],['やります','给晚辈/动植物','人/动物/植物に＋名词を＋やります','多用于给孩子、动物、植物。',['犬にえさをやります。= 给狗喂食。']],['Vていただきます','请别人为我做','人に＋Vていただきます','强调我请求并受益。',['先生に説明していただきました。= 请老师给我说明了。']],['Vてくださいます','别人为我做','人が＋Vてくださいます','强调对方主动善意为我做。',['先生が説明してくださいました。= 老师为我说明了。']]],note:'いただく从“我得到帮助”角度说；くださる从“对方为我做”角度说。'},
42:{t:'第42课：目的与用途',m:'本课学习为了某目的，以及某物用于什么。',items:[['～ために','为了……','动词辞书形＋ために；名词の＋ために','表示目的。前后主语通常一致，前面多为意志动词。',['家を買うために、お金を貯めています。= 为了买房在存钱。','健康のために、毎日歩いています。= 为了健康每天走路。']],['～のに','用于……；对……有用','动词辞书形＋のに＋使います/便利です/役に立ちます','表示用途、评价。',['このはさみは紙を切るのに使います。= 这把剪刀用于剪纸。','この本は漢字を覚えるのに役に立ちます。= 这本书对记汉字有用。']],['数量词＋は/も','至少/竟然','数量词＋は；数量词＋も','は表示最低估计，も表示数量多得意外。',['駅まで歩いて30分はかかります。= 走到车站至少要30分钟。','人が100人も来ました。= 竟然来了100人。']]],note:'ために=目的；のに=用途/评价。'},
43:{t:'第43课：看起来与动作方向',m:'本课学习样态“看起来……”，以及「てきます」的方向感。',items:[['い形容词/な形容词＋そうです','看起来……','い形去い＋そう；な形词干＋そう','根据外观判断。いい→よさそう；ない→なさそう。',['このケーキはおいしそうです。= 这个蛋糕看起来好吃。','田中さんは元気そうです。= 田中看起来很精神。']],['动词ます形＋そうです','看起来要……','动词ます形去ます＋そうです','表示某动作快要发生。',['雨が降りそうです。= 看起来要下雨。','ボタンが取れそうです。= 扣子快掉了。']],['～てきます','去做再回来；到现在为止的变化','动词て形＋きます','可以表示“去做某事再回来”，也可表示变化从过去到现在。',['コンビニで飲み物を買ってきます。= 我去便利店买饮料再回来。','日本語を勉強する人が増えてきました。= 学日语的人增加起来了。']]],note:'样态そう=眼前看起来；传闻そう=听说，第47课会学。'},
44:{t:'第44课：过度、难易与改变状态',m:'本课学习“太……”“容易/难以……”，以及把状态改变成某样。',items:[['～すぎます','太……；过度……','动词ます形去ます＋すぎます；い形去い＋すぎます；な形＋すぎます','表示超过适当程度。',['昨日飲みすぎました。= 昨天喝太多了。','この服は大きすぎます。= 这件衣服太大了。']],['～やすいです','容易……','动词ます形去ます＋やすいです','表示动作容易做，或某事容易发生。',['この辞書は使いやすいです。= 这本词典好用。','この薬は飲みやすいです。= 这个药容易吃。']],['～にくいです','难以……','动词ます形去ます＋にくいです','表示动作难做。',['この字は読みにくいです。= 这个字难读。','この靴は歩きにくいです。= 这双鞋不好走路。']],['～く/にします','把……弄成……','い形容词去い＋くします；な形容词/名词＋にします','人为改变状态。',['音を小さくしてください。= 请把声音调小。','部屋をきれいにします。= 把房间弄干净。']]],note:'なります=自然变成；します=人为弄成。'},
45:{t:'第45课：场合与转折',m:'本课学习“在……情况下”和“明明……却……”。',items:[['～場合は','……的情况下','动词/形容词/名词普通形＋場合は；名词の＋場合は；な形＋な場合は','说明某种情况发生时该怎么做。',['地震が起きた場合は、エレベーターを使わないでください。= 地震时请不要使用电梯。','雨の場合は、中止します。= 下雨的情况下取消。']],['～のに','明明……却……','普通形＋のに；名词/な形＋なのに','表示结果和预想相反，带意外、不满、遗憾。',['約束したのに、彼は来ませんでした。= 明明约好了，他却没来。','安いのに、おいしいです。= 明明便宜，却很好吃。']]],note:'ので=因为，所以；のに=明明却。'},
46:{t:'第46课：时间点、刚刚与理应',m:'本课学习动作所处阶段，以及“刚刚……”“应该……”。',items:[['～ところです','正要/正在/刚刚……','辞书形＋ところ；ている＋ところ；た形＋ところ','表示动作阶段。',['今から出かけるところです。= 正要出门。','今、食べているところです。= 正在吃。','今、帰ってきたところです。= 刚回来。']],['～ばかりです','刚……不久','动词た形＋ばかりです','表示说话人感觉刚做完不久，时间长短看说话人感受。',['先月日本へ来たばかりです。= 上个月刚来日本。']],['～はずです','应该……','普通形＋はずです；名词の/な形な＋はずです','根据事实或理由进行有把握推断。',['田中さんはもう着いたはずです。= 田中应该已经到了。','今日は休みのはずです。= 今天应该休息。']]],note:'たところ=时间上刚刚；たばかり=说话人感觉刚刚。'},
47:{t:'第47课：传闻与推断',m:'本课学习“听说……”和“看起来好像……”。',items:[['普通形＋そうです','听说……','普通形＋そうです','表示从别人、新闻、天气预报等听来的信息。常和「～によると」一起用。',['天気予報によると、あしたは雨が降るそうです。= 据天气预报说明天会下雨。','山田さんは結婚したそうです。= 听说山田结婚了。']],['普通形＋ようです','好像……','普通形＋ようです；名词の/な形な＋ようです','根据看到、听到、感觉到的情况进行判断。',['外が暗いです。雨が降っているようです。= 外面很暗，好像在下雨。','田中さんは忙しいようです。= 田中好像很忙。']]],note:'そうです=传闻，消息来自外部；ようです=自己根据状况推断。'},
48:{t:'第48课：使役形',m:'本课学习“让某人做”和“请求让我做”。',items:[['使役形变化','让……做；使……做','一类ない形去ない＋せます：行く→行かせます；二类去る＋させます；する→させます；来る→来させます','表示让别人做某事，或允许别人做某事。',['母は子どもを買い物に行かせました。= 妈妈让孩子去买东西。']],['人を＋自动词使役','让某人……','人を＋自动词使役','自动词时，被使役的人常用「を」。',['先生は学生を走らせました。= 老师让学生跑步。']],['人に＋他动词使役','让某人做某事','人に＋名词を＋他动词使役','他动词已有宾语「を」，所以被使役的人用「に」。',['先生は学生に作文を書かせました。= 老师让学生写作文。']],['～させていただけませんか','能让我……吗','使役て形＋いただけませんか','非常礼貌地请求许可。',['早く帰らせていただけませんか。= 能不能让我早点回去？']]],note:'自动词：人を行かせます；他动词：人に作文を書かせます。'},
49:{t:'第49课：尊敬语',m:'本课学习提高对方动作的表达，用于老师、客人、上司等。',items:[['お～になります','尊敬表达','お＋动词ます形去ます＋になります','提高对方动作，不能用于自己的动作。',['社長はもうお帰りになりました。= 社长已经回去了。']],['特殊尊敬动词','固定尊敬表达','いらっしゃいます、召し上がります、ご覧になります等','这些不能按普通规则变化，需要直接记。',['行きます/来ます/います→いらっしゃいます','食べます/飲みます→召し上がります','見ます→ご覧になります']],['被动形作尊敬','较简单的尊敬形式','动词被动形','形式简单，但尊敬程度有时不如特殊尊敬语。',['先生は明日来られます。= 老师明天来。','社長はもう帰られました。= 社长已经回去了。']]],note:'尊敬语用于对方动作，不能用来抬高自己。'},
50:{t:'第50课：谦让语',m:'本课学习降低自己的动作，以表示对对方的尊重。',items:[['お～します','我为您……','お＋动词ます形去ます＋します','用于自己的动作涉及对方时，表示谦让。',['荷物をお持ちします。= 我来帮您拿行李。','駅までお送りします。= 我送您到车站。']],['ご～します','我为您……','ご＋汉语名词＋します','多接汉语词，如説明、連絡、案内。',['あとでご連絡します。= 稍后我联系您。','会議室へご案内します。= 我带您去会议室。']],['特殊谦让动词','固定谦让表达','参ります、伺います、申します、拝見します等','用于自己的动作，要直接记。',['行きます/来ます→参ります、伺います','言います→申します','見ます→拝見します','会います→お目にかかります']],['ございます','あります的礼貌语','名词がございます','更正式、客气。',['資料はこちらにございます。= 资料在这里。']]],note:'尊敬语抬高对方；谦让语降低自己。'}
};
const lesson=document.getElementById('lesson'),content=document.getElementById('content');for(let i=26;i<=50;i++){let o=document.createElement('option');o.value=i;o.textContent='第'+i+'课';lesson.appendChild(o)}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function render(n){n=Number(n);let l=lessons[n];lesson.value=n;history.replaceState(null,'','#lesson-'+n);let html='<h2>'+esc(l.t)+'</h2><p class="muted">'+esc(l.m)+'</p><p>'+l.items.map(x=>'<span class="tag">'+esc(x[0])+'</span>').join('')+'</p><table><thead><tr><th>语法</th><th>中文意思</th><th>接续/重点</th></tr></thead><tbody>'+l.items.map(x=>'<tr><td>'+esc(x[0])+'</td><td>'+esc(x[1])+'</td><td>'+esc(x[2])+'</td></tr>').join('')+'</tbody></table>';l.items.forEach((x,i)=>{html+='<h3>'+(i+1)+'. '+esc(x[0])+'</h3><div class="note"><b>中文理解：</b>'+esc(x[3])+'</div><div class="box"><b>例句：</b>'+x[4].map(e=>'<div>'+esc(e)+'</div>').join('')+'</div>'});html+='<div class="note"><b>本课记忆：</b>'+esc(l.note)+'</div>';content.innerHTML=html;window.scrollTo({top:0,behavior:'smooth'})}
function copyLink(){let url=location.origin+location.pathname+'#lesson-'+lesson.value;navigator.clipboard?navigator.clipboard.writeText(url).then(()=>alert('已复制：'+url)):prompt('复制这个链接：',url)}
lesson.onchange=()=>render(lesson.value);let m=location.hash.match(/lesson-(\d+)/);render(m?m[1]:26);
</script></body></html>
