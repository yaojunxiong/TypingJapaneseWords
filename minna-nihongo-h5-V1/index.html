<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>みんなの日本語 第1課 点读 V1</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;background:#f3f4f6;color:#111827}header{position:sticky;top:0;background:#fffffff2;backdrop-filter:blur(10px);border-bottom:1px solid #e5e7eb;padding:14px 16px;z-index:10}h1{font-size:22px;margin:0}.sub{font-size:13px;color:#6b7280;margin-top:4px}main{max-width:880px;margin:0 auto;padding:16px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}button{border:0;border-radius:999px;background:#2563eb;color:white;padding:10px 15px;font-size:14px;cursor:pointer}.secondary{background:#e5e7eb;color:#111827}.card{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:15px;margin:10px 0}.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.jp{font-size:22px;line-height:1.7}.cn{color:#6b7280;font-size:15px;margin-top:6px}.play-btn{min-width:88px}.notice{background:#fff7ed;border:1px solid #fed7aa;color:#7c2d12;border-radius:16px;padding:12px;font-size:14px}@media(max-width:640px){.row{grid-template-columns:1fr}.jp{font-size:20px}button{width:100%}}</style></head><body><header><h1>みんなの日本語 初級Ⅰ 第1課 点读 V1</h1><div class="sub">Chrome 单句播放修复版</div></header><main><div class="notice">已修复 Chrome 中单句播放按钮无效问题。</div><div class="toolbar"><button onclick="playAll()">▶ 播放全部</button><button class="secondary" onclick="stopAudio()">■ 停止</button></div><div id="content"></div></main><script>const sections=[{title:'文型',items:[['わたしは マイク・ミラーです。','我是迈克·米勒。'],['サントスさんは 学生じゃ ありません。','桑托斯先生不是学生。']]},{title:'会話',items:[['初めまして。','初次见面。'],['どうぞ よろしく。','请多关照。']]}];function cleanText(t){return t.replace(/[\[\]［］]/g,'')}function stopAudio(){speechSynthesis.cancel()}function speak(t){stopAudio();setTimeout(()=>{const u=new SpeechSynthesisUtterance(cleanText(t));u.lang='ja-JP';u.rate=.86;const v=speechSynthesis.getVoices().find(x=>x.lang&&x.lang.toLowerCase().startsWith('ja'));if(v)u.voice=v;speechSynthesis.speak(u)},80)}function render(){document.getElementById('content').innerHTML=sections.map(sec=>`<h2>${sec.title}</h2>${sec.items.map((it,i)=>`<div class='card'><div class='row'><div class='jp-area' data-text='${encodeURIComponent(it[0])}'><div class='jp'><b>${i+1}.</b> ${it[0]}</div><div class='cn'>${it[1]}</div></div><button class='play-btn' data-play='${encodeURIComponent(it[0])}'>🔊 播放</button></div></div>`).join('')}`).join('');document.querySelectorAll('.play-btn').forEach(btn=>{btn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();speak(decodeURIComponent(btn.dataset.play))})});document.querySelectorAll('.jp-area').forEach(area=>{area.addEventListener('click',()=>{speak(decodeURIComponent(area.dataset.text))})})}function playAll(){stopAudio();const arr=sections.flatMap(s=>s.items.map(i=>i[0]));let n=0;function next(){if(n>=arr.length)return;const u=new SpeechSynthesisUtterance(cleanText(arr[n]));u.lang='ja-JP';u.rate=.86;u.onend=()=>{n++;setTimeout(next,400)};speechSynthesis.speak(u)}next()}render();</script></body></html>
