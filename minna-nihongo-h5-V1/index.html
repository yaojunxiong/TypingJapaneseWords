<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>みんなの日本語 第1課 点读 V1</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f3f4f6;color:#111827}header{position:sticky;top:0;background:#fffffff2;border-bottom:1px solid #e5e7eb;padding:14px 16px;z-index:10}h1{margin:0;font-size:22px}.sub{font-size:13px;color:#6b7280;margin-top:4px}main{max-width:960px;margin:auto;padding:16px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}button{border:0;border-radius:999px;background:#2563eb;color:#fff;padding:10px 15px;cursor:pointer}.secondary{background:#e5e7eb;color:#111827}.tabs{display:flex;gap:10px;overflow:auto;padding-bottom:6px;margin:18px 0}.tab{white-space:nowrap;background:#e5e7eb;color:#111827}.tab.active{background:#111827;color:#fff}.section-title{font-size:24px;margin-top:10px;border-left:6px solid #111827;padding-left:10px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:15px;margin:10px 0}.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.jp{font-size:22px;line-height:1.7}.cn{color:#6b7280;margin-top:6px}.notice{background:#fff7ed;border:1px solid #fed7aa;border-radius:14px;padding:12px;color:#7c2d12}.speaker{font-weight:700;color:#374151}.play-btn{min-width:88px}@media(max-width:640px){.row{grid-template-columns:1fr}.jp{font-size:20px}button{width:100%}.tabs{padding-bottom:10px}}</style></head><body><header><h1>みんなの日本語 初級Ⅰ 第1課 点读 V1</h1><div class='sub'>Tab 标签页模式 · 默认显示文型</div></header><main><div class='notice'>内容结构按 PDF 分区展示：文型・例文・会話・練習A/B/C・問題。</div><div class='toolbar'><button onclick='playCurrentTab()'>▶ 播放当前页</button><button class='secondary' onclick='stopAudio()'>■ 停止</button></div><div class='tabs' id='tabs'></div><div id='content'></div></main><script>const sections=[{title:'文型',items:[['','わたしは マイク・ミラーです。','我是迈克·米勒。'],['','サントスさんは 学生じゃ ありません。','桑托斯先生不是学生。'],['','ミラーさんは 会社員ですか。','米勒先生是公司职员吗？'],['','サントスさんも 会社員です。','桑托斯先生也是公司职员。']]},{title:'例文',items:[['','［あなたは］マイク・ミラーさんですか。','您是迈克·米勒先生吗？'],['','はい、［わたしは］マイク・ミラーです。','是的，我是迈克·米勒。'],['','ミラーさんは 学生ですか。','米勒先生是学生吗？'],['','いいえ、［わたしは］学生じゃ ありません。','不，我不是学生。']]},{title:'会話',items:[['佐藤','おはよう ございます。','早上好。'],['山田','佐藤さん、こちらは マイク・ミラーさんです。','这位是迈克·米勒先生。'],['ミラー','初めまして。','初次见面。'],['ミラー','アメリカから 来ました。','来自美国。']]},{title:'練習A',items:[['','わたしは マイク・ミラーです。','练习A 示例']]},{title:'練習B',items:[['','ミラーさんは 学生ですか。','练习B 示例']]},{title:'練習C',items:[['','初めまして。','练习C 示例']]},{title:'問題',items:[['','はい、そうです。','问题示例']]}];let currentTab=0;function cleanText(t){return t.replace(/[\[\]［］]/g,'')}function stopAudio(){speechSynthesis.cancel()}function speak(t){stopAudio();setTimeout(()=>{const u=new SpeechSynthesisUtterance(cleanText(t));u.lang='ja-JP';u.rate=.86;const v=speechSynthesis.getVoices().find(x=>x.lang&&x.lang.toLowerCase().startsWith('ja'));if(v)u.voice=v;speechSynthesis.speak(u)},60)}function renderTabs(){document.getElementById('tabs').innerHTML=sections.map((s,i)=>`<button class='tab ${i===currentTab?'active':''}' onclick='switchTab(${i})'>${s.title}</button>`).join('')}function renderContent(){const sec=sections[currentTab];document.getElementById('content').innerHTML=`<div class='section-title'>${sec.title}</div>${sec.items.map((it,i)=>`<div class='card'><div class='row'><div class='jp-area' data-text='${encodeURIComponent(it[1])}'><div class='jp'><b>${i+1}.</b> ${it[0]?`<span class='speaker'>${it[0]}：</span>`:''}${it[1]}</div><div class='cn'>${it[2]}</div></div><button class='play-btn' data-play='${encodeURIComponent(it[1])}'>🔊 播放</button></div></div>`).join('')}`;document.querySelectorAll('.play-btn').forEach(btn=>btn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();speak(decodeURIComponent(btn.dataset.play))}));document.querySelectorAll('.jp-area').forEach(area=>area.addEventListener('click',()=>speak(decodeURIComponent(area.dataset.text))))}function switchTab(i){currentTab=i;renderTabs();renderContent();window.scrollTo({top:0,behavior:'smooth'})}function playCurrentTab(){stopAudio();const arr=sections[currentTab].items.map(i=>i[1]);let n=0;function next(){if(n>=arr.length)return;const u=new SpeechSynthesisUtterance(cleanText(arr[n]));u.lang='ja-JP';u.rate=.86;u.onend=()=>{n++;setTimeout(next,400)};speechSynthesis.speak(u)}next()}renderTabs();renderContent();</script></body></html>
