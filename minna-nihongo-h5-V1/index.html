<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>みんなの日本語 第1課 点读 V1</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f3f4f6;color:#111827}header{position:sticky;top:0;background:#fffffff2;border-bottom:1px solid #e5e7eb;padding:14px 16px}h1{margin:0;font-size:22px}.sub{font-size:13px;color:#6b7280;margin-top:4px}main{max-width:900px;margin:auto;padding:16px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}button{border:0;border-radius:999px;background:#2563eb;color:#fff;padding:10px 15px;cursor:pointer}.secondary{background:#e5e7eb;color:#111827}.section-title{font-size:24px;margin-top:28px;border-left:6px solid #111827;padding-left:10px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:15px;margin:10px 0}.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.jp{font-size:22px;line-height:1.7}.cn{color:#6b7280;margin-top:6px}.notice{background:#fff7ed;border:1px solid #fed7aa;border-radius:14px;padding:12px;color:#7c2d12}.speaker{font-weight:700;color:#374151}.play-btn{min-width:88px}@media(max-width:640px){.row{grid-template-columns:1fr}.jp{font-size:20px}button{width:100%}}</style></head><body><header><h1>みんなの日本語 初級Ⅰ 第1課 点读 V1</h1><div class='sub'>完整版 + Chrome 修复版</div></header><main><div class='notice'>已恢复完整第1课内容。</div><div class='toolbar'><button onclick='playAll()'>▶ 播放全部</button><button class='secondary' onclick='stopAudio()'>■ 停止</button></div><div id='content'></div></main><script>const sections=[{title:'文型',items:[['','わたしは マイク・ミラーです。','我是迈克·米勒。'],['','サントスさんは 学生じゃ ありません。','桑托斯先生不是学生。'],['','ミラーさんは 会社員ですか。','米勒先生是公司职员吗？'],['','サントスさんも 会社員です。','桑托斯先生也是公司职员。']]},{title:'例文',items:[['','［あなたは］マイク・ミラーさんですか。','您是迈克·米勒先生吗？'],['','はい、［わたしは］マイク・ミラーです。','是的。'],['','ミラーさんは 学生ですか。','是学生吗？'],['','いいえ、［わたしは］学生じゃ ありません。','不是学生。'],['','ワンさんは 銀行員ですか。','是银行职员吗？'],['','いいえ、［ワンさんは］銀行員じゃ ありません。医者です。','是医生。']]},{title:'会話：初めまして',items:[['佐藤','おはよう ございます。','早上好。'],['山田','佐藤さん、こちらは マイク・ミラーさんです。','这位是迈克·米勒先生。'],['ミラー','初めまして。','初次见面。'],['ミラー','アメリカから 来ました。','来自美国。'],['佐藤','どうぞ よろしく。','请多关照。']]}];function cleanText(t){return t.replace(/[\[\]［］]/g,'')}function stopAudio(){speechSynthesis.cancel()}function speak(t){stopAudio();setTimeout(()=>{const u=new SpeechSynthesisUtterance(cleanText(t));u.lang='ja-JP';u.rate=.86;const v=speechSynthesis.getVoices().find(x=>x.lang&&x.lang.toLowerCase().startsWith('ja'));if(v)u.voice=v;speechSynthesis.speak(u)},60)}function render(){document.getElementById('content').innerHTML=sections.map(sec=>`<div class='section-title'>${sec.title}</div>${sec.items.map((it,i)=>`<div class='card'><div class='row'><div class='jp-area' data-text='${encodeURIComponent(it[1])}'><div class='jp'><b>${i+1}.</b> ${it[0]?`<span class='speaker'>${it[0]}：</span>`:''}${it[1]}</div><div class='cn'>${it[2]}</div></div><button class='play-btn' data-play='${encodeURIComponent(it[1])}'>🔊 播放</button></div></div>`).join('')}`).join('');document.querySelectorAll('.play-btn').forEach(btn=>btn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();speak(decodeURIComponent(btn.dataset.play))}));document.querySelectorAll('.jp-area').forEach(area=>area.addEventListener('click',()=>speak(decodeURIComponent(area.dataset.text))))}function playAll(){stopAudio();const arr=sections.flatMap(s=>s.items.map(i=>i[1]));let n=0;function next(){if(n>=arr.length)return;const u=new SpeechSynthesisUtterance(cleanText(arr[n]));u.lang='ja-JP';u.rate=.86;u.onend=()=>{n++;setTimeout(next,400)};speechSynthesis.speak(u)}next()}render();</script></body></html>
