<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>みんなの日本語 点读 V1</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;background:#f3f4f6;color:#111827}
header{position:sticky;top:0;background:#fffffff2;border-bottom:1px solid #e5e7eb;padding:14px 16px;z-index:10}
h1{margin:0;font-size:22px}.sub{font-size:13px;color:#6b7280;margin-top:4px}
main{max-width:1040px;margin:auto;padding:16px}.notice{background:#eef2ff;border:1px solid #c7d2fe;border-radius:14px;padding:12px;color:#3730a3;line-height:1.6}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.select{border:1px solid #d1d5db;border-radius:999px;padding:10px 15px;background:#fff;font-size:15px}
button{border:0;border-radius:999px;background:#2563eb;color:#fff;padding:10px 15px;cursor:pointer}.secondary{background:#e5e7eb;color:#111827}
.tabs{display:flex;gap:10px;overflow:auto;padding-bottom:8px;margin:18px 0}.tab{white-space:nowrap;background:#e5e7eb;color:#111827}.tab.active{background:#111827;color:#fff}
.section-title{font-size:24px;margin-top:10px;border-left:6px solid #111827;padding-left:10px}.meta{color:#6b7280;font-size:13px;margin:6px 0 12px 16px}.warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:12px;padding:10px;margin:10px 0}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:15px;margin:10px 0}.row{display:grid;grid-template-columns:112px 1fr auto;gap:14px;align-items:center}
.visual{width:104px;height:78px;border-radius:16px;background:linear-gradient(135deg,#eef2ff,#fef3c7);display:flex;align-items:center;justify-content:center;border:1px solid #e5e7eb;cursor:pointer}.visual-emoji{font-size:28px;letter-spacing:2px;text-align:center;line-height:1.2}
.jp{font-size:22px;line-height:1.7}.cn{display:none;color:#6b7280;margin-top:6px}.show-cn .cn{display:block}.speaker{font-weight:700;color:#374151}.play-btn{min-width:88px}
.choice{color:#4b5563;font-size:16px;line-height:1.8;margin-top:8px}.empty{background:#fff;border:1px dashed #cbd5e1;border-radius:18px;padding:22px;color:#64748b;line-height:1.7}
.pdf-table{width:100%;border-collapse:separate;border-spacing:0;margin-top:10px;font-size:18px}.pdf-table td{border:1px solid #e5e7eb;padding:10px;background:#fff}.pdf-table td:first-child{border-radius:10px 0 0 10px;font-weight:700;background:#f8fafc;width:56px}.chip{display:inline-block;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:999px;padding:6px 10px;margin:4px;cursor:pointer}
@media(max-width:720px){.row{grid-template-columns:1fr}.visual{width:100%;height:86px}.jp{font-size:20px}button,.select{width:100%}.tabs{padding-bottom:10px}.pdf-table{font-size:16px}}
</style>
</head>
<body>
<header><h1>みんなの日本語 初級Ⅰ 点读 V1</h1><div class="sub">严格 PDF 模式 · 正文以 JSON 校对内容为准 · 默认隐藏中文</div></header>
<main>
<div class="notice">严格 PDF 模式：练习题不再自动改写成完整句子；表格/替换词按 JSON 结构显示。未逐字校对的栏目会显示待校对提示。</div>
<div class="controls"><select id="lessonSelect" class="select" onchange="switchLesson(Number(this.value))"></select><button onclick="playCurrentTab()">▶ 播放当前页</button><button class="secondary" onclick="stopAudio()">■ 停止</button><button class="secondary" onclick="toggleChinese()">中文显示/隐藏</button><button class="secondary" onclick="toggleVisuals()">图片显示/隐藏</button></div>
<div class="tabs" id="tabs"></div><div id="content"></div>
</main>
<script>
const lessonNames=Array.from({length:25},(_,i)=>`第${i+1}課`);
let currentLesson=1,currentTab=0,currentData=null,showChinese=false,showVisuals=true;const cache={};
function pad(n){return String(n).padStart(2,'0')}function cleanText(t){return String(t||'').replace(/[\[\]［］]/g,'')}function stopAudio(){speechSynthesis.cancel()}
function speak(t){stopAudio();setTimeout(()=>{const u=new SpeechSynthesisUtterance(cleanText(t));u.lang='ja-JP';u.rate=.86;const v=speechSynthesis.getVoices().find(x=>x.lang&&x.lang.toLowerCase().startsWith('ja'));if(v)u.voice=v;speechSynthesis.speak(u)},60)}
function getSections(){return currentData?.sections||[]}function getSpeakText(item){if(item.text)return item.text;if(item.template)return item.template.join(' ');if(item.lines)return item.lines.map(l=>l.text).join('。');return ''}
function visualFor(text){const t=cleanText(text);if(/おはよう/.test(t))return '🌅🙇';if(/初めまして/.test(t))return '🤝🙇';if(/どうぞ よろしく|よろしく お願いします/.test(t))return '🙇🤝';if(/こちらは/.test(t))return '👉👨‍💼';if(/アメリカから 来ました/.test(t))return '🇺🇸✈️';if(/何歳|なんさい|おいくつ/.test(t))return '🎂❓';if(/学生じゃ ありません|がくせいじゃ ありません/.test(t))return '🚫🎓';if(/学生ですか/.test(t))return '🎓❓';if(/学生|がくせい/.test(t))return '🎓👤';if(/先生|きょうし|せんせい/.test(t))return '🧑‍🏫🏫';if(/銀行員|銀行/.test(t))return '🏦';if(/医者|いしゃ/.test(t))return '🧑‍⚕️🏥';if(/会社員|社員|しゃいん|IMC/.test(t))return '🏢👨‍💼';if(/どなた|だれ/.test(t))return '👀❓👤';if(/マイク・ミラー|ミラーです/.test(t))return '🙋‍♂️🪪';if(/はい/.test(t))return '✅';if(/いいえ|じゃ ありません/.test(t))return '❌';if(/も/.test(t))return '👥➕';if(/から 来ました/.test(t))return '🌏✈️';return '💬'}
async function loadLesson(n){currentLesson=n;currentTab=0;currentData=null;renderLessonSelect();renderTabs();renderLoading();if(cache[n]){currentData=cache[n];renderTabs();renderContent();return}try{const res=await fetch(`data/lesson-${pad(n)}.json?ts=${Date.now()}`);if(!res.ok)throw new Error('not found');currentData=await res.json();cache[n]=currentData}catch(e){currentData=null}renderTabs();renderContent()}
function renderLessonSelect(){document.getElementById('lessonSelect').innerHTML=lessonNames.map((name,i)=>`<option value="${i+1}" ${i+1===currentLesson?'selected':''}>${name}</option>`).join('')}
function renderTabs(){const secs=getSections();document.getElementById('tabs').innerHTML=secs.length?secs.map((s,i)=>`<button class="tab ${i===currentTab?'active':''}" onclick="switchTab(${i})">${s.title}</button>`).join(''):''}
function renderLoading(){document.getElementById('content').innerHTML='<div class="empty">読み込み中...</div>'}
function renderVisual(text){return showVisuals?`<div class="visual" onclick="speak(${JSON.stringify(text)})"><div class="visual-emoji">${visualFor(text)}</div></div>`:''}
function renderTableItem(item,i){const text=getSpeakText(item);const rows=[];if(item.template)rows.push(`<tr><td>${item.no||i+1}</td><td>${item.template.map(x=>`<span class="chip" onclick="speak(${JSON.stringify(x)})">${x}</span>`).join('')}</td></tr>`);if(item.columns)rows.push(...item.columns.map((col,idx)=>`<tr><td>${idx+1}</td><td>${col.map(x=>`<span class="chip" onclick="speak(${JSON.stringify(x)})">${x}</span>`).join('')}</td></tr>`));return `<div class="card"><div class="row">${renderVisual(text)}<div><table class="pdf-table">${rows.join('')}</table></div><button class="play-btn" data-play="${encodeURIComponent(text)}">🔊 播放</button></div></div>`}
function renderItem(item,i,sec){if(sec.displayMode==='substitutionTable'||item.template)return renderTableItem(item,i);if(item.lines){const text=getSpeakText(item);return `<div class="card"><div class="row">${renderVisual(text)}<div class="jp-area" data-text="${encodeURIComponent(text)}"><div class="jp"><b>${item.no||i+1}.</b></div>${item.lines.map(l=>`<div class="jp">${l.speaker?`<span class="speaker">${l.speaker}：</span>`:''}${l.text}</div>`).join('')}<div class="cn">${item.cn||''}</div>${item.choices?`<div class="choice">${item.choices.map(c=>`・${c}`).join('<br>')}</div>`:''}</div><button class="play-btn" data-play="${encodeURIComponent(text)}">🔊 播放</button></div></div>`}const text=item.text||'';const choices=item.choices?`<div class="choice">${item.choices.map(c=>`・${c}`).join('<br>')}</div>`:'';const prompt=item.prompt?`<div class="choice">${item.prompt}</div>`:'';return `<div class="card"><div class="row">${renderVisual(text)}<div class="jp-area" data-text="${encodeURIComponent(text)}"><div class="jp"><b>${item.no||i+1}.</b> ${item.speaker?`<span class="speaker">${item.speaker}：</span>`:''}${text}</div>${item.note?`<div class="choice">${item.note}</div>`:''}${choices}${prompt}<div class="cn">${item.cn||''}</div></div><button class="play-btn" data-play="${encodeURIComponent(text)}">🔊 播放</button></div></div>`}
function renderContent(){const secs=getSections();if(!secs.length){document.getElementById('content').innerHTML=`<div class="empty"><b>${lessonNames[currentLesson-1]}</b><br>この課はまだ PDF に合わせて校正入力していません。</div>`;return}const sec=secs[currentTab];document.body.classList.toggle('show-cn',showChinese);const warn=sec.checked===false?`<div class="warn">${sec.note||'この欄はまだ逐字校对中です。'}</div>`:'';document.getElementById('content').innerHTML=`<div class="section-title">${currentData.title} · ${sec.title}${sec.subtitle?`：${sec.subtitle}`:''}</div><div class="meta">PDF 页码：${sec.page||'-'}　${currentData.source||''}</div>${warn}${sec.items.length?sec.items.map((it,i)=>renderItem(it,i,sec)).join(''):'<div class="empty">この欄は待校对です。</div>'}`;document.querySelectorAll('.play-btn').forEach(btn=>btn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();speak(decodeURIComponent(btn.dataset.play))}));document.querySelectorAll('.jp-area').forEach(area=>area.addEventListener('click',()=>speak(decodeURIComponent(area.dataset.text))))}
function switchLesson(n){stopAudio();loadLesson(n)}function switchTab(i){stopAudio();currentTab=i;renderTabs();renderContent()}function toggleChinese(){showChinese=!showChinese;renderContent()}function toggleVisuals(){showVisuals=!showVisuals;renderContent()}
function playCurrentTab(){stopAudio();const sec=getSections()[currentTab];if(!sec)return;const arr=sec.items.map(getSpeakText).filter(Boolean);let n=0;function next(){if(n>=arr.length)return;const u=new SpeechSynthesisUtterance(cleanText(arr[n]));u.lang='ja-JP';u.rate=.86;u.onend=()=>{n++;setTimeout(next,400)};speechSynthesis.speak(u)}next()}
renderLessonSelect();loadLesson(1);
</script>
</body>
</html>
