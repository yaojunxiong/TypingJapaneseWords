<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>みんなの日本語 第1課 点读 V1</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;background:#f3f4f6;color:#111827}
header{position:sticky;top:0;background:#fffffff2;backdrop-filter:blur(10px);border-bottom:1px solid #e5e7eb;padding:14px 16px;z-index:10}
h1{font-size:22px;margin:0}.sub{font-size:13px;color:#6b7280;margin-top:4px;line-height:1.6}
main{max-width:880px;margin:0 auto;padding:16px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
button{border:0;border-radius:999px;background:#2563eb;color:white;padding:10px 15px;font-size:14px;cursor:pointer}.secondary{background:#e5e7eb;color:#111827}
.section{margin-top:22px}.section h2{font-size:22px;border-left:6px solid #111827;padding-left:10px}.section-sub{font-size:16px;color:#4b5563;margin:-4px 0 12px 16px}
.card{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 4px 14px rgba(0,0,0,.04)}
.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.jp{font-size:22px;line-height:1.7;cursor:pointer}.cn{color:#6b7280;font-size:15px;margin-top:6px}.tag{display:inline-block;background:#eef2ff;color:#3730a3;border-radius:999px;padding:3px 9px;font-size:12px;margin-left:8px}.speaker{display:inline-block;min-width:62px;font-weight:700;color:#374151}
.notice{background:#fff7ed;border:1px solid #fed7aa;color:#7c2d12;border-radius:16px;padding:12px;line-height:1.7;font-size:14px}
@media(max-width:640px){main{padding:12px}.row{grid-template-columns:1fr}.jp{font-size:20px}button{width:100%}.speaker{display:block;margin-bottom:2px}}
</style>
</head>
<body>
<header>
<h1>みんなの日本語 初級Ⅰ 第1課 点读 V1</h1>
<div class="sub">根据你提供的 PDF 第1课整理：文型・例文・会話。点击日语句子或播放按钮朗读。</div>
</header>
<main>
<div class="notice">已补充 PDF 第7页「会話：初めまして」。语音使用浏览器/iOS/Android 系统自带日语 TTS。</div>
<div class="toolbar">
<button onclick="playAll()">▶ 播放全部</button>
<button class="secondary" onclick="stopAudio()">■ 停止</button>
<button class="secondary" onclick="toggleChinese()">中文显示/隐藏</button>
</div>
<div id="content"></div>
</main>
<script>
const sections=[
{title:'文型',subtitle:'PDF 第6页',items:[
['','わたしは マイク・ミラーです。','我是迈克·米勒。'],
['','サントスさんは 学生じゃ ありません。','桑托斯先生不是学生。'],
['','ミラーさんは 会社員ですか。','米勒先生是公司职员吗？'],
['','サントスさんも 会社員です。','桑托斯先生也是公司职员。']
]},
{title:'例文',subtitle:'PDF 第6页',items:[
['','［あなたは］マイク・ミラーさんですか。','您是迈克·米勒先生吗？'],
['','はい、［わたしは］マイク・ミラーです。','是的，我是迈克·米勒。'],
['','ミラーさんは 学生ですか。','米勒先生是学生吗？'],
['','いいえ、［わたしは］学生じゃ ありません。','不，我不是学生。'],
['','ワンさんは 銀行員ですか。','王先生是银行职员吗？'],
['','いいえ、［ワンさんは］銀行員じゃ ありません。医者です。','不，王先生不是银行职员。是医生。'],
['','あの 方は どなたですか。','那位是谁？'],
['','ワットさんです。さくら大学の 先生です。','是瓦特先生。是樱花大学的老师。'],
['','グプタさんは 会社員ですか。','古普塔先生是公司职员吗？'],
['','はい、会社員です。','是的，是公司职员。'],
['','カリナさんも 会社員ですか。','卡莉娜也是公司职员吗？'],
['','いいえ、［カリナさんは］学生です。','不，卡莉娜是学生。'],
['','テレーザちゃんは 何歳ですか。','特蕾莎几岁？'],
['','9歳です。','9岁。']
]},
{title:'会話',subtitle:'PDF 第7页：初めまして',items:[
['佐藤','おはよう ございます。','早上好。'],
['山田','おはよう ございます。','早上好。'],
['山田','佐藤さん、こちらは マイク・ミラーさんです。','佐藤女士，这位是迈克·米勒先生。'],
['ミラー','初めまして。','初次见面。'],
['ミラー','マイク・ミラーです。','我是迈克·米勒。'],
['ミラー','アメリカから 来ました。','我来自美国。'],
['ミラー','どうぞ よろしく。','请多关照。'],
['佐藤','佐藤けい子です。','我是佐藤惠子。'],
['佐藤','どうぞ よろしく。','请多关照。']
]}
];
let showChinese=true;
function cleanText(text){return text.replace(/[\[\]［］]/g,'')}
function speak(text){stopAudio();const u=new SpeechSynthesisUtterance(cleanText(text));u.lang='ja-JP';u.rate=.86;u.pitch=1;const v=speechSynthesis.getVoices().find(x=>x.lang&&x.lang.toLowerCase().startsWith('ja'));if(v)u.voice=v;speechSynthesis.speak(u)}
function stopAudio(){speechSynthesis.cancel()}
function render(){document.getElementById('content').innerHTML=sections.map(sec=>`<section class="section"><h2>${sec.title}<span class="tag">点读</span></h2>${sec.subtitle?`<div class="section-sub">${sec.subtitle}</div>`:''}${sec.items.map((it,i)=>`<div class="card"><div class="row"><div onclick="speak(${JSON.stringify(it[1])})"><div class="jp"><b>${i+1}.</b> ${it[0]?`<span class="speaker">${it[0]}：</span>`:''}${it[1]}</div>${showChinese?`<div class="cn">${it[2]}</div>`:''}</div><button onclick="speak(${JSON.stringify(it[1])})">🔊 播放</button></div></div>`).join('')}</section>`).join('')}
function toggleChinese(){showChinese=!showChinese;render()}
function playAll(){stopAudio();const arr=sections.flatMap(s=>s.items.map(i=>i[1]));let n=0;function next(){if(n>=arr.length)return;const u=new SpeechSynthesisUtterance(cleanText(arr[n]));u.lang='ja-JP';u.rate=.86;u.onend=()=>{n++;setTimeout(next,500)};speechSynthesis.speak(u)}next()}
speechSynthesis.onvoiceschanged=()=>{};render();
</script>
</body>
</html>
