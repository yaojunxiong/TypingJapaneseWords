<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日语对话练习</title>
    <script src="jquery.min.js"></script>
    <script src="bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"> 
    <style>
        .video-responsive {
            max-width: 100%;
            height: auto;
        }
    </style>

    <script src="lang.js"></script>
    <link rel="stylesheet" href="styles.css">


</head>
<body class="theme-green">
    <!-- 导航栏 -->
    <div id="navbar"></div>
    <!-- 视频内容 --> 
    <div class="container-fluid text-center mt-3">
        <video class="video-responsive" controls>
            <source src="Japanese_for_Everyone_Conversation_P1.mp4" type="video/mp4">
            はじめまして
        </video> 
        </div>
    <!-- 主题切换 & 导航栏加载 -->
    <script src="theme.js"></script>
    <script>
        // 动态加载导航栏
        fetch('navbar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navbar').innerHTML = data;

                // 确保 `lang.js` 在 `navbar.html` 加载后执行
                const scriptLang = document.createElement("script");
                scriptLang.src = "lang.js";
                document.body.appendChild(scriptLang);
            });
    </script>
</body>
</html>
