<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>日语词卡练习</title>
    <style>
        :root {
            --bg-color: #f5f5f5;
            --card-bg: #ffffff;
            --card-border: #ccc;
            --text-color: #222;
            --accent-color: #007bff;
            --success-color: #28a745;
            --error-color: #dc3545;
            --shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: "Segoe UI", sans-serif;
            padding: 20px;
            background: var(--bg-color);
            color: var(--text-color);
        }

        h2 {
            color: var(--accent-color);
        }

        .card-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 12px 16px;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            box-shadow: var(--shadow);
            text-align: center;
            width: 130px;
            user-select: none;
            transition: all 0.3s ease;
            position: relative;
            color: var(--text-color);
        }

            .card.selected {
                background: rgba(0, 123, 255, 0.2);
                border-color: var(--accent-color);
            }

            .card.matched {
                opacity: 0;
                pointer-events: none;
                transform: translateY(-50px);
                transition: opacity 0.5s ease, transform 0.5s ease;
            }

        .game-area {
            display: none;
            flex-direction: row;
            justify-content: center;
            gap: 40px;
            flex-wrap: nowrap;
            margin-top: 20px;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #feedback {
            color: var(--error-color);
            margin-top: 10px;
            font-weight: bold;
        }

        #success {
            margin-top: 15px;
            font-size: 20px;
            color: var(--success-color);
            font-weight: bold;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: var(--shadow);
            transition: background 0.3s ease;
        }

            button:hover {
                background-color: #0056b3;
            }

        a.button {
            display: inline-block;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 8px;
            margin-top: 10px;
            box-shadow: var(--shadow);
        }

            a.button:hover {
                background-color: #0056b3;
            }

        @media (max-width: 600px) {
            .game-area {
                flex-direction: row;
                flex-wrap: nowrap;
                overflow-x: auto;
            }

            .column {
                min-width: 140px;
                align-items: center;
            }
        }

        @keyframes shake {
            0% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            50% {
                transform: translateX(5px);
            }

            75% {
                transform: translateX(-5px);
            }

            100% {
                transform: translateX(0);
            }
        }

        .card.shake {
            animation: shake 0.3s;
        }
    </style>
</head>
<body>
    

    <div class="card-grid" id="wordCards"></div>

    <button onclick="generateMatchingGame()">🎮 开始连连看游戏</button>

    <div class="game-area" id="gameArea">
        <div class="column" id="jpColumn"></div>
        <div class="column" id="cnColumn"></div>
    </div>

    <div id="feedback"></div>
    <div id="success"></div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const sentence = params.get("sentencePara");
         

        let globalWordData = [];

        fetch("Japanese_sentence_word_cards.json")
            .then(response => response.json())
            .then(data => {
                const wordData = data[sentence];
                if (!wordData) {
                    document.getElementById("wordCards").innerHTML = `<p>❌ 找不到该句子的词卡数据。<br>句子参数：<code>${sentence}</code></p>`;
                    return;
                }

                globalWordData = wordData;

                const cardContainer = document.getElementById('wordCards');
                wordData.forEach(w => {
                    const div = document.createElement('div');
                    div.className = 'card';
                    div.innerHTML = `<strong>${w.jp}</strong><br><small>${w.reading}</small><br><em>${w.meaning}</em>`;
                    cardContainer.appendChild(div);
                });
            })
            .catch(err => {
                document.getElementById("wordCards").innerHTML = "<p>❌ 加载词卡数据失败。</p>";
                console.error(err);
            });

        function generateMatchingGame() {
            const wordData = globalWordData;
            if (!wordData || wordData.length === 0) return;

            const jpCol = document.getElementById('jpColumn');
            const cnCol = document.getElementById('cnColumn');
            const feedback = document.getElementById('feedback');
            const success = document.getElementById('success');

            jpCol.innerHTML = '';
            cnCol.innerHTML = '';
            feedback.textContent = '';
            success.textContent = '';
            document.getElementById('gameArea').style.display = 'flex';

            let selectedJP = null;
            let selectedCN = null;
            let matchedCount = 0;

            const jpCards = [...wordData].map((w, i) => ({ text: w.jp, matchId: i }));
            const cnCards = [...wordData].map((w, i) => ({ text: w.meaning, matchId: i }));

            jpCards.sort(() => Math.random() - 0.5);
            cnCards.sort(() => Math.random() - 0.5);

            function createCard(text, matchId, type) {
                const div = document.createElement('div');
                div.className = 'card';
                div.textContent = text;
                div.dataset.match = matchId;
                div.dataset.type = type;

                div.addEventListener('click', () => {
                    if (div.classList.contains('matched')) return;

                    if (type === 'jp') {
                        if (selectedJP) selectedJP.classList.remove('selected');
                        selectedJP = div;
                        div.classList.add('selected');
                    } else {
                        if (selectedCN) selectedCN.classList.remove('selected');
                        selectedCN = div;
                        div.classList.add('selected');
                    }

                    if (selectedJP && selectedCN) {
                        if (selectedJP.dataset.match === selectedCN.dataset.match) {
                            const jpRef = selectedJP;
                            const cnRef = selectedCN;

                            selectedJP = null;
                            selectedCN = null;
                            matchedCount++;

                            feedback.textContent = '';

                            setTimeout(() => {
                                jpRef.classList.add("matched");
                                cnRef.classList.add("matched");

                                setTimeout(() => {
                                    jpRef.remove();
                                    cnRef.remove();

                                    if (matchedCount === wordData.length) {
                                        success.textContent = '🎉 よくできました！つぎもがんばってね！';
                                    }
                                }, 500);
                            }, 300);
                        } else {
                            feedback.textContent = '❌ 配对错误，请再试一次！';
                            selectedJP.classList.add('shake');
                            selectedCN.classList.add('shake');

                            setTimeout(() => {
                                selectedJP.classList.remove('selected', 'shake');
                                selectedCN.classList.remove('selected', 'shake');
                                selectedJP = null;
                                selectedCN = null;
                            }, 500);
                        }
                    }
                });

                return div;
            }

            jpCards.forEach(c => jpCol.appendChild(createCard(c.text, c.matchId, 'jp')));
            cnCards.forEach(c => cnCol.appendChild(createCard(c.text, c.matchId, 'cn')));
        }
    </script>
</body>
</html>
