<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日语句子视频与链接</title>

    <!-- 引入 Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- 引入 DataTables CSS -->
    <link href="https://cdn.jsdelivr.net/npm/datatables.net-bs5@2.1.1/css/dataTables.bootstrap5.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Arial', sans-serif;
            padding: 20px;
            background-color: #f9f9f9;
            margin: 0;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            max-width: 900px;
            margin: 0 auto;
        }

        th, td {
            text-align: left;
            padding: 12px;
            border: 1px solid #ddd;
            font-size: 16px;
        }

        th {
            background-color: #f4f4f4;
            color: #333;
        }

        td a {
            color: #007bff;
            text-decoration: none;
            transition: color 0.3s ease;
        }

            td a:hover {
                color: #0056b3;
            }

            td a:active {
                color: #004085;
            }

        tr:hover {
            background-color: #f1f1f1;
        }
    </style>
</head>
<body>

    <h1>日语句子与视频列表</h1>

    <!-- 使用 DataTables 插件展示表格 -->
    <table id="sentenceTable" class="table table-striped table-bordered">
        <thead>
            <tr>
                <th>句子</th>
                <th>跳转链接</th>
                <th>视频链接</th>
            </tr>
        </thead>
        <tbody id="sentenceList"></tbody>
    </table>

    <!-- 引入 jQuery 和 DataTables JS -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/datatables.net@2.1.1/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/datatables.net-bs5@2.1.1/js/dataTables.bootstrap5.min.js"></script>

    <script>
        // 使用fetch从Japanese_sentence_word_cards.json加载句子数据
        fetch('Japanese_sentence_word_cards.json')
            .then(response => response.json())
            .then(data => {
                // 获取句子的表格 tbody 元素
                const listElement = document.getElementById('sentenceList');

                // 获取视频信息
                fetch('videos.json')
                    .then(response => response.json())
                    .then(videosData => {
                        // 遍历JSON句子数据并生成HTML表格行
                        for (const sentence in data) {
                            if (data.hasOwnProperty(sentence)) {
                                const listItem = document.createElement('tr');

                                // URL编码
                                const encodedSentence = encodeURIComponent(sentence);
                                const sentenceLink = `Japanese_sentence_word_cards.html?sentencePara=${encodedSentence}`;

                                // 查找对应的视频文件
                                const video = videosData.find(video => video.rawText.includes(sentence));
                                const videoLink = video ? video.file : '#'; // 若没有找到对应的视频则显示"#"

                                // 创建句子列
                                const sentenceCell = document.createElement('td');
                                const sentenceAnchor = document.createElement('a');
                                sentenceAnchor.href = sentenceLink;
                                sentenceAnchor.textContent = sentence;
                                sentenceCell.appendChild(sentenceAnchor);

                                // 创建跳转链接列
                                const linkCell = document.createElement('td');
                                const linkAnchor = document.createElement('a');
                                linkAnchor.href = sentenceLink;
                                linkAnchor.textContent = '查看句子';
                                linkCell.appendChild(linkAnchor);

                                // 创建视频链接列
                                const videoCell = document.createElement('td');
                                const videoAnchor = document.createElement('a');
                                videoAnchor.href = videoLink;
                                videoAnchor.textContent = videoLink !== '#' ? '查看视频' : '无视频';
                                videoCell.appendChild(videoAnchor);

                                // 将所有列添加到表格行
                                listItem.appendChild(sentenceCell);
                                listItem.appendChild(linkCell);
                                listItem.appendChild(videoCell);

                                // 将表格行添加到表格主体
                                listElement.appendChild(listItem);
                            }
                        }

                        // 初始化 DataTables 插件以启用搜索、排序和分页功能
                        $('#sentenceTable').DataTable();
                    })
                    .catch(error => {
                        console.error('Error loading videos.json:', error);
                    });
            })
            .catch(error => {
                console.error('Error loading Japanese_sentence_word_cards.json:', error);
            });
    </script>

</body>
</html>
