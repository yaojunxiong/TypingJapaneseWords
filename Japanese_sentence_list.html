<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>重要日语句子句子</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- DataTables -->
    <link href="https://cdn.jsdelivr.net/npm/datatables.net-bs5@2.1.1/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/datatables.net-responsive-bs5@2.5.0/css/responsive.bootstrap5.min.css" rel="stylesheet" />

    <style>
        body {
            background-color: #f8f9fa;
        }

        h1 {
            font-size: 1.5rem;
            margin: 1rem 0;
            text-align: center;
            color: #343a40;
        }

        td a {
            text-decoration: none;
        }

            td a:hover {
                text-decoration: underline;
            }

        /* 分页按钮美化 */
        .dataTables_wrapper .dataTables_paginate .paginate_button {
            padding: 0.25rem 0.6rem;
            margin: 0 2px;
            border-radius: 0.25rem;
            border: 1px solid #dee2e6;
            color: #007bff !important;
        }

            .dataTables_wrapper .dataTables_paginate .paginate_button.current {
                background-color: #0d6efd;
                color: #fff !important;
                border: 1px solid #0d6efd;
            }

            .dataTables_wrapper .dataTables_paginate .paginate_button:hover {
                background-color: #e9ecef;
            }

        .dataTables_wrapper .dataTables_info,
        .dataTables_wrapper .dataTables_length,
        .dataTables_wrapper .dataTables_filter {
            font-size: 0.9rem;
        }

        @media (max-width: 576px) {
            .dataTables_wrapper .dataTables_length,
            .dataTables_wrapper .dataTables_filter,
            .dataTables_wrapper .dataTables_info {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <!-- 背景音乐 -->
    <audio id="bgm" autoplay loop>
        <source src="BGM/bgm_piano_gentle2.mp3" type="audio/mpeg">
        您的浏览器不支持音频播放。
    </audio>
    <div class="container py-3">
        <h1>📘 重要日语句子列表</h1>

        <div class="table-responsive">
            <table id="sentenceTable" class="table table-striped table-bordered align-middle">
                <thead class="table-light">
                    <tr>
                        <th>句子</th>
                        <th>跳转</th>
                    </tr>
                </thead>
                <tbody id="sentenceList"></tbody>
            </table>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/datatables.net@2.1.1/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/datatables.net-bs5@2.1.1/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/datatables.net-responsive@2.5.0/js/dataTables.responsive.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/datatables.net-responsive-bs5@2.5.0/js/responsive.bootstrap5.min.js"></script>

    <script>
        document.getElementById("bgm").volume = 0.2;  // 20% 音量
        fetch('Japanese_sentence_word_cards.json')
            .then(res => res.json())
            .then(data => {
                const listElement = document.getElementById('sentenceList');

                // ✅ 倒序遍历 JSON 中的句子（新加的句子在最前面）
                const entries = Object.entries(data).reverse();

                for (const [sentence] of entries) {
                    const encoded = encodeURIComponent(sentence);
                    const sentenceLink = `Japanese_sentence_word_cards.html?sentencePara=${encoded}`;
                    const row = document.createElement('tr');

                    row.innerHTML = `
                            <td>${sentence}</td>
                            <td><a href="${sentenceLink}" class="btn btn-outline-primary btn-sm w-100">查看句子</a></td>
                        `;

                    listElement.appendChild(row);
                }

                // ✅ 初始化 DataTable，保留倒序后的插入顺序
                $('#sentenceTable').DataTable({
                    responsive: true,
                    order: [],  // 不对列进行排序，保持上面手动添加的倒序顺序
                    language: {
                        search: "🔍 搜索：",
                        lengthMenu: "显示 _MENU_ 条/页",
                        info: "第 _START_ - _END_ 条，共 _TOTAL_ 条",
                        paginate: {
                            next: "▶",
                            previous: "◀"
                        }
                    },
                    drawCallback: function () {
                        $('.dataTables_paginate .pagination')
                            .addClass('pagination-sm justify-content-center mb-0');
                        $('.dataTables_info').addClass('text-center pt-2');
                        $('.dataTables_length').addClass('text-center mb-2');
                    }
                });
            });
    </script>

</body>
</html>
