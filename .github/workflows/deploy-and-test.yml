name: Auto Deploy & Test

on:
  push:
    branches: [master]
    paths:
      - 'next-app/**'
      - '.github/workflows/deploy-and-test.yml'
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: next-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify recitation data
        run: npm run verify:recitation
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  deploy-and-test:
    needs: build-and-verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Wait for Vercel Production Deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.sha }}"
          REPO="${{ github.repository }}"
          # Vercel environment names have changed over time; try all known candidates
          ENV_NAMES=("Production" "Production – next-app" "Production – typing-japanese-words")
          echo "Waiting for Vercel deployment for commit ${SHA:0:8}..."
          echo "Candidate environments: ${ENV_NAMES[*]}"

          FOUND_DEPLOYMENT="false"
          for i in $(seq 1 60); do
            for VERCEL_ENV in "${ENV_NAMES[@]}"; do
              DEPLOY_ID=$(gh api "repos/${REPO}/deployments" \
                --jq "[.[] | select(.sha == \"$SHA\" and .environment == \"$VERCEL_ENV\")][0].id")

              if [ -n "$DEPLOY_ID" ] && [ "$DEPLOY_ID" != "null" ]; then
                FOUND_DEPLOYMENT="true"
                STATE=$(gh api "repos/${REPO}/deployments/${DEPLOY_ID}/statuses" \
                  --jq "[.[] | select(.environment == \"$VERCEL_ENV\")][0].state")

                if [ -n "$STATE" ] && [ "$STATE" != "null" ]; then
                  echo "Attempt $i/60: env=$VERCEL_ENV state=$STATE"

                  if [ "$STATE" = "success" ]; then
                    echo "Vercel production deployment completed!"
                    exit 0
                  fi

                  if [ "$STATE" = "failure" ] || [ "$STATE" = "error" ]; then
                    echo "Vercel deployment failed (env=$VERCEL_ENV state=$STATE)"
                    exit 1
                  fi
                fi
              fi
            done

            echo "Attempt $i/60: deployment not yet created by Vercel..."
            sleep 15
          done

          if [ "$FOUND_DEPLOYMENT" = "true" ]; then
            echo "Timed out waiting for Vercel deployment to become ready."
            echo "This means deployment metadata exists but did not report success in time."
            exit 1
          fi

          echo "No Vercel deployment metadata appeared for this SHA."
          echo "Direct production checks must prove the production alias is serving this SHA."
          exit 0

      - name: Verify Production SHA and smoke routes
        run: |
          URL="https://study.jimmyyao.com"
          SHA="${{ github.sha }}"
          echo "Health checking $URL..."

          VERSION_ROUTE="/api/deployment/version"
          ROUTES=(
            "/"
            "/lessons/1/ai-practice"
            "/lessons/6/ai-practice"
            "/lessons/25/ai-practice"
          )

          for i in $(seq 1 12); do
            VERSION_JSON=$(curl -sSf "${URL}${VERSION_ROUTE}" 2>/dev/null || true)
            PRODUCTION_SHA=$(node -e 'try { const data = JSON.parse(process.argv[1] || "{}"); process.stdout.write(data.commitSha || ""); } catch { process.exit(1); }' "$VERSION_JSON" 2>/dev/null || true)
            echo "Attempt $i: ${VERSION_ROUTE} commitSha=${PRODUCTION_SHA:-missing} expected=${SHA}"

            if [ -z "$PRODUCTION_SHA" ]; then
              echo "Production SHA proof unavailable; retrying..."
              sleep 10
              continue
            fi

            if [ "$PRODUCTION_SHA" != "$SHA" ]; then
              echo "Production alias is not serving the current SHA yet."
              echo "Expected: $SHA"
              echo "Actual:   $PRODUCTION_SHA"
              sleep 10
              continue
            fi

            FAILED="false"
            for ROUTE in "${ROUTES[@]}"; do
              HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' "${URL}${ROUTE}" 2>/dev/null || echo "fail")
              echo "Attempt $i: ${ROUTE} HTTP $HTTP_CODE"
              if [ "$HTTP_CODE" != "200" ]; then
                FAILED="true"
              fi
            done

            if [ "$FAILED" = "false" ]; then
              echo "Production alias is serving the current SHA and smoke routes responded with 200"
              exit 0
            fi

            sleep 10
          done

          echo "Production verification failed: could not prove current SHA and healthy smoke routes."
          exit 1

      - name: Trigger Auto Test
        env:
          GH_TOKEN: ${{ secrets.AUTO_TEST_PAT }}
        run: |
          echo "Triggering auto-test on yaojunxiong/jimmyyao-auto-test..."
          gh workflow run test.yml \
            --repo yaojunxiong/jimmyyao-auto-test \
            --ref main 2>&1
          echo ""
          echo "Auto test triggered!"
          echo "https://github.com/yaojunxiong/jimmyyao-auto-test/actions"
