<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>大家的日本語 字幕播放器</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background-color: #111;
            color: #fff;
            padding: 20px;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        .subtitles-container {
            border: 1px solid #444;
            background-color: #222;
            border-radius: 10px;
            padding: 10px;
            overflow-y: auto;
            max-height: 400px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.6);
        }

        .subtitle {
            opacity: 0.7;
            transition: all 0.3s ease;
            text-align: center;
            margin-bottom: 6px;
            cursor: pointer;
        }

            .subtitle span {
                display: block;
            }

            .subtitle .japanese {
                color: #ffcc00;
            }

            .subtitle .chinese {
                color: #ffffff;
            }

        .active {
            opacity: 1;
            color: #00ffff;
            background-color: rgba(255, 255, 255, 0.1);
            font-weight: bold;
            font-size: 1.2rem;
            border-radius: 5px;
            padding: 4px 6px;
        }

        video {
            max-height: 480px;
            border: 2px solid #555;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <h1 class="text-center text-warning mb-4">📚 大家的日本語 字幕播放器</h1>

    <div class="container">
        <div class="row">
            <div class="col-md-4 mb-3">
                <table class="table table-dark table-hover table-sm">
                    <thead><tr><th>課次</th></tr></thead>
                    <tbody id="playlist-table"></tbody>
                </table>
                <nav><ul class="pagination justify-content-center" id="pagination"></ul></nav>
            </div>
            <div class="col-md-8">
                <video controls id="video" class="w-100 mb-3">
                    <source id="audioSource" src="" type="video/mp4" />
                    您的浏览器不支持 video 标签。
                </video>
                <div id="subtitles" class="subtitles-container">
                    <p class="text-center text-muted">字幕加载中...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const fileList = Array.from({ length: 50 }, (_, i) => {
            const num = i + 1;
            return `大家的日本语第2版-会话_P${num}_第${num}課`;
        });

        let currentFile = "";
        let currentSubtitles = [];
        let lastActive = null;
        const pageSize = 5;
        let currentPage = 1;

        async function loadSubtitles(filename) {
            try {
                const res = await fetch(`${filename}.json`);
                const data = await res.json();
                return data.map(sub => ({
                    start: sub.start, // ✅ 直接使用纯数字时间戳
                    end: sub.end,
                    jp: sub.jp,
                    zh: sub.zh,
                    element: null
                }));
            } catch (e) {
                document.getElementById("subtitles").innerHTML =
                    `<p class="text-danger">❌ 無法加載字幕：${filename}.json</p>`;
                return [];
            }
        }

        async function setAudioAndSubtitles(filename) {
            currentFile = filename;
            const video = document.getElementById("video");
            document.getElementById("audioSource").src = `${filename}.mp4`;
            video.load();

            const subtitlesData = await loadSubtitles(filename);
            const container = document.getElementById("subtitles");
            container.innerHTML = "";
            lastActive = null;
            currentSubtitles = subtitlesData;

            subtitlesData.forEach(line => {
                const div = document.createElement("div");
                div.className = "subtitle";
                div.innerHTML = `<span class="japanese">${line.jp}</span><span class="chinese">${line.zh}</span>`;
                div.onclick = () => {
                    video.currentTime = line.start;
                    video.play();
                };
                container.appendChild(div);
                line.element = div;
            });

            renderTablePage(currentPage); // 不自动播放，避免报错
            video.play(); // ✅ 这行是自动播放的关键
        }

        function renderTablePage(page = 1) {
            currentPage = page;
            const start = (page - 1) * pageSize;
            const end = start + pageSize;
            const currentItems = fileList.slice(start, end);

            const table = document.getElementById("playlist-table");
            table.innerHTML = "";
            currentItems.forEach(file => {
                const row = document.createElement("tr");
                const displayName = file.replace("大家的日本语第2版-会话_", "").replace("課", "课");
                row.innerHTML = `<td>${displayName}</td>`;
                row.style.cursor = "pointer";
                row.onclick = () => setAudioAndSubtitles(file);
                if (file === currentFile) row.classList.add("table-info");
                table.appendChild(row);
            });

            renderPagination(fileList.length, page);
        }

        function renderPagination(totalItems, currentPage) {
            const pageCount = Math.ceil(totalItems / pageSize);
            const pagination = document.getElementById("pagination");
            pagination.innerHTML = "";

            const createPageItem = (page, label = page, active = false, disabled = false) => {
                const li = document.createElement("li");
                li.className = `page-item${active ? " active" : ""}${disabled ? " disabled" : ""}`;
                const a = document.createElement("a");
                a.className = "page-link";
                a.href = "#";
                a.innerText = label;
                a.onclick = (e) => {
                    e.preventDefault();
                    if (!disabled) renderTablePage(page);
                };
                li.appendChild(a);
                return li;
            };

            pagination.appendChild(createPageItem(currentPage - 1, "«", false, currentPage === 1));
            for (let i = 1; i <= pageCount; i++) {
                pagination.appendChild(createPageItem(i, i, currentPage === i));
            }
            pagination.appendChild(createPageItem(currentPage + 1, "»", false, currentPage === pageCount));
        }

        function syncSubtitles() {
            const video = document.getElementById("video");
            video.ontimeupdate = () => {
                const t = video.currentTime;
                currentSubtitles.forEach(line => {
                    const isActive = t >= line.start && t < line.end;
                    if (isActive && !line.element.classList.contains("active")) {
                        if (lastActive) lastActive.classList.remove("active");
                        line.element.classList.add("active");
                        line.element.scrollIntoView({ behavior: "smooth", block: "center" });
                        lastActive = line.element;
                    }
                });
            };

            video.onended = () => {
                document.getElementById("subtitles").scrollTo({ top: 0, behavior: "smooth" });
                if (lastActive) lastActive.classList.remove("active");
                lastActive = null;
            };
        }

        function init() {
            renderTablePage();
            setAudioAndSubtitles(fileList[0]);
            syncSubtitles();
        }

        init();
    </script>
</body>
</html>
