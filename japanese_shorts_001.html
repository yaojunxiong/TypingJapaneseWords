<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>日语対話練習</title>
    <link href="japanese_shorts.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.14.0/Sortable.min.js"></script> 
    <script src="kuromoji.js"></script> <!-- 形态素分析 -->
</head>
<body>

    <div class="container">
        <!-- 视频区 -->
        <div class="video-section">
            <video controls autoplay loop playsinline>
                <source id="video-source" src="" type="video/mp4" />
                お使いのブラウザは video タグをサポートしていません。
            </video>
        </div>

        <!-- 拖拽练习区 -->
        <div class="practice-section">
            <h2>🎌 ドラッグして正しい順に並べよう</h2>

            <!-- 女生对话 -->
            <div class="dialogue">
                <div class="speaker">
                    <img src="img/女の子.png" alt="girl" />
                    <span id="text1"></span>
                </div>
                <ul class="word-list" id="list1"></ul>
                <button onclick="checkAnswer('list1', answer1, 'result1')">答え合わせ</button>
                <div class="result" id="result1"></div>
            </div>

            <!-- 男生对话 -->
            <div class="dialogue">
                <div class="speaker">
                    <img src="img/男の子.png" alt="boy" />
                    <span id="text2"></span>
                </div>
                <ul class="word-list" id="list2"></ul>
                <button onclick="checkAnswer('list2', answer2, 'result2')">答え合わせ</button>
                <div class="result" id="result2"></div>
            </div>
        </div>
    </div>

    <!-- 页码跳转按钮 -->
    <div style="text-align: center; margin: 50px 0 80px;">
        <button class="anime-button pink" onclick="goToPage(-1)">⬅️ 前のページ</button>
        <button class="anime-button blue" onclick="goToPage(1)">➡️ 次のページ</button>
    </div>

    <!-- 日系提示框 -->
    <div id="page-tip"></div>

    <!-- ✨ 只写这句！ -->
    <script>
        const rawText = "「このドーナツ 美味しいね」「うん もう3個食べちゃったよ」";
    </script>

    <!-- 功能逻辑 -->
    <script src="japanese_shorts_combined.js"></script>

</body>
</html>
