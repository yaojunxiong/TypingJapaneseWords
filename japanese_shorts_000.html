<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>日语对话练习</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.14.0/Sortable.min.js"></script>
    <style>
        body {
            font-family: "Helvetica Neue", sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9ff;
        }

        .container {
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .container {
                flex-direction: row;
            }

            .video-section, .practice-section {
                flex: 1;
            }
        }

        .video-section video {
            width: 100%;
            max-height: 400px;
            border-radius: 8px;
        }

        .speaker {
            display: flex;
            align-items: center;
            margin: 16px 0 8px;
            font-weight: bold;
            font-size: 18px;
        }

            .speaker img {
                width: 36px;
                height: 36px;
                border-radius: 50%;
                margin-right: 10px;
                object-fit: cover;
            }

        ul.word-list {
            list-style: none;
            padding: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }

            ul.word-list li {
                background-color: #fff;
                border: 1px solid #ccc;
                padding: 8px 12px;
                border-radius: 8px;
                cursor: grab;
                font-size: 16px;
                user-select: none;
                box-shadow: 1px 1px 4px rgba(0,0,0,0.1);
            }

        .result {
            font-size: 16px;
            font-weight: bold;
        }

        button {
            padding: 6px 12px;
            border: none;
            background-color: #4caf50;
            color: white;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }

            button:hover {
                background-color: #45a049;
            }
    </style>
</head>
<body>

    <div class="container">

        <!-- 左：视频区 -->
        <div class="video-section">
            <video controls="controls">
                <source src="video/%e3%80%8c%e3%81%93%e3%81%ae%e3%83%89%e3%83%bc%e3%83%8a%e3%83%84%20%e7%be%8e%e5%91%b3%e3%81%97%e3%81%84%e3%81%ad%e3%80%8d%e3%80%8c%e3%81%86%e3%82%93%20%e3%82%82%e3%81%863%e5%80%8b%e9%a3%9f%e3%81%b9%e3%81%a1%e3%82%83%e3%81%a3%e3%81%9f%e3%82%88%e3%80%8d.mp4" type="video/mp4" />
            </video>

        </div>

        <!-- 右：练习区 -->
        <div class="practice-section">
            <h2>🎌 ドラッグして正しい順に並べよう</h2>

            <!-- 女生对话 -->
            <div class="dialogue">
                <div class="speaker">
                    <img src="img/女の子.png" alt="girl" />
                    女：「このドーナツ 美味しいね」
                </div>
                <ul class="word-list" id="list1"></ul>
                <button onclick="checkAnswer('list1', answer1, 'result1')">答え合わせ</button>
                <div class="result" id="result1"></div>
            </div>

            <!-- 男生对话 -->
            <div class="dialogue">
                <div class="speaker">
                    <img src="img/男の子.png" alt="boy" />
                    男：「うん もう3個食べちゃったよ」
                </div>
                <ul class="word-list" id="list2"></ul>
                <button onclick="checkAnswer('list2', answer2, 'result2')">答え合わせ</button>
                <div class="result" id="result2"></div>
            </div>

        </div>
    </div>

    <script>
        const answer1 = ["この", "ドーナツ", "美味しい", "ね"];
        const answer2 = ["うん", "もう", "3個", "食べちゃった", "よ"];

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function createList(id, words) {
            const list = document.getElementById(id);
            shuffle([...words]).forEach(word => {
                const li = document.createElement('li');
                li.textContent = word;
                list.appendChild(li);
            });
            Sortable.create(list, { animation: 150 });
        }

        function checkAnswer(listId, answer, resultId) {
            const list = Array.from(document.querySelectorAll(`#${listId} li`)).map(li => li.textContent);
            const result = document.getElementById(resultId);
            if (JSON.stringify(list) === JSON.stringify(answer)) {
                result.textContent = "✅ 正解です！";
                result.style.color = "green";
            } else {
                result.textContent = "❌ もう一度やってみよう！";
                result.style.color = "red";
            }
        }

        createList("list1", answer1);
        createList("list2", answer2);
    </script>

</body>
</html>
