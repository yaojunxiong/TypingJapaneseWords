<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="みんなの日本語風格的 AI 互动学习系统课程目录：词汇、语法、例文、听力、测验和角色扮演。">
    <title>みんなの日本語 AI互动学习系统 - 课程目录</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="theme-green">
    <div id="navbar"></div>

    <main class="container my-4 lesson-shell">
        <section class="lesson-hero text-center">
            <span class="badge rounded-pill text-bg-success mb-3">AI互动学习系统 v2</span>
            <h1>みんなの日本語 AI互动学习系统</h1>
            <p class="lead">从“看资料”升级到“听、说、练、测、复习”的日语学习站。</p>
            <div class="progress lesson-progress" role="progressbar" aria-label="学习进度" aria-valuenow="2" aria-valuemin="0" aria-valuemax="100">
                <div class="progress-bar" style="width: 2%">第1课样板已上线</div>
            </div>
        </section>

        <section class="mt-4">
            <h2>课程目录</h2>
            <p class="text-muted">先完成第1课作为标准模板，后续第2～50课可以按同一结构批量扩展。</p>
            <div id="lessonGrid" class="lesson-grid"></div>
        </section>
    </main>

    <footer class="footer">
        <p>© 2026 日语打字练习 | みんなの日本語 AI互动学习系统</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="theme.js"></script>
    <script>
        fetch('navbar.html')
            .then(response => response.text())
            .then(data => document.getElementById('navbar').innerHTML = data);

        const lessonGrid = document.getElementById('lessonGrid');
        for (let i = 1; i <= 50; i++) {
            const card = document.createElement('article');
            const available = i === 1;
            card.className = `lesson-card ${available ? 'available' : 'locked'}`;
            card.innerHTML = `
                <div class="lesson-number">第${i}课</div>
                <h3>${available ? 'N1はN2です' : '准备中'}</h3>
                <p>${available ? '自我介绍、判断句、基础会话' : '后续课程将按统一模板扩展'}</p>
                ${available ? '<a class="btn btn-primary btn-sm" href="lesson_01.html">开始学习</a>' : '<span class="badge text-bg-secondary">未开放</span>'}
            `;
            lessonGrid.appendChild(card);
        }
    </script>
</body>
</html>
