<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>並べ替え練習 - ドラッグで文を完成</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.14.0/Sortable.min.js"></script>
    <script src="../kuromoji.js"></script>
    <style>
        .sortable-item {
            cursor: grab;
            padding: 10px;
            border: 1px solid #ccc;
            margin: 5px;
            border-radius: 8px;
            background-color: #f8f9fa;
            list-style: none;
            display: inline-block;
        }

        .word-list {
            padding: 0;
            min-height: 50px;
        }
    </style>
</head>
<body class="container py-4">

    <h2 class="mb-3">🎌 ドラッグして正しい順に並べよう</h2>

    <!-- 原句显示 -->
    <p><strong>文：</strong> <span id="sentenceText" class="text-primary"></span></p>

    <!-- 拖拽练习 -->
    <div class="dialogue mb-3">
        <ul class="word-list" id="list1"></ul>
        <button class="btn btn-success mt-2" onclick="checkAnswer('list1', answer1, 'result1')">✅ 答え合わせ</button>
        <div class="result mt-2 fw-bold" id="result1"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const sentence = params.get("sentencePara") || "こっちへ来てと友達に手を振って合図した。";
        document.getElementById("sentenceText").textContent = sentence;

        const rawText = sentence;
        let answer1 = [];

        function isIOS() {
            return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        }

        function shuffle(array) {
            const a = [...array];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function createList(id, words) {
            const list = document.getElementById(id);
            if (!list || !Array.isArray(words) || words.length === 0) return;

            list.innerHTML = '';
            const shuffled = shuffle(words);
            shuffled.forEach(word => {
                const li = document.createElement('li');
                li.textContent = word;
                li.classList.add("sortable-item");
                list.appendChild(li);
            });

            Sortable.create(list, {
                animation: 150,
                touchStartThreshold: 5,
                fallbackOnBody: true,
                swapThreshold: 0.65,
                forceFallback: isIOS()
            });
        }

        function checkAnswer(listId, answer, resultId) {
            const userList = Array.from(document.querySelectorAll(`#${listId} li`)).map(li => li.textContent);
            const result = document.getElementById(resultId);
            const isCorrect = JSON.stringify(userList) === JSON.stringify(answer);
            result.textContent = isCorrect ? "✅ 正解です！" : "❌ もう一度やってみよう！";
            result.style.color = isCorrect ? "green" : "red";
        }

        kuromoji.builder({
            dicPath: "../kuromoji/dict"  // 修正路径，指向词典
        }).build(function (err, tokenizer) {
            if (err) {
                console.error("❌ 形態素解析器の初期化に失敗しました:", err);
                return;
            }

            // 分词
            answer1 = tokenizer.tokenize(rawText).map(token => token.surface_form);
            createList("list1", answer1);
        });
    </script>

</body>
</html>
