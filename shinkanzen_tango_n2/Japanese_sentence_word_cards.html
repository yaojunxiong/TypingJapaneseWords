<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📘 日语句子学习</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .iframe-container {
            height: 85vh; /* 保留顶部空间 */
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .loading-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: bold;
            color: #888;
        }
    </style>
</head>
<body>
    <!-- 背景音乐 -->
    <audio id="bgm" autoplay loop>
        <source src="..//BGM/bgm_piano_gentle.mp3" type="audio/mpeg">
        您的浏览器不支持音频播放。
    </audio>

    <div class="container my-4">
        <h2>📘 日语句子学习</h2>
        <p><strong>句子：</strong> <span id="sentenceText">（未指定）</span></p>
        <a href="Japanese_sentence_list.html" class="btn btn-outline-secondary mb-3">← 返回句子列表</a>

        <!-- 标签页导航 -->
        <ul class="nav nav-tabs" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="home-tab" data-bs-toggle="tab" data-bs-target="#home" type="button" role="tab">词卡</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="profile-tab" data-bs-toggle="tab" data-bs-target="#profile" type="button" role="tab">打字</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="contact-tab" data-bs-toggle="tab" data-bs-target="#contact" type="button" role="tab">拖拽</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="grammar-tab" data-bs-toggle="tab" data-bs-target="#grammar" type="button" role="tab">文法</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="short-tab" data-bs-toggle="tab" data-bs-target="#short" type="button" role="tab">视频</button>
            </li>
        </ul>

        <!-- 标签页内容 -->
        <div class="tab-content mt-3" id="myTabContent">
            <div class="tab-pane fade show active" id="home" role="tabpanel">
                <div class="iframe-container">
                    <div class="loading-text">加载中...</div>
                    <iframe id="styleFrame1"></iframe>
                </div>
            </div>
            <div class="tab-pane fade" id="profile" role="tabpanel">
                <div class="iframe-container">
                    <div class="loading-text">加载中...</div>
                    <iframe id="styleFrame2"></iframe>
                </div>
            </div>
            <div class="tab-pane fade" id="contact" role="tabpanel">
                <div class="iframe-container">
                    <div class="loading-text">加载中...</div>
                    <iframe id="styleFrame3"></iframe>
                </div>
            </div>
            <div class="tab-pane fade" id="grammar" role="tabpanel">
                <div class="iframe-container">
                    <div class="loading-text">加载中...</div>
                    <iframe id="styleFrame5"></iframe>
                </div>
            </div>
            <div class="tab-pane fade" id="short" role="tabpanel">
                <div class="iframe-container">
                    <div class="loading-text">加载中...</div>
                    <iframe id="styleFrame4"></iframe>
                </div>
            </div>
        </div>
    </div>

    <!-- 参数解析与 iframe 赋值 -->
    <script>
        document.getElementById("bgm").volume = 0.2;  // 20% 音量

        const params = new URLSearchParams(window.location.search);
        const sentence = params.get("sentencePara");
        const number = params.get("number");

        // 显示句子
        document.getElementById("sentenceText").textContent = sentence || "（未指定）";

        if (sentence || number) {
            const setIframeSrc = (id, url) => {
                const iframe = document.getElementById(id);
                const urlParams = new URLSearchParams();
                if (sentence) urlParams.set("sentencePara", sentence);
                if (number) urlParams.set("number", number);  // 加上 number 参数

                iframe.src = `${url}?${urlParams.toString()}`;
                iframe.onload = () => {
                    const loader = iframe.previousElementSibling;
                    if (loader && loader.classList.contains("loading-text")) {
                        loader.style.display = "none";
                    }
                };
            };

            // 分别给各个 iframe 设置 URL
            setIframeSrc("styleFrame1", "Japanese_sentence_style1.html");
            setIframeSrc("styleFrame2", "Japanese_sentence_style2.html");
            setIframeSrc("styleFrame3", "Japanese_sentence_style3.html");
            setIframeSrc("styleFrame5", "Japanese_sentence_style5.html");
            setIframeSrc("styleFrame4", "Japanese_sentence_style4.html");
        }
    </script>

    <!-- Bootstrap JS + Popper -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
