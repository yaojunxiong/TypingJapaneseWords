<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>重要日语句子列表</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- DataTables -->
    <link href="https://cdn.jsdelivr.net/npm/datatables.net-bs5@2.1.1/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/datatables.net-responsive-bs5@2.5.0/css/responsive.bootstrap5.min.css" rel="stylesheet" />

    <style>
        body {
            background-color: #f8f9fa;
        }

        h1 {
            font-size: 1.5rem;
            margin: 1rem 0;
            text-align: center;
            color: #343a40;
        }

        td a {
            text-decoration: none;
        }

            td a:hover {
                text-decoration: underline;
            }
        /* 分页按钮美化 */
        .dataTables_wrapper .dataTables_paginate .paginate_button {
            padding: 0.25rem 0.6rem;
            margin: 0 2px;
            border-radius: 0.25rem;
            border: 1px solid #dee2e6;
            color: #007bff !important;
        }

            .dataTables_wrapper .dataTables_paginate .paginate_button.current {
                background-color: #0d6efd;
                color: #fff !important;
                border: 1px solid #0d6efd;
            }

            .dataTables_wrapper .dataTables_paginate .paginate_button:hover {
                background-color: #e9ecef;
            }

        .dataTables_wrapper .dataTables_info,
        .dataTables_wrapper .dataTables_length,
        .dataTables_wrapper .dataTables_filter {
            font-size: 0.9rem;
        }

        @media (max-width: 576px) {
            .dataTables_wrapper .dataTables_length,
            .dataTables_wrapper .dataTables_filter,
            .dataTables_wrapper .dataTables_info {
                text-align: center;
            }
        }
        /* 手机端横向滚动 + 单元格不换行 */
        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table td, table th {
            white-space: nowrap;
        }
        /* 播放按钮美化 */
        .play-btn {
            font-size: 0.85rem;
            color: #0d6efd;
        }

            .play-btn:hover {
                color: #0056b3;
            }
    </style>
</head>
<body>
    <!-- 背景音乐 -->
    <audio id="bgm" autoplay loop>
        <source src="../BGM/bgm_piano_gentle2.mp3" type="audio/mpeg">
        您的浏览器不支持音频播放。
    </audio>
    <div class="container py-3">
        <h1>📘 重要日语句子列表</h1>

        <div class="table-responsive">
            <table id="sentenceTable" class="table table-striped table-bordered align-middle">
                <thead class="table-light">
                    <tr>
                        <th>编号</th>
                        <th>词汇</th>
                        <th>汉字</th>
                        <th>词性</th>
                        <th>中文意思</th>
                        <th>日语例句</th>
                        <th>中文翻译</th>
                        <th>跳转</th>
                    </tr>
                </thead>
                <tbody id="sentenceList">
                    <tr><td colspan="8" class="text-center text-muted">加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/datatables.net@2.1.1/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/datatables.net-bs5@2.1.1/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/datatables.net-responsive@2.5.0/js/dataTables.responsive.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/datatables.net-responsive-bs5@2.5.0/js/responsive.bootstrap5.min.js"></script>

    <script>
        document.getElementById("bgm").volume = 0.2;  // 20% 音量

        // 生成播放按钮
        function createPlayButton(text, lang) {
            return `<button class="btn btn-sm btn-link p-0 ms-1 play-btn" data-text="${text}" data-lang="${lang}" title="播放">🔊</button>`;
        }

        fetch('N2_vocab.json')
            .then(res => res.json())
            .then(data => {
                const listElement = document.getElementById('sentenceList');
                listElement.innerHTML = '';  // 清空加载中

                const entries = [...data].reverse();  // 倒序

                for (const item of entries) {
                    const numberField = item.number;
                    const wordField = `${item.word}${createPlayButton(item.word, 'ja-JP')}`;
                    const kanjiField = `${item.kanji}${createPlayButton(item.kanji, 'ja-JP')}`;
                    const posField = `${item.pos}`;  // 不加播放按钮
                    const meaningField = `${item.meaning}${createPlayButton(item.meaning, 'zh-CN')}`;
                    const exampleField = `${item.example}${createPlayButton(item.example, 'ja-JP')}`;
                    const translationField = `${item.translation}${createPlayButton(item.translation, 'zh-CN')}`;
                    const sentenceLink = `Japanese_sentence_word_cards.html?sentencePara=${encodeURIComponent(item.example)}&number=${item.number}`;

                    const row = document.createElement('tr');
                    row.innerHTML = `
                            <td>${numberField}</td>
                            <td>${wordField}</td>
                            <td>${kanjiField}</td>
                            <td>${posField}</td>
                            <td>${meaningField}</td>
                            <td>${exampleField}</td>
                            <td>${translationField}</td>
                            <td><a href="${sentenceLink}" class="btn btn-outline-primary btn-sm w-100">查看句子</a></td>
                        `;
                    listElement.appendChild(row);
                }

                // 初始化 DataTable
                $('#sentenceTable').DataTable({
                    responsive: true,
                    order: [],
                    language: {
                        search: "🔍 搜索：",
                        lengthMenu: "显示 _MENU_ 条/页",
                        info: "第 _START_ - _END_ 条，共 _TOTAL_ 条",
                        paginate: {
                            next: "▶",
                            previous: "◀"
                        }
                    },
                    drawCallback: function () {
                        $('.dataTables_paginate .pagination').addClass('pagination-sm justify-content-center mb-0');
                        $('.dataTables_info').addClass('text-center pt-2');
                        $('.dataTables_length').addClass('text-center mb-2');
                    }
                });
            })
            .catch(err => {
                console.error('加载句子数据失败:', err);
                const listElement = document.getElementById('sentenceList');
                listElement.innerHTML = `<tr><td colspan="8" class="text-center text-danger">无法加载数据，请稍后再试。</td></tr>`;
            });

        // 朗读功能
        document.addEventListener('click', function (e) {
            if (e.target.classList.contains('play-btn')) {
                const btn = e.target;
                const text = btn.getAttribute('data-text');
                const lang = btn.getAttribute('data-lang');
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;

                btn.disabled = true;  // 防止多次点击
                utterance.onend = () => btn.disabled = false;
                utterance.onerror = () => btn.disabled = false;

                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(utterance);
            }
        });
    </script>
</body>
</html>
