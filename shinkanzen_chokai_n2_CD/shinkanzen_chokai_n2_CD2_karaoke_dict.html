<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>新完全听解 N2 - 卡拉OK查词版</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      background: radial-gradient(circle at top, #24243e 0%, #111 40%, #080808 100%);
      color: #fff;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
    }
    .page-wrap {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }
    .hero {
      text-align: center;
      margin-bottom: 18px;
    }
    .hero h1 {
      font-size: 1.9rem;
      margin-bottom: 8px;
      color: #ffd95e;
    }
    .hero p {
      color: #c9c9d6;
      margin: 0;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.65fr) minmax(290px, 380px);
      gap: 18px;
      align-items: start;
    }
    .panel, .dict-panel {
      background: rgba(20, 20, 28, 0.88);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.28);
      padding: 18px;
      backdrop-filter: blur(10px);
    }
    .controls {
      display: grid;
      grid-template-columns: 1.2fr auto auto auto;
      gap: 12px;
      align-items: center;
      margin-bottom: 18px;
    }
    .controls .status {
      color: #b3b6c7;
      font-size: 0.95rem;
      text-align: right;
    }
    .lyrics {
      max-height: 72vh;
      overflow-y: auto;
      padding-right: 8px;
      scroll-behavior: smooth;
    }
    .line {
      margin-bottom: 16px;
      padding: 14px 16px;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.24s ease;
      border: 1px solid transparent;
      background: rgba(255,255,255,0.02);
    }
    .line:hover {
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.08);
    }
    .line.active {
      background: linear-gradient(135deg, rgba(255, 212, 90, 0.12), rgba(120, 215, 255, 0.10));
      border-color: rgba(255, 212, 90, 0.28);
      box-shadow: 0 0 0 1px rgba(255, 212, 90, 0.08), 0 12px 28px rgba(0,0,0,0.24);
      transform: translateY(-1px);
    }
    .line-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 0.88rem;
      color: #9ea3b8;
    }
    .jp-line {
      font-size: 1.6rem;
      line-height: 2.1;
      word-break: break-word;
      margin-bottom: 6px;
    }
    .zh-line {
      font-size: 1rem;
      color: #d8d9e2;
      opacity: 0.92;
    }
    .karaoke-word {
      position: relative;
      display: inline-block;
      margin-right: 0.08em;
      vertical-align: bottom;
      cursor: pointer;
      border-bottom: 1px dotted rgba(255,255,255,0.18);
      border-radius: 6px;
      padding: 0 1px;
    }
    .karaoke-word:hover {
      background: rgba(255,255,255,0.06);
    }
    .karaoke-word .base,
    .karaoke-word .fill {
      white-space: pre;
      font-weight: 700;
      letter-spacing: 0.02em;
      pointer-events: none;
    }
    .karaoke-word .base {
      color: rgba(255,255,255,0.22);
    }
    .karaoke-word .fill {
      position: absolute;
      left: 1px;
      top: 0;
      width: calc(var(--progress, 0) * 1%);
      overflow: hidden;
      color: #ffd54f;
      text-shadow: 0 0 10px rgba(255, 213, 79, 0.5), 0 0 20px rgba(255, 213, 79, 0.18);
    }
    .karaoke-word.done .base {
      color: rgba(255,255,255,0.18);
    }
    .karaoke-word.done .fill {
      width: 100%;
    }
    .karaoke-word.active-word .fill {
      color: #7de7ff;
      text-shadow: 0 0 12px rgba(125, 231, 255, 0.78), 0 0 22px rgba(125, 231, 255, 0.34);
    }
    .karaoke-word.selected {
      outline: 1px solid rgba(125,231,255,0.6);
      background: rgba(125,231,255,0.12);
    }
    .dict-panel {
      position: sticky;
      top: 14px;
    }
    .dict-label {
      color: #aab0c4;
      font-size: 0.9rem;
      margin-bottom: 4px;
    }
    .dict-word {
      font-size: 2rem;
      font-weight: 800;
      color: #ffd95e;
      line-height: 1.2;
    }
    .dict-reading {
      color: #8fe9ff;
      font-size: 1.1rem;
      margin-top: 6px;
    }
    .dict-meaning {
      margin-top: 12px;
      font-size: 1.08rem;
      color: #f1f2f8;
      line-height: 1.7;
    }
    .dict-note {
      color: #b5b9ca;
      font-size: 0.92rem;
      margin-top: 10px;
    }
    .context-box {
      margin-top: 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 14px;
    }
    .context-ja {
      font-size: 1.05rem;
      line-height: 1.8;
      color: #fff5c9;
    }
    .context-zh {
      font-size: 0.96rem;
      line-height: 1.75;
      color: #d7dae8;
      margin-top: 8px;
    }
    .dict-links {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }
    .tips {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      color: #afb3c8;
      font-size: 0.92rem;
      margin-top: 12px;
    }
    .error-box {
      color: #ffb4b4;
      background: rgba(255, 80, 80, 0.08);
      border: 1px solid rgba(255, 80, 80, 0.18);
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
    }
    mark {
      background: rgba(125,231,255,0.25);
      color: #fff;
      padding: 0 4px;
      border-radius: 6px;
    }
    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
      }
      .dict-panel {
        position: static;
      }
    }
    @media (max-width: 780px) {
      .controls {
        grid-template-columns: 1fr 1fr;
      }
      .controls .status {
        text-align: left;
      }
      .jp-line {
        font-size: 1.35rem;
        line-height: 1.95;
      }
      .dict-word {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>
  <div class="page-wrap">
    <div class="hero">
      <h1>🎤 新完全听解 N2 · 卡拉 OK 查词版</h1>
      <p>点击不会的单词，就能在右侧直接看读音和中文意思。</p>
    </div>

    <div class="layout">
      <div class="panel">
        <div class="controls">
          <audio id="audio" controls class="w-100">
            <source id="audioSource" src="" type="audio/mpeg" />
          </audio>
          <button id="toggleZhBtn" class="btn btn-outline-warning">隐藏中文</button>
          <button id="backBtn" class="btn btn-outline-light">倒回 3 秒</button>
          <div id="statusText" class="status">准备就绪</div>
        </div>

        <div id="lyrics" class="lyrics">
          <div class="text-center text-secondary py-5">歌词加载中...</div>
        </div>

        <div class="tips">
          <span>点任意一句可跳转到该句开头。</span>
          <span>点任意单词可看意思。当前先支持听力 001。</span>
        </div>

        <div id="errorBox" class="error-box" style="display:none"></div>
      </div>

      <div class="dict-panel">
        <div class="dict-label">单词释义</div>
        <div id="dictWord" class="dict-word">点击一个单词</div>
        <div id="dictReading" class="dict-reading">这里会显示读音</div>
        <div id="dictMeaning" class="dict-meaning">这里会显示中文意思。</div>
        <div id="dictNote" class="dict-note">当前为听力 001 内置词义版。没有收录的词会给你外部词典入口。</div>

        <div class="context-box">
          <div class="dict-label">所在句子</div>
          <div id="contextJa" class="context-ja"></div>
          <div id="contextZh" class="context-zh"></div>
        </div>

        <div class="dict-links">
          <a id="jotobaLink" class="btn btn-outline-info disabled" target="_blank" rel="noopener noreferrer">在 Jotoba 查词</a>
          <a id="jishoLink" class="btn btn-outline-warning disabled" target="_blank" rel="noopener noreferrer">在 Jisho 查词</a>
          <a id="weblioLink" class="btn btn-outline-light disabled" target="_blank" rel="noopener noreferrer">在 Weblio 查词</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const audio = document.getElementById('audio');
    const audioSource = document.getElementById('audioSource');
    const lyrics = document.getElementById('lyrics');
    const statusText = document.getElementById('statusText');
    const toggleZhBtn = document.getElementById('toggleZhBtn');
    const backBtn = document.getElementById('backBtn');
    const errorBox = document.getElementById('errorBox');
    const dictWord = document.getElementById('dictWord');
    const dictReading = document.getElementById('dictReading');
    const dictMeaning = document.getElementById('dictMeaning');
    const dictNote = document.getElementById('dictNote');
    const contextJa = document.getElementById('contextJa');
    const contextZh = document.getElementById('contextZh');
    const jotobaLink = document.getElementById('jotobaLink');
    const jishoLink = document.getElementById('jishoLink');
    const weblioLink = document.getElementById('weblioLink');

    const DICT = {
      '例題1': { reading: 'れいだい いち', meaning: '例题1' },
      'この': { reading: 'この', meaning: '这个' },
      '問題': { reading: 'もんだい', meaning: '问题；题目' },
      'では': { reading: 'では', meaning: '在这里；在本题中' },
      'まず': { reading: 'まず', meaning: '首先' },
      '質問': { reading: 'しつもん', meaning: '问题；提问' },
      'を': { reading: 'を', meaning: '宾语助词' },
      '聞いて': { reading: 'きいて', meaning: '听；请听' },
      'ください': { reading: 'ください', meaning: '请……' },
      'それから': { reading: 'それから', meaning: '然后；接着' },
      '話': { reading: 'はなし', meaning: '谈话；内容；对话' },
      '問題用紙': { reading: 'もんだいようし', meaning: '试题纸' },
      'の': { reading: 'の', meaning: '的；连接助词' },
      '1': { reading: 'いち', meaning: '1' },
      'から': { reading: 'から', meaning: '从……；到……范围起点' },
      '4': { reading: 'よん', meaning: '4' },
      '中': { reading: 'なか', meaning: '里面；其中' },
      '最も': { reading: 'もっとも', meaning: '最；最为' },
      '良い': { reading: 'よい / いい', meaning: '好的；合适的' },
      'もの': { reading: 'もの', meaning: '东西；项目' },
      '一つ': { reading: 'ひとつ', meaning: '一个' },
      '選んで': { reading: 'えらんで', meaning: '选择' },
      '市民会館': { reading: 'しみんかいかん', meaning: '市民会馆' },
      'で': { reading: 'で', meaning: '在……；于……场所' },
      '男': { reading: 'おとこ', meaning: '男；男性' },
      '人': { reading: 'ひと', meaning: '人' },
      'と': { reading: 'と', meaning: '和；与' },
      '女': { reading: 'おんな', meaning: '女；女性' },
      'が': { reading: 'が', meaning: '主语助词' },
      '文化祭': { reading: 'ぶんかさい', meaning: '文化节' },
      '準備': { reading: 'じゅんび', meaning: '准备' },
      'について': { reading: 'について', meaning: '关于……' },
      '話しています': { reading: 'はなしています', meaning: '正在说；正在讨论' },
      '2人': { reading: 'ふたり', meaning: '两个人' },
      'は': { reading: 'は', meaning: '主题助词' },
      'これから': { reading: 'これから', meaning: '接下来；从现在开始' },
      '何': { reading: 'なに / なん', meaning: '什么' },
      'します': { reading: 'します', meaning: '做' },
      'か': { reading: 'か', meaning: '疑问助词' },
      '明日': { reading: 'あした', meaning: '明天' },
      'もう': { reading: 'もう', meaning: '已经；再' },
      '済みました': { reading: 'すみました', meaning: '完成了；结束了' },
      '少し': { reading: 'すこし', meaning: '一点；稍微' },
      'です': { reading: 'です', meaning: '是；礼貌判断' },
      'あと': { reading: 'あと', meaning: '还；另外；剩下' },
      '案内表示': { reading: 'あんないひょうじ', meaning: '指示牌；导览标识' },
      '出さなきゃ': { reading: 'ださなきゃ', meaning: '得拿出来；必须摆出来（口语）' },
      'いけない': { reading: 'いけない', meaning: '不行；必须' },
      'んです': { reading: 'んです', meaning: '用于解释说明的语气' },
      'けど': { reading: 'けど', meaning: '但是；不过' },
      '各部屋': { reading: 'かくへや', meaning: '各个房间' },
      'マイク': { reading: 'マイク', meaning: '麦克风' },
      'なんか': { reading: 'なんか', meaning: '之类；什么的' },
      '用意': { reading: 'ようい', meaning: '准备；预备' },
      'できてる': { reading: 'できてる', meaning: '已经准备好了；已经完成了（口语）' },
      '大丈夫': { reading: 'だいじょうぶ', meaning: '没问题；可以；不要紧' },
      'あ': { reading: 'あ', meaning: '啊；表示想起或注意到' },
      'ただ': { reading: 'ただ', meaning: '不过；只是' },
      '受付': { reading: 'うけつけ', meaning: '接待处；受付台' },
      '机': { reading: 'つくえ', meaning: '桌子' },
      'まだ': { reading: 'まだ', meaning: '还；尚未' },
      'じゃあ': { reading: 'じゃあ', meaning: '那么；那就' },
      'それ': { reading: 'それ', meaning: '那个；那件事' },
      '手伝いましょう': { reading: 'てつだいましょう', meaning: '我来帮忙吧' },
      'すみません': { reading: 'すみません', meaning: '不好意思；对不起；谢谢' },
      '助かります': { reading: 'たすかります', meaning: '帮大忙了；太感谢了' },
      '椅子': { reading: 'いす', meaning: '椅子' },
      '並べて': { reading: 'ならべて', meaning: '摆放；排列' },
      'ある': { reading: 'ある', meaning: '有；放着；存在' },
      'はい': { reading: 'はい', meaning: '是；好；嗯' },
      'さっき': { reading: 'さっき', meaning: '刚才' },
      'ゴミ箱': { reading: 'ごみばこ', meaning: '垃圾桶' },
      '並べた': { reading: 'ならべた', meaning: '摆好了；排列了' },
      '時に': { reading: 'ときに', meaning: '在……的时候' },
      '一緒': { reading: 'いっしょ', meaning: '一起' },
      'に': { reading: 'に', meaning: '在；向；与；副词化助词' },
      'やっときました': { reading: 'やっときました', meaning: '顺手先做完了（口语）' },
      'そう': { reading: 'そう', meaning: '那样；是吗' },
      '早速': { reading: 'さっそく', meaning: '立刻；马上' },
      '残り': { reading: 'のこり', meaning: '剩下的部分' },
      'やっちゃいましょう': { reading: 'やっちゃいましょう', meaning: '赶紧做了吧（口语）' }
    };

    let showZh = true;
    let lines = [];
    let activeLineIndex = -1;
    let lastScrolledIndex = -1;
    let rafId = null;
    let selectedWordEl = null;
    const fileParam = new URLSearchParams(window.location.search).get('para') || 'shinkanzen_chokai_n2_CD-A_001';

    function setStatus(text) {
      statusText.textContent = text;
    }

    function showError(text) {
      errorBox.style.display = 'block';
      errorBox.textContent = text;
    }

    function escapeHtml(text) {
      return (text || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function renderWord(word, lineIndex, wordIndex) {
      return `
        <span class="karaoke-word" data-word="${escapeHtml(word.text)}" data-line-index="${lineIndex}" data-word-index="${wordIndex}" data-start="${word.start}" data-end="${word.end}" style="--progress:0">
          <span class="base">${escapeHtml(word.text)}</span>
          <span class="fill">${escapeHtml(word.text)}</span>
        </span>
      `;
    }

    function renderLines(data) {
      lyrics.innerHTML = data.map((line, index) => `
        <div class="line" data-line-index="${index}">
          <div class="line-top">
            <span>第 ${line.line_index} 句</span>
            <span>${formatTime(line.start)} - ${formatTime(line.end)}</span>
          </div>
          <div class="jp-line">${line.words.map((word, wordIndex) => renderWord(word, index, wordIndex)).join('')}</div>
          <div class="zh-line" style="display:${showZh ? 'block' : 'none'}">${escapeHtml(line.zh)}</div>
        </div>
      `).join('');

      [...lyrics.querySelectorAll('.line')].forEach((el, index) => {
        el.addEventListener('click', (event) => {
          if (event.target.closest('.karaoke-word')) return;
          audio.currentTime = data[index].start;
          audio.play();
          setStatus(`跳到第 ${data[index].line_index} 句`);
        });
      });
    }

    function updateKaraoke() {
      const currentTime = audio.currentTime;
      let newActiveLineIndex = -1;

      lines.forEach((line, lineIndex) => {
        const lineEl = lyrics.querySelector(`.line[data-line-index="${lineIndex}"]`);
        if (!lineEl) return;
        const active = currentTime >= line.start && currentTime < line.end;
        if (active) newActiveLineIndex = lineIndex;
        lineEl.classList.toggle('active', active);

        const wordEls = lineEl.querySelectorAll('.karaoke-word');
        line.words.forEach((word, wordIndex) => {
          const wordEl = wordEls[wordIndex];
          if (!wordEl) return;
          const duration = Math.max(0.001, word.end - word.start);
          let progress = 0;
          let done = false;
          let activeWord = false;

          if (currentTime >= word.end) {
            progress = 100;
            done = true;
          } else if (currentTime > word.start && currentTime < word.end) {
            progress = ((currentTime - word.start) / duration) * 100;
            activeWord = true;
          }

          wordEl.style.setProperty('--progress', progress.toFixed(2));
          wordEl.classList.toggle('done', done);
          wordEl.classList.toggle('active-word', activeWord);
        });
      });

      if (newActiveLineIndex !== activeLineIndex) {
        activeLineIndex = newActiveLineIndex;
        if (activeLineIndex >= 0) {
          const activeEl = lyrics.querySelector(`.line[data-line-index="${activeLineIndex}"]`);
          if (activeEl && lastScrolledIndex !== activeLineIndex) {
            activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            lastScrolledIndex = activeLineIndex;
          }
          setStatus(`正在播放第 ${lines[activeLineIndex].line_index} 句`);
        }
      }

      if (!audio.paused && !audio.ended) {
        rafId = requestAnimationFrame(updateKaraoke);
      }
    }

    function updateDictLinks(word) {
      const links = [
        [jotobaLink, `https://jotoba.de/search/0/${encodeURIComponent(word)}`],
        [jishoLink, `https://jisho.org/search/${encodeURIComponent(word)}`],
        [weblioLink, `https://www.weblio.jp/content/${encodeURIComponent(word)}`]
      ];
      links.forEach(([el, href]) => {
        el.href = href;
        el.classList.remove('disabled');
      });
    }

    function selectWord(word, lineIndex, wordEl) {
      if (selectedWordEl) selectedWordEl.classList.remove('selected');
      selectedWordEl = wordEl;
      if (selectedWordEl) selectedWordEl.classList.add('selected');

      const line = lines[lineIndex];
      const entry = DICT[word];
      dictWord.textContent = word;
      dictReading.textContent = entry ? `读音：${entry.reading}` : '读音：暂未收录';
      dictMeaning.textContent = entry ? `意思：${entry.meaning}` : '意思：暂未收录到本地词典，请用下方按钮到在线词典查看。';
      dictNote.textContent = entry ? '已显示这个词在听力001中的常用中文意思。' : '这个词当前没有内置释义，但你可以点下面的外部词典继续查。';
      contextJa.innerHTML = escapeHtml(line.jp).replaceAll(escapeHtml(word), `<mark>${escapeHtml(word)}</mark>`);
      contextZh.textContent = line.zh || '';
      updateDictLinks(word);
      setStatus(`已选中：${word}`);
    }

    async function init() {
      audioSource.src = `${fileParam}.mp3`;
      audio.load();
      try {
        const res = await fetch(`${fileParam}.word_timestamps.estimated.json`);
        if (!res.ok) throw new Error(`无法加载 ${fileParam}.word_timestamps.estimated.json`);
        lines = await res.json();
        renderLines(lines);
        setStatus(`已载入 ${fileParam.replace('shinkanzen_chokai_n2_CD-A_', '听力 ')}`);

        lyrics.addEventListener('click', (event) => {
          const wordEl = event.target.closest('.karaoke-word');
          if (!wordEl) return;
          event.stopPropagation();
          const word = wordEl.dataset.word;
          const lineIndex = Number(wordEl.dataset.lineIndex);
          selectWord(word, lineIndex, wordEl);
        });
      } catch (err) {
        lyrics.innerHTML = '<div class="text-danger text-center py-5">加载卡拉 OK 数据失败。</div>';
        setStatus('加载失败');
        showError('当前这个页面已经可访问，但指定音频的词级时间戳 JSON 还没有准备好，或 GitHub Pages 尚未同步。现在先稳定支持听力001。');
      }
    }

    audio.addEventListener('play', () => {
      cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(updateKaraoke);
    });

    audio.addEventListener('pause', () => {
      cancelAnimationFrame(rafId);
      updateKaraoke();
      setStatus('已暂停');
    });

    audio.addEventListener('seeked', () => {
      updateKaraoke();
      setStatus(`已跳转到 ${formatTime(audio.currentTime)}`);
    });

    audio.addEventListener('ended', () => {
      cancelAnimationFrame(rafId);
      setStatus('播放结束');
    });

    toggleZhBtn.addEventListener('click', () => {
      showZh = !showZh;
      document.querySelectorAll('.zh-line').forEach(el => {
        el.style.display = showZh ? 'block' : 'none';
      });
      toggleZhBtn.textContent = showZh ? '隐藏中文' : '显示中文';
    });

    backBtn.addEventListener('click', () => {
      audio.currentTime = Math.max(0, audio.currentTime - 3);
      updateKaraoke();
    });

    init();
  </script>
</body>
</html>
