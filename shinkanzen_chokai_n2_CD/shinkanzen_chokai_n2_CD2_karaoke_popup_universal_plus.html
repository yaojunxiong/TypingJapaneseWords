        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function timeToSeconds(time) {
      const [h, m, s] = time.split(',')[0].split(':');
      const ms = time.split(',')[1] || '0';
      return parseInt(h, 10) * 3600 + parseInt(m, 10) * 60 + parseFloat(s) + parseInt(ms, 10) / 1000;
    }

    function loadSavedVocab() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch {
        return [];
      }
    }

    function persistSavedVocab() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(savedVocab));
    }

    function renderSavedVocab() {
      savedCountTag.textContent = savedVocab.length;
      if (!savedVocab.length) {
        savedWords.innerHTML = '<div class="empty-state">还没有收藏的词。点弹窗里的“收藏这个词”就会出现在这里。</div>';
        return;
      }

      savedWords.innerHTML = savedVocab.map((item, index) => `
        <div class="saved-item" data-index="${index}">
          <div class="saved-word-top">
            <div class="saved-word-text">${escapeHtml(item.word)}</div>
            <div class="saved-word-meta">${escapeHtml(item.fileLabel || '')}</div>
          </div>
          <div class="saved-word-meta">${escapeHtml(item.reading || '读音暂未记录')}</div>
          <div class="saved-word-meta">${escapeHtml(item.meaning || '意思暂未记录')}</div>
          <div class="saved-word-meta">${escapeHtml(item.jp || '')}</div>
          <div class="saved-word-actions">
            <button class="mini-btn" data-action="jump">跳到原句</button>
            <button class="mini-btn" data-action="delete">删除</button>
          </div>
        </div>
      `).join('');

      savedWords.querySelectorAll('.saved-item').forEach(el => {
        const index = Number(el.dataset.index);
        el.querySelector('[data-action="jump"]').addEventListener('click', () => jumpToSaved(index));
        el.querySelector('[data-action="delete"]').addEventListener('click', () => deleteSaved(index));
      });
    }

    function jumpToSaved(index) {
      const item = savedVocab[index];
      if (!item) return;
      if (item.file !== currentFile) {
        currentFile = item.file;
        const url = new URL(window.location.href);
        url.searchParams.set('para', currentFile);
        history.replaceState({}, '', url);
        loadFile(currentFile).then(() => {
          if (typeof item.lineStart === 'number') {
            audio.currentTime = item.lineStart;
            audio.play();
          }
        });
      } else if (typeof item.lineStart === 'number') {
        audio.currentTime = item.lineStart;
        audio.play();
      }
    }

    function deleteSaved(index) {
      savedVocab.splice(index, 1);
      persistSavedVocab();
      renderSavedVocab();
      setStatus('已删除收藏词');
    }

    function copySavedWords() {
      if (!savedVocab.length) {
        setStatus('还没有收藏词');
        return;
      }
      const text = savedVocab.map(item => `${item.word}\t${item.reading || ''}\t${item.meaning || ''}\t${item.fileLabel || ''}`).join('\n');
      navigator.clipboard.writeText(text).then(() => {
        setStatus('已复制词表');
      }).catch(() => {
        setStatus('复制失败');
      });
    }

    function clearSavedWords() {
      savedVocab = [];
      persistSavedVocab();
      renderSavedVocab();
      setStatus('已清空收藏');
    }

    function segmentText(text) {
      if (!segmenter) {
        return text.split(/\s+/).filter(Boolean).map(segment => ({ segment, isWordLike: true }));
      }
      return Array.from(segmenter.segment(text)).filter(part => part.segment && part.segment.trim());
    }

    function estimateWordsFromLineText(jp, start, end) {
      const segments = segmentText(jp).map(part => part.segment).filter(Boolean);
      if (!segments.length) {
        return [{ text: jp, start, end }];
      }
      const weights = segments.map(seg => Math.max(1, seg.replace(/\s+/g, '').length));
      const totalWeight = weights.reduce((a, b) => a + b, 0);
      let cursor = start;
      return segments.map((seg, idx) => {
        const rawDuration = (weights[idx] / totalWeight) * (end - start);
        const wordStart = cursor;
        const wordEnd = idx === segments.length - 1 ? end : Number((cursor + rawDuration).toFixed(3));
        cursor = wordEnd;
        return { text: seg, start: wordStart, end: wordEnd };
      });
    }

    async function loadLines(fileName) {
      try {
        const precise = await fetch(`${fileName}.word_timestamps.estimated.json`);
        if (precise.ok) {
          currentPlaybackMeta = 'word_timestamps';
          return await precise.json();
        }
      } catch (e) {}

      const subtitleRes = await fetch(`${fileName}.json`);
      if (!subtitleRes.ok) throw new Error(`无法加载 ${fileName}.json`);
      const rawLines = await subtitleRes.json();
      currentPlaybackMeta = 'estimated_from_subtitle';
      return rawLines.map((line, index) => {
        const start = timeToSeconds(line.start);
        const end = timeToSeconds(line.end);
        return {
          line_index: index + 1,
          start,
          end,
          jp: line.jp,
          zh: line.zh,
          alignment: 'estimated_from_subtitle',
          words: estimateWordsFromLineText(line.jp, start, end)
        };
      });
    }

    function renderWord(word, lineIndex, wordIndex) {
      return `
        <span class="karaoke-word" data-word="${escapeHtml(word.text)}" data-line-index="${lineIndex}" data-word-index="${wordIndex}" data-start="${word.start}" data-end="${word.end}" style="--progress:0">
          <span class="base">${escapeHtml(word.text)}</span>
          <span class="fill">${escapeHtml(word.text)}</span>
        </span>
      `;
    }

    function renderLines(data) {
      lyrics.innerHTML = data.map((line, index) => `
        <div class="line" data-line-index="${index}">
          <div class="line-top">
            <span>第 ${line.line_index} 句${line.alignment === 'estimated_from_subtitle' ? '<span class="tag">估算</span>' : '<span class="tag">词级</span>'}</span>
            <span>${formatTime(line.start)} - ${formatTime(line.end)}</span>
          </div>
          <div class="jp-line">${line.words.map((word, wordIndex) => renderWord(word, index, wordIndex)).join('')}</div>
          <div class="zh-line" style="display:${showZh ? 'block' : 'none'}">${escapeHtml(line.zh || '')}</div>
        </div>
      `).join('');

      [...lyrics.querySelectorAll('.line')].forEach((el, index) => {
        el.addEventListener('click', (event) => {
          if (event.target.closest('.karaoke-word')) return;
          audio.currentTime = data[index].start;
          audio.play();
          setStatus(`跳到第 ${data[index].line_index} 句`);
        });
      });
    }

    function renderPlaylist() {
      playlistTable.innerHTML = fileList.map(file => `
        <div class="playlist-item ${file === currentFile ? 'active' : ''}" data-file="${file}">${file.replace('shinkanzen_chokai_n2_CD-A_', '听力 ')}</div>
      `).join('');

      playlistTable.querySelectorAll('.playlist-item').forEach(el => {
        el.addEventListener('click', () => {
          const file = el.dataset.file;
          if (file === currentFile) return;
          currentFile = file;
          const url = new URL(window.location.href);
          url.searchParams.set('para', currentFile);
          history.replaceState({}, '', url);
          loadFile(currentFile);
        });
      });
    }

    function updateKaraoke() {
      const currentTime = audio.currentTime;
      let newActiveLineIndex = -1;

      lines.forEach((line, lineIndex) => {
        const lineEl = lyrics.querySelector(`.line[data-line-index="${lineIndex}"]`);
        if (!lineEl) return;
        const active = currentTime >= line.start && currentTime < line.end;
        if (active) newActiveLineIndex = lineIndex;
        lineEl.classList.toggle('active', active);

        const wordEls = lineEl.querySelectorAll('.karaoke-word');
        line.words.forEach((word, wordIndex) => {
          const wordEl = wordEls[wordIndex];
          if (!wordEl) return;
          const duration = Math.max(0.001, word.end - word.start);
          let progress = 0;
          let done = false;
          let activeWord = false;

          if (currentTime >= word.end) {
            progress = 100;
            done = true;
          } else if (currentTime > word.start && currentTime < word.end) {
            progress = ((currentTime - word.start) / duration) * 100;
            activeWord = true;
          }

          wordEl.style.setProperty('--progress', progress.toFixed(2));
          wordEl.classList.toggle('done', done);
          wordEl.classList.toggle('active-word', activeWord);
        });
      });

      if (newActiveLineIndex !== activeLineIndex) {
        activeLineIndex = newActiveLineIndex;
        if (activeLineIndex >= 0) {
          const activeEl = lyrics.querySelector(`.line[data-line-index="${activeLineIndex}"]`);
          if (activeEl && lastScrolledIndex !== activeLineIndex) {
            activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            lastScrolledIndex = activeLineIndex;
          }
          setStatus(`正在播放第 ${lines[activeLineIndex].line_index} 句${loopCurrentLine ? ' · 单句循环中' : ''}`);
        }
      }

      if (loopCurrentLine && activeLineIndex >= 0 && lines[activeLineIndex]) {
        const line = lines[activeLineIndex];
        if (currentTime >= line.end - 0.03) {
          audio.currentTime = line.start;
        }
      }

      if (!audio.paused && !audio.ended) {
        rafId = requestAnimationFrame(updateKaraoke);
      }
    }

    function updatePopupLinks(word) {
      popupJotoba.href = `https://jotoba.de/search/0/${encodeURIComponent(word)}`;
      popupJisho.href = `https://jisho.org/search/${encodeURIComponent(word)}`;
      popupWeblio.href = `https://www.weblio.jp/content/${encodeURIComponent(word)}`;
    }

    function hidePopup() {
      popup.classList.remove('show');
      if (selectedWordEl) selectedWordEl.classList.remove('selected');
      selectedWordEl = null;
      currentPopupState = null;
    }

    function positionPopup(targetEl) {
      const rect = targetEl.getBoundingClientRect();
      popup.classList.add('show');
      popup.style.visibility = 'hidden';

      const popupRect = popup.getBoundingClientRect();
      const margin = 10;
      let top = rect.bottom + 10;
      let left = rect.left + (rect.width / 2) - (popupRect.width / 2);
      let arrowLeft = popupRect.width / 2 - 6;
      let arrowTop = -7;

      if (left < margin) {
        arrowLeft += left - margin;
        left = margin;
      }
      if (left + popupRect.width > window.innerWidth - margin) {
        const overflow = left + popupRect.width - (window.innerWidth - margin);
        left -= overflow;
        arrowLeft += overflow;
      }
      if (top + popupRect.height > window.innerHeight - margin) {
        top = rect.top - popupRect.height - 12;
        arrowTop = popupRect.height - 5;
      }
      if (top < margin) top = margin;
      arrowLeft = Math.max(16, Math.min(popupRect.width - 24, arrowLeft));

      popup.style.left = `${left}px`;
      popup.style.top = `${top}px`;
      popupArrow.style.left = `${arrowLeft}px`;
      popupArrow.style.top = `${arrowTop}px`;
      popupArrow.style.transform = arrowTop > 0 ? 'rotate(225deg)' : 'rotate(45deg)';
      popup.style.visibility = 'visible';
    }

    function guessReadingText(word) {
      if (/^[0-9]+$/.test(word)) return `数字：${word}`;
      if (/^[ぁ-んー]+$/.test(word)) return `读音：${word}`;
      if (/^[ァ-ヶー]+$/.test(word)) return `片假名：${word}`;
      return '读音：暂未内置';
    }

    function showPopup(word, lineIndex, wordEl) {
      if (selectedWordEl) selectedWordEl.classList.remove('selected');
      selectedWordEl = wordEl;
      selectedWordEl.classList.add('selected');

      const line = lines[lineIndex];
      const entry = EMBED_DICT[word];
      const reading = entry ? entry.reading : guessReadingText(word).replace('读音：', '');
      const meaning = entry
        ? entry.meaning
        : '当前没有内置释义，先给你外部词典入口。';

      popupWord.textContent = word;
      popupReading.textContent = `读音：${reading}`;
      popupMeaning.textContent = `意思：${meaning}`;
      popupContext.innerHTML = `${escapeHtml(line.jp || '').replaceAll(escapeHtml(word), `<mark>${escapeHtml(word)}</mark>`)}<br><span style="color:#bfc5d8">${escapeHtml(line.zh || '')}</span>`;
      updatePopupLinks(word);
      positionPopup(wordEl);
      currentPopupState = {
        word,
        reading,
        meaning,
        lineIndex,
        jp: line.jp || '',
        zh: line.zh || '',
        lineStart: line.start
      };
      setStatus(`已选中：${word}`);
    }

    function saveCurrentPopupWord() {
      if (!currentPopupState) return;
      const exists = savedVocab.some(item => item.word === currentPopupState.word && item.file === currentFile && item.jp === currentPopupState.jp);
      if (exists) {
        setStatus('这个词已经收藏过了');
        return;
      }
      savedVocab.unshift({
        word: currentPopupState.word,
        reading: currentPopupState.reading,
        meaning: currentPopupState.meaning,
        file: currentFile,
        fileLabel: currentFile.replace('shinkanzen_chokai_n2_CD-A_', '听力 '),
        jp: currentPopupState.jp,
        zh: currentPopupState.zh,
        lineStart: currentPopupState.lineStart,
        savedAt: new Date().toISOString()
      });
      persistSavedVocab();
      renderSavedVocab();
      setStatus(`已收藏：${currentPopupState.word}`);
    }

    async function loadFile(fileName) {
      clearError();
      hidePopup();
      lyrics.innerHTML = '<div class="text-center text-secondary py-5">歌词加载中...</div>';
      currentFile = fileName;
      renderPlaylist();
      audioSource.src = `${fileName}.mp3`;
      audio.load();
      activeLineIndex = -1;
      lastScrolledIndex = -1;

      try {
        lines = await loadLines(fileName);
        renderLines(lines);
        const label = fileName.replace('shinkanzen_chokai_n2_CD-A_', '听力 ');
        const modeText = currentPlaybackMeta === 'word_timestamps' ? '词级时间戳' : '由原字幕自动估算';
        setStatus(`已载入 ${label} · ${modeText}${loopCurrentLine ? ' · 单句循环中' : ''}`);
      } catch (err) {
        lines = [];
        lyrics.innerHTML = '<div class="text-danger text-center py-5">加载失败。</div>';
        setStatus('加载失败');
        showError(`当前无法加载 ${fileName} 的字幕或音频数据。`);
      }
    }

    async function init() {
      renderSavedVocab();
      renderPlaylist();
      await loadFile(currentFile);

      lyrics.addEventListener('click', (event) => {
        const wordEl = event.target.closest('.karaoke-word');
        if (!wordEl) return;
        event.stopPropagation();
        const word = wordEl.dataset.word;
        const lineIndex = Number(wordEl.dataset.lineIndex);
        showPopup(word, lineIndex, wordEl);
      });
    }

    audio.addEventListener('play', () => {
      cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(updateKaraoke);
    });

    audio.addEventListener('pause', () => {
      cancelAnimationFrame(rafId);
      updateKaraoke();
      setStatus(`已暂停${loopCurrentLine ? ' · 单句循环中' : ''}`);
    });

    audio.addEventListener('seeked', () => {
      updateKaraoke();
      setStatus(`已跳转到 ${formatTime(audio.currentTime)}${loopCurrentLine ? ' · 单句循环中' : ''}`);
    });

    audio.addEventListener('ended', () => {
      cancelAnimationFrame(rafId);
      setStatus('播放结束');
    });

    toggleZhBtn.addEventListener('click', () => {
      showZh = !showZh;
      document.querySelectorAll('.zh-line').forEach(el => {
        el.style.display = showZh ? 'block' : 'none';
      });
      toggleZhBtn.textContent = showZh ? '隐藏中文' : '显示中文';
      hidePopup();
    });

    backBtn.addEventListener('click', () => {
      audio.currentTime = Math.max(0, audio.currentTime - 3);
      updateKaraoke();
    });

    replayBtn.addEventListener('click', () => {
      if (activeLineIndex >= 0 && lines[activeLineIndex]) {
        audio.currentTime = lines[activeLineIndex].start;
        audio.play();
      }
    });

    loopBtn.addEventListener('click', () => {
      loopCurrentLine = !loopCurrentLine;
      loopBtn.textContent = `单句循环：${loopCurrentLine ? '开' : '关'}`;
      loopBtn.classList.toggle('btn-warning', loopCurrentLine);
      loopBtn.classList.toggle('btn-outline-warning', !loopCurrentLine);
      setStatus(loopCurrentLine ? '已开启单句循环' : '已关闭单句循环');
    });

    popupClose.addEventListener('click', hidePopup);
    saveWordBtn.addEventListener('click', saveCurrentPopupWord);
    copySavedBtn.addEventListener('click', copySavedWords);
    clearSavedBtn.addEventListener('click', clearSavedWords);

    document.addEventListener('click', (event) => {
      if (!popup.contains(event.target) && !event.target.closest('.karaoke-word')) {
        hidePopup();
      }
    });

    window.addEventListener('resize', () => {
      if (popup.classList.contains('show') && selectedWordEl) {
        positionPopup(selectedWordEl);
      }
    });

    window.addEventListener('scroll', () => {
      if (popup.classList.contains('show') && selectedWordEl) {
        positionPopup(selectedWordEl);
      }
    }, true);

    init();
  </script>
</body>
</html>
