<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>字幕同步播放器</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background-color: #111;
            color: #fff;
            padding: 20px;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        .subtitles-container {
            border: 1px solid #444;
            background-color: #222;
            border-radius: 10px;
            padding: 10px;
            overflow-y: auto;
            max-height: 400px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.6);
        }

        .subtitle {
            opacity: 0.7;
            transition: all 0.3s ease;
            text-align: center;
            margin-bottom: 6px;
            cursor: pointer;
        }

            .subtitle span {
                display: block;
            }

            .subtitle .japanese {
                color: #ffcc00;
            }

            .subtitle .chinese {
                color: #ffffff;
            }

        .active {
            opacity: 1;
            color: #00ffff;
            background-color: rgba(255, 255, 255, 0.1);
            font-weight: bold;
            font-size: 1.2rem;
            border-radius: 5px;
            padding: 4px 6px;
        }

        .table-hover tbody tr:hover {
            background-color: #333;
        }

        .list-group-item.active {
            background-color: #0dcaf0;
            color: #000;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1 class="text-center text-warning mb-4">📚 新完全听解 N2 字幕播放器</h1>

    <div class="container">
        <div class="row">
            <!-- 播放表格列表 -->
            <div class="col-md-4 mb-3">
                <table class="table table-dark table-hover table-sm">
                    <thead>
                        <tr><th>听力编号</th></tr>
                    </thead>
                    <tbody id="playlist-table"></tbody>
                </table>
                <!-- 分页 -->
                <nav>
                    <ul class="pagination justify-content-center" id="pagination"></ul>
                </nav>
            </div>

            <!-- 音频与字幕 -->
            <div class="col-md-8">
                <audio controls id="video" class="w-100 mb-3">
                    <source id="audioSource" src="" type="audio/mpeg" />
                </audio>
                <div id="subtitles" class="subtitles-container">
                    <p class="text-center text-muted">字幕加载中...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 👇 生成 001 - 105 的文件名数组
        const fileList = Array.from({ length: 105 }, (_, i) => {
            const num = String(i + 1).padStart(3, "0");
            return `shinkanzen_chokai_n2_CD-A_${num}`;
        });

        let currentFile = "";
        let currentSubtitles = [];
        let lastActive = null;
        const pageSize = 10;
        let currentPage = 1;

        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        function timeToSeconds(time) {
            const [h, m, s] = time.split(",")[0].split(":");
            const ms = time.split(",")[1];
            return parseInt(h) * 3600 + parseInt(m) * 60 + parseFloat(s) + parseInt(ms) / 1000;
        }

        async function loadSubtitles(filename) {
            try {
                const res = await fetch(`${filename}.json`);
                const data = await res.json();
                return data.map(sub => ({
                    start: timeToSeconds(sub.start),
                    end: timeToSeconds(sub.end),
                    jp: sub.jp,
                    zh: sub.zh,
                    element: null
                }));
            } catch (e) {
                document.getElementById("subtitles").innerHTML = `<p class="text-danger">❌ 无法加载字幕：${filename}.json</p>`;
                return [];
            }
        }

        async function setAudioAndSubtitles(filename) {
            currentFile = filename;
            document.getElementById("audioSource").src = `${filename}.mp3`;
            const audio = document.getElementById("video");
            audio.load();

            renderTablePage(currentPage); // 更新表格高亮

            const subtitlesData = await loadSubtitles(filename);
            const container = document.getElementById("subtitles");
            container.innerHTML = "";
            lastActive = null;
            currentSubtitles = subtitlesData;

            subtitlesData.forEach(line => {
                const div = document.createElement("div");
                div.className = "subtitle";
                div.innerHTML = `<span class="japanese">${line.jp}</span><span class="chinese">${line.zh}</span>`;
                div.onclick = () => {
                    audio.currentTime = line.start;
                    audio.play();
                };
                container.appendChild(div);
                line.element = div;
            });

            // ✅ 自动播放音频
            audio.play();
        }


        function renderTablePage(page = 1) {
            currentPage = page;
            const start = (page - 1) * pageSize;
            const end = start + pageSize;
            const currentItems = fileList.slice(start, end);

            const table = document.getElementById("playlist-table");
            table.innerHTML = "";
            currentItems.forEach(file => {
                const row = document.createElement("tr");
                row.innerHTML = `<td>${file.replace("shinkanzen_chokai_n2_CD-A_", "听力 ")}</td>`;
                row.style.cursor = "pointer";
                row.onclick = () => setAudioAndSubtitles(file);
                if (file === currentFile) {
                    row.classList.add("table-info");
                }
                table.appendChild(row);
            });

            renderPagination(fileList.length, page);
        }

        function renderPagination(totalItems, currentPage) {
            const pageCount = Math.ceil(totalItems / pageSize);
            const pagination = document.getElementById("pagination");
            pagination.innerHTML = "";

            const createPageItem = (page, label = page, active = false, disabled = false) => {
                const li = document.createElement("li");
                li.className = `page-item${active ? " active" : ""}${disabled ? " disabled" : ""}`;
                const a = document.createElement("a");
                a.className = "page-link";
                a.href = "#";
                a.innerText = label;
                a.onclick = (e) => {
                    e.preventDefault();
                    if (!disabled) renderTablePage(page);
                };
                li.appendChild(a);
                return li;
            };

            pagination.appendChild(createPageItem(currentPage - 1, "«", false, currentPage === 1));
            for (let i = 1; i <= pageCount; i++) {
                pagination.appendChild(createPageItem(i, i, currentPage === i));
            }
            pagination.appendChild(createPageItem(currentPage + 1, "»", false, currentPage === pageCount));
        }

        function syncSubtitles() {
            const audio = document.getElementById("video");
            audio.ontimeupdate = () => {
                const t = audio.currentTime;
                currentSubtitles.forEach(line => {
                    const isActive = t >= line.start && t < line.end; // ✅ 用 < 替换 <=
                    if (isActive && !line.element.classList.contains("active")) {
                        if (lastActive) lastActive.classList.remove("active");
                        line.element.classList.add("active");
                        line.element.scrollIntoView({ behavior: "smooth", block: "center" });
                        lastActive = line.element;
                    }
                });
            };

            audio.onended = () => {
                document.getElementById("subtitles").scrollTo({ top: 0, behavior: "smooth" });
                if (lastActive) lastActive.classList.remove("active");
                lastActive = null;
            };
        }


        function init() {
            const para = getQueryParam("para") || fileList[0];
            renderTablePage(); // 初始化分页和表格
            setAudioAndSubtitles(para);
            syncSubtitles();
        }

        init();
    </script>
</body>
</html>
