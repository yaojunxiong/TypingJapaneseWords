<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>《みんなの日本語 初級》语法主题中心</title>
<script src="./minna-i18n-core.js?v=20.3"></script>
<link rel="stylesheet" href="./minna-site.css?v=20.3">
<style>
.topicGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.topic{display:block;background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px;box-shadow:0 8px 22px rgba(15,23,42,.06);color:var(--ink)}.topic:hover{text-decoration:none;transform:translateY(-2px);box-shadow:0 14px 32px rgba(15,23,42,.12)}.pill{display:inline-block;background:#eef2ff;color:#3730a3;border-radius:999px;padding:3px 10px;margin:3px;font-weight:900;font-size:13px}.pill.ok{background:#dcfce7;color:#166534}.pill.blue{background:#dbeafe;color:#1d4ed8}.pill.warn{background:#fef3c7;color:#92400e}.topicActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.miniBtn{display:inline-flex;align-items:center;justify-content:center;border-radius:8px;padding:7px 10px;font-weight:1000;background:#eef2ff;color:#3730a3!important}.miniBtn.primaryMini{background:#dcfce7;color:#166534!important}.grammarFooter{text-align:center;color:var(--muted);font-size:13px;padding:22px}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
const VERSION='20.3';
const cardMap={14:'te-form',17:'nai-form',19:'ta-form',20:'plain-form',25:'tara-temo',27:'potential',31:'volitional',37:'passive',48:'causative',49:'keigo',50:'keigo'};
const topics=[
[1,'名词句・自我介绍','Noun Sentences and Self-introduction','です / じゃありません'],[2,'これ・それ・あれ','Kore, Sore, Are','こ・そ・あ'],[3,'ここ・そこ・あそこ','Koko, Soko, Asoko','place words'],[4,'时间・星期','Time and Weekdays','time / days'],[5,'移动・交通','Movement and Transport','へ / で / と'],[6,'动词ます形','Verb Masu-form','を / で'],[7,'工具・授受基础','Tools and Giving/Receiving Basics','で / あげます'],[8,'形容词','Adjectives','い・な adjectives'],[9,'好き・上手','Likes and Skills','が / から'],[10,'存在句','Existence Sentences','あります / います'],[11,'数量表达','Quantity Expressions','counters'],[12,'过去式・比较','Past Tense and Comparison','past / comparison'],[13,'想要・目的','Wants and Purpose','ほしい / たい'],[14,'て形','Te-form','てください'],[15,'て形许可','Te-form Permission','てもいいです'],[16,'连接动作','Connecting Actions','て、て、'],[17,'ない形','Nai-form','ないでください'],[18,'辞书形','Dictionary Form','ことができます'],[19,'た形','Ta-form','たことがあります'],[20,'普通形','Plain Form','plain style'],[21,'と思います','To omoimasu','と思います'],[22,'名词修饰','Noun Modification','relative clauses'],[23,'とき・と','Toki and To','とき / と'],[24,'くれます','Kuremasu','くれます'],[25,'たら・ても','Tara and Temo','たら / ても'],[26,'んです','N desu','んです'],[27,'可能形','Potential Form','potential verbs'],[28,'ながら','Nagara','ながら'],[29,'自动词','Intransitive Verbs','自動詞'],[30,'他动词','Transitive Verbs','他動詞'],[31,'意向形','Volitional Form','意向形'],[32,'建议・推量','Advice and Conjecture','ほうがいい / でしょう'],[33,'命令・禁止','Commands and Prohibition','命令形 / 禁止形'],[34,'〜とおりに','Toori ni','とおりに'],[35,'条件形','Conditional Form','条件形'],[36,'ように','You ni','ように'],[37,'受身形','Passive Form','受身形'],[38,'のは','No wa','のは'],[39,'原因理由','Causes and Reasons','ので / て'],[40,'疑问词嵌入','Embedded Questions','か / かどうか'],[41,'授受高级','Advanced Giving and Receiving','いただきます'],[42,'ために','Tame ni','ために'],[43,'そうです','Sou desu','そうです'],[44,'すぎます','Sugimasu','すぎます'],[45,'場合は','Baai wa','場合は'],[46,'ところです','Tokoro desu','ところです'],[47,'そうです','Sou desu','hearsay'],[48,'使役形','Causative Form','使役形'],[49,'尊敬语','Honorific Language','尊敬語'],[50,'谦让语','Humble Language','謙譲語']];
const dict={badge:{zh:'Grammar Hub｜语法主题中心',en:'Grammar Hub'},title:{zh:'《みんなの日本語 初級》语法主题中心',en:'Minna no Nihongo Beginner Grammar Hub'},subtitle:{zh:'按语法主题浏览 50 课内容，重点语法可进入知识卡片查看规则、常见错误和 AI 解释。',en:'Browse all 50 lessons by grammar topic. Key grammar points link to knowledge cards with rules, common mistakes, and AI explanations.'},home:{zh:'返回首页',en:'Back Home'},review:{zh:'总复习',en:'Review Hub'},report:{zh:'学习报告',en:'Learning Report'},cards:{zh:'知识卡片',en:'Knowledge Cards'},drill:{zh:'AI练习',en:'AI Drill'},phase1:{zh:'初级 I',en:'Beginner I'},phase2:{zh:'初级 II',en:'Beginner II'},lesson:{zh:'第{n}课',en:'Lesson {n}'},core:{zh:'核心语法',en:'Core Grammar'},openLesson:{zh:'进入课程',en:'Open Lesson'},openCard:{zh:'知识卡片',en:'Knowledge Card'},footer:{zh:'《みんなの日本語 初級》AI互动学习系统｜语法主题中心',en:'Minna no Nihongo Beginner AI Learning System | Grammar Hub'},pageTitle:{zh:'《みんなの日本語 初級》语法主题中心',en:'Minna no Nihongo Beginner Grammar Hub'}};
const lang=()=>window.MinnaI18n?window.MinnaI18n.lang():(localStorage.getItem('minna_ui_lang')||'zh');
const t=(k,vars)=>{let s=(dict[k]&&dict[k][lang()])||dict[k].zh||'';if(vars)Object.keys(vars).forEach(x=>s=s.split('{'+x+'}').join(vars[x]));return s};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function topicCard(x){const hasCard=cardMap[x[0]];return `<div class="topic"><h3>${esc(t('lesson',{n:x[0]}))}</h3><p><strong>${esc(lang()==='en'?x[2]:x[1])}</strong></p><p><span class="pill blue">${esc(t('core'))}</span><span class="pill ok">${esc(x[3])}</span>${hasCard?`<span class="pill warn">${esc(t('cards'))}</span>`:''}</p><div class="topicActions"><a class="miniBtn" href="./minna-lesson-v16.html?n=${x[0]}&v=${VERSION}">${esc(t('openLesson'))}</a>${hasCard?`<a class="miniBtn primaryMini" href="./minna-grammar-card.html?g=${hasCard}&v=${VERSION}">${esc(t('openCard'))}</a>`:''}</div></div>`}
function group(start,end){return topics.filter(x=>x[0]>=start&&x[0]<=end).map(topicCard).join('')}
function render(){document.documentElement.lang=lang()==='en'?'en':'zh-CN';document.title=t('pageTitle');document.getElementById('app').innerHTML=`<header class="hero"><div class="wrap heroGrid"><div class="heroCopy"><div class="heroMeta"><span class="badge">${esc(t('badge'))}</span><span id="langMount"></span></div><h1>${esc(t('title'))}</h1><p>${esc(t('subtitle'))}</p><div class="heroActions"><a class="primary" href="./minna-index.html?v=${VERSION}">${esc(t('home'))}</a><a class="ghostHero" href="./minna-review.html?v=${VERSION}">${esc(t('review'))}</a><a class="ghostHero" href="./minna-grammar-card.html?v=${VERSION}">${esc(t('cards'))}</a><a class="lightHero" href="./minna-ai-drill.html?v=${VERSION}">${esc(t('drill'))}</a><a class="lightHero" href="./minna-report.html?v=${VERSION}">${esc(t('report'))}</a></div></div><div class="heroStats"><div><b>50</b><span>Topics</span></div><div><b>10</b><span>${esc(t('cards'))}</span></div><div><b>AI</b><span>${esc(t('drill'))}</span></div></div></div></header><main class="wrap"><section class="panel"><h2>${esc(t('phase1'))}</h2><div class="topicGrid">${group(1,25)}</div></section><section class="panel"><h2>${esc(t('phase2'))}</h2><div class="topicGrid">${group(26,50)}</div></section></main><footer class="wrap grammarFooter">${esc(t('footer'))}</footer>`;if(window.MinnaI18n)window.MinnaI18n.installToggle(document.getElementById('langMount'))}
if(window.MinnaI18n)window.MinnaI18n.onChange(render);render();
})();
</script>
</body>
</html>
