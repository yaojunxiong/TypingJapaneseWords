<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>新版全站一键自检</title>
  <style>
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#f8fafc;color:#0f172a}
    .wrap{max-width:980px;margin:0 auto;padding:20px}
    .card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px 16px;margin-bottom:14px}
    h1{margin:0 0 6px;font-size:24px}
    h2{margin:0 0 8px;font-size:18px}
    p{margin:8px 0;color:#334155}
    .buttons{display:flex;gap:8px;flex-wrap:wrap}
    button,a.btn{border:1px solid #cbd5e1;background:#fff;padding:8px 12px;border-radius:10px;cursor:pointer;text-decoration:none;color:#0f172a}
    button.primary{background:#0f172a;color:#fff;border-color:#0f172a}
    .ok{color:#166534}
    .bad{color:#b91c1c}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th,td{border-bottom:1px solid #e2e8f0;padding:8px 6px;text-align:left;vertical-align:top}
    th{background:#f8fafc}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>新版全站一键自检</h1>
      <p>覆盖新版核心链路：主页、课程、路径、收藏、复习、学习中心。点击后自动生成通过/失败报告。</p>
      <div class="buttons">
        <button class="primary" id="runBtn">开始自检</button>
        <a class="btn" href="./minna-app.html?v=22.1">返回新版主页</a>
      </div>
    </div>

    <div class="card">
      <h2>汇总</h2>
      <div id="summary">等待执行。</div>
    </div>

    <div class="card">
      <h2>详细结果</h2>
      <table>
        <thead>
          <tr>
            <th>页面</th>
            <th>状态</th>
            <th>HTTP</th>
            <th>耗时</th>
            <th>说明</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td colspan="5">等待执行。</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    (function(){
      const targets = [
        {name:'新版主页', url:'./minna-app.html?v=22.1'},
        {name:'课程列表', url:'./minna-app-lessons.html?v=22.1'},
        {name:'收藏页', url:'./minna-app-favorites.html?v=22.1'},
        {name:'学习中心', url:'./minna-toolbox.html?v=22.1'},
        {name:'路径页', url:'./minna-path.html?lesson=1&v=22.1'},
        {name:'课程页', url:'./minna-lesson-v16.html?n=1&v=22.1'},
        {name:'错题复习页', url:'./minna-review-mistakes.html?v=22.1'},
        {name:'学习路线页', url:'./minna-learning-path.html?v=20.3'},
        {name:'总复习页', url:'./minna-review.html?v=20.3'},
        {name:'收藏词汇页', url:'./minna-favorites.html?v=22.1'}
      ];

      function esc(s){
        return String(s == null ? '' : s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
      }

      async function checkOne(item){
        const start = performance.now();
        try{
          const res = await fetch(item.url, { cache: 'no-store' });
          const ms = Math.round(performance.now() - start);
          if(!res.ok){
            return { ...item, pass:false, status:res.status, ms, note:'HTTP 非 2xx' };
          }
          const text = await res.text();
          const hasHtml = /<html|<!doctype html/i.test(text);
          const hasApp = /id=["']app["']|minna-/i.test(text);
          if(!hasHtml){
            return { ...item, pass:false, status:res.status, ms, note:'内容不是 HTML' };
          }
          if(!hasApp){
            return { ...item, pass:false, status:res.status, ms, note:'缺少页面主结构标记' };
          }
          return { ...item, pass:true, status:res.status, ms, note:'通过' };
        }catch(err){
          const ms = Math.round(performance.now() - start);
          return { ...item, pass:false, status:'ERR', ms, note:err && err.message ? err.message : String(err) };
        }
      }

      async function run(){
        const rowsEl = document.getElementById('rows');
        const summaryEl = document.getElementById('summary');
        rowsEl.innerHTML = '<tr><td colspan="5">检测中...</td></tr>';
        summaryEl.textContent = '执行中，请稍候...';

        const out = [];
        for(const t of targets){
          const r = await checkOne(t);
          out.push(r);
          rowsEl.innerHTML = out.map(x => (
            '<tr>'
            + '<td><a href="'+esc(x.url)+'" target="_blank" rel="noopener">'+esc(x.name)+'</a><br><span class="mono">'+esc(x.url)+'</span></td>'
            + '<td class="'+(x.pass?'ok':'bad')+'">'+(x.pass?'通过':'失败')+'</td>'
            + '<td>'+esc(x.status)+'</td>'
            + '<td>'+esc(x.ms)+' ms</td>'
            + '<td>'+esc(x.note)+'</td>'
            + '</tr>'
          )).join('');
        }

        const pass = out.filter(x => x.pass).length;
        const fail = out.length - pass;
        summaryEl.innerHTML = fail === 0
          ? '<span class="ok">全部通过：'+pass+'/'+out.length+'</span>'
          : '<span class="bad">存在失败：'+fail+' 项</span>，通过 '+pass+'/'+out.length;
      }

      document.getElementById('runBtn').addEventListener('click', run);
    })();
  </script>
</body>
</html>
