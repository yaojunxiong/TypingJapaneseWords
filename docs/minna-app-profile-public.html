<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>公开档案 | Minna App</title>
<script src="./minna-version.js?v=22.1"></script>
<link rel="stylesheet" href="./minna-app.css?v=22.1">
<style>.page{padding:22px 22px 120px}.card{background:#fff;border:3px solid #ececec;border-radius:20px;padding:16px;box-shadow:0 4px 0 #ececec;text-align:center}.avatar{width:110px;height:110px;border-radius:999px;border:2px solid #e5e7eb;object-fit:cover;background:#f8fafc}.nick{font-size:30px;font-weight:1000;margin:10px 0 6px}.bio{color:#71717a;font-size:16px;line-height:1.6;margin:0}.small{color:#94a3b8;font-size:13px;margin-top:10px}</style>
</head>
<body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  var URL='https://ycjuceortcduakxscfes.supabase.co';
  var KEY='sb_publishable_sK-XWyiFwSoKCorddBULCw_0yiS9e5t';
  var db=window.supabase.createClient(URL,KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
  function qp(k){return new URLSearchParams(location.search).get(k)||''}
  function esc(s){return String(s||'').replace(/[&<>\"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]})}
  async function render(){
    var uid=qp('uid');
    if(!uid){document.getElementById('app').innerHTML='<main class="page"><section class="card"><h1>公开档案</h1><p class="bio">缺少用户参数。</p></section></main>';return;}
    var r=await db.from('minna_social_public_profiles').select('user_id,nick,bio,avatar_url,updated_at').eq('user_id',uid).maybeSingle();
    if(r.error||!r.data){document.getElementById('app').innerHTML='<main class="page"><section class="card"><h1>公开档案</h1><p class="bio">该用户尚未公开档案，或资料不存在。</p></section></main>';return;}
    var p=r.data;
    document.getElementById('app').innerHTML='<main class="page"><section class="card"><img class="avatar" src="'+esc(p.avatar_url||'')+'" alt="avatar"><div class="nick">'+esc(p.nick||'Minna Learner')+'</div><p class="bio">'+esc(p.bio||'这个同学很认真地在学习日语。')+'</p><p class="small">Minna 公共学习档案</p></section></main>';
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',render);else render();
})();
</script>
</body></html>
