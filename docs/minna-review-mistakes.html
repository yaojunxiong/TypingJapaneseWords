<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>错题复习</title>
<script src="./minna-version.js?v=22.1"></script>
<script src="./minna-store.js?v=22.1"></script>
<link rel="stylesheet" href="./minna-stage.css?v=1.18">
<style>
.reviewWrap{padding:24px 24px 120px}
.reviewHeader{text-align:center;margin:32px auto 20px}
.reviewHeader h1{font-size:38px;margin:10px 0}
.reviewHeader p{color:#71717a;font-weight:700}
.filterBar{max-width:760px;margin:0 auto 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.filterBar select{width:100%;min-height:46px;border:2px solid #e5e7eb;border-radius:12px;padding:0 12px;background:#fff;color:#3f3f46;font-weight:700}
.mistakeCard{background:#fff;border:3px solid #ececec;border-radius:24px;padding:24px;box-shadow:0 4px 0 #ececec;max-width:760px;margin:0 auto 18px}
.mistakePrompt{font-size:24px;font-weight:1000;line-height:1.5;margin-bottom:14px}
.mistakeMeta{color:#71717a;font-weight:800;margin-bottom:10px}
.mistakeAnswer{padding:14px 16px;border-radius:16px;margin-bottom:12px;font-weight:900}
.mistakeAnswer.bad{background:#ffe4e6;color:#be123c}
.mistakeAnswer.ok{background:#dcfce7;color:#166534}
.cardActions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.reviewBtn{min-height:56px;border:0;border-radius:16px;color:#fff;font-size:18px;font-weight:1000;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.reviewBtn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.reviewBtn.primary{background:#58cc02;box-shadow:0 6px 0 #46a302}
.reviewBtn.retry{background:#1daeea;box-shadow:0 6px 0 #0d8fc5}
.emptyReview{text-align:center;padding:80px 20px}
.emptyReview div{font-size:88px}
.emptyReview h1{font-size:36px;margin:12px 0}
.emptyReview p{color:#71717a;font-size:18px;font-weight:700}
@media(max-width:520px){.reviewWrap{padding:18px 20px 112px}.reviewHeader h1{font-size:34px}.mistakePrompt{font-size:22px}.cardActions{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
var VERSION=window.MINNA_VERSION||'22.1';
var store=window.MinnaStore;
var LESSON_META={
  1:['自我介绍','名词句 · 初次见面'],
  2:['这个是什么','指示代词 · 基础问答'],
  3:['这里是哪里','场所 · 存在句'],
  4:['时间表达','几点 · 星期 · 日期'],
  5:['移动与交通','去哪里 · 来哪里'],
  6:['动词ます形','日常动作表达'],
  7:['授受基础','给与接受'],
  8:['形容词','性质与状态'],
  9:['喜欢与能力','偏好与擅长'],
  10:['存在句','有/在表达'],
  11:['数量表达','助数词入门'],
  12:['过去与比较','对比表达'],
  13:['想要与目的','愿望表达'],
  14:['て形基础','连接与请求'],
  15:['许可与禁止','规则表达'],
  16:['连接动作','特征描述'],
  17:['ない形','义务与不必要'],
  18:['辞书形','能力与习惯'],
  19:['た形','经验与变化'],
  20:['普通形','会话表达'],
  21:['观点引用','と思います'],
  22:['定语从句','名词修饰'],
  23:['条件与时间','とき・と'],
  24:['授受进阶','帮助表达'],
  25:['条件句','たら・ても'],
  26:['说明与求助','んですが・たらいいですか'],
  27:['可能形','见える・闻こえる・しか～ません'],
  28:['一边与并列','ながら・し・それで'],
  29:['状态与完成','自動詞ています・てしまう'],
  30:['准备与状态','てあります・ておきます'],
  31:['意向与计划','意向形・つもり・予定'],
  32:['建议与推量','ほうがいい・でしょう・かもしれない'],
  33:['命令与传达','命令形・禁止形・と言っていました'],
  34:['按指示进行','とおりに・たあとで・ないで'],
  35:['条件表达进阶','条件形ば・なら・どうすれば'],
  36:['目标与习惯','ように・ようになる'],
  37:['被动语态','受身形・受害被动'],
  38:['名词化表达','Vのは・Vのが・Vのを'],
  39:['原因与理由','て・で・ので'],
  40:['疑问嵌套','か・かどうか・てみる'],
  41:['授受敬语','ていただく・てくださる'],
  42:['目的与用途','ために・のに'],
  43:['样态推测','そうです（样态）'],
  44:['程度与易难','すぎる・やすい・にくい'],
  45:['假设与逆接','場合は・のに'],
  46:['阶段与推断','ところ・ばかり・はず'],
  47:['传闻与推测','そうです（传闻）・ようです'],
  48:['使役语态','使役形・させる'],
  49:['尊敬语','お～になります'],
  50:['谦让语','お～します・いたします']
};
var STAGE_LABEL={vocab:'词汇',grammar:'语法',examples:'例句',review:'综合测试'};

function read(){return store.readMistakes()}
function save(v){store.writeMistakes(v)}
function top(){return '<header class="stageStatus"><a class="stageClose" href="./minna-app.html?v='+VERSION+'">×</a><div>🇯🇵 115</div><div class="fire">🔥 Review</div><div class="gem">💎 Mistakes</div><div class="energy">📝</div></header>'}
function lessonTitle(no){
  var row=LESSON_META[Number(no)];
  return row?row[0]:('第'+no+'课');
}
function stageText(stage){
  return STAGE_LABEL[stage]||stage;
}

function stageOptions(arr){
  var set={};
  arr.forEach(function(x){ if(x.stage) set[x.stage]=1; });
  return Object.keys(set).sort();
}

function normalize(arr){
  return arr.map(function(x,i){
    return {
      sourceIndex:i,
      lesson:Number(x.lesson||1),
      stage:String(x.stage||'vocab'),
      prompt:x.prompt||'',
      sub:x.sub||'',
      picked:x.picked||'',
      correct:x.correct||'',
      at:Number(x.at||0),
      wrongCount:Number(x.wrongCount||1)
    };
  });
}

function sortSmart(list){
  return list.slice().sort(function(a,b){
    if(b.wrongCount!==a.wrongCount) return b.wrongCount-a.wrongCount;
    return b.at-a.at;
  });
}

function retryUrl(item){
  return './minna-stage.html?lesson='+item.lesson+'&stage='+encodeURIComponent(item.stage)+'&v='+VERSION;
}

function card(item){
  return ''
    +'<section class="mistakeCard">'
    +'<div class="badge">第'+item.lesson+'课 · '+lessonTitle(item.lesson)+' · '+stageText(item.stage)+'</div>'
    +'<div class="mistakePrompt">'+(item.prompt||'')+'</div>'
    +'<div class="mistakeMeta">'+(item.sub||'')+'</div>'
    +'<div class="mistakeAnswer bad">❌ '+(item.picked||'')+'</div>'
    +'<div class="mistakeAnswer ok">✅ '+(item.correct||'')+'</div>'
    +'<div class="cardActions">'
    +'<a class="reviewBtn retry" href="'+retryUrl(item)+'">去重练</a>'
    +'<button class="reviewBtn primary" data-remove="'+item.sourceIndex+'">已掌握</button>'
    +'</div>'
    +'</section>';
}

function removeBySourceIndex(sourceIndex){
  var arr=read();
  if(sourceIndex<0||sourceIndex>=arr.length) return;
  arr.splice(sourceIndex,1);
  save(arr);
  render();
}

function getFilters(arr){
  var params=new URLSearchParams(location.hash.replace(/^#/,''));
  var lesson=params.get('lesson')||'all';
  var stage=params.get('stage')||'all';
  if(lesson!=='all'&&!arr.some(function(x){return String(x.lesson)===lesson})) lesson='all';
  if(stage!=='all'&&!arr.some(function(x){return String(x.stage)===stage})) stage='all';
  return {lesson:lesson,stage:stage};
}

function setFilters(lesson,stage){
  location.hash='lesson='+encodeURIComponent(lesson)+'&stage='+encodeURIComponent(stage);
}

function filterAndRender(arr){
  var f=getFilters(arr);
  var list=arr.filter(function(x){
    var okLesson=f.lesson==='all'||String(x.lesson)===f.lesson;
    var okStage=f.stage==='all'||String(x.stage)===f.stage;
    return okLesson&&okStage;
  });
  var sorted=sortSmart(list);

  var lessons=Array.from(new Set(arr.map(function(x){return x.lesson;}))).sort(function(a,b){return a-b;});
  var stages=stageOptions(arr);
  var filterUI=''
    +'<section class="filterBar">'
    +'<select id="lessonFilter"><option value="all">全部课程</option>'
    +lessons.map(function(n){return '<option value="'+n+'">第'+n+'课 · '+lessonTitle(n)+'</option>';}).join('')
    +'</select>'
    +'<select id="stageFilter"><option value="all">全部阶段</option>'
    +stages.map(function(s){return '<option value="'+s+'">'+stageText(s)+'</option>';}).join('')
    +'</select>'
    +'</section>';

  var html=top()+'<main class="reviewWrap"><section class="reviewHeader"><div style="font-size:88px">🔥</div><h1>错题复习</h1><p>共 '+arr.length+' 道，当前显示 '+sorted.length+' 道</p></section>'+filterUI+(sorted.length?sorted.map(card).join(''):'<section class="emptyReview"><div>🧭</div><h1>当前筛选下暂无错题</h1><p>试试切换课程或阶段。</p></section>')+'</main>';

  document.getElementById('app').innerHTML=html;

  var lessonSel=document.getElementById('lessonFilter');
  var stageSel=document.getElementById('stageFilter');
  if(lessonSel) lessonSel.value=f.lesson;
  if(stageSel) stageSel.value=f.stage;
  if(lessonSel) lessonSel.onchange=function(){setFilters(lessonSel.value,stageSel?stageSel.value:'all');};
  if(stageSel) stageSel.onchange=function(){setFilters(lessonSel?lessonSel.value:'all',stageSel.value);};

  document.querySelectorAll('[data-remove]').forEach(function(btn){
    btn.onclick=function(){removeBySourceIndex(Number(btn.dataset.remove));};
  });
}

function render(){
  var arr=normalize(read());
  if(!arr.length){
    document.getElementById('app').innerHTML=top()+'<main class="reviewWrap emptyReview"><div>🎉</div><h1>暂无错题</h1><p>继续保持！</p></main>';
    return;
  }
  filterAndRender(arr);
}

window.addEventListener('hashchange',render);
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',render);else render();
})();
</script>
</body>
</html>
