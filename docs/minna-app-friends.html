<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>好友管理 | Minna App</title>
<script src="./minna-version.js?v=22.1"></script>
<link rel="stylesheet" href="./minna-app.css?v=22.1">
<style>.page{padding:22px 22px 120px}.card{background:#fff;border:3px solid #ececec;border-radius:20px;padding:16px;box-shadow:0 4px 0 #ececec}.title{font-size:28px;font-weight:1000;margin:0 0 12px}.row{display:flex;gap:8px}.row input{flex:1;border:2px solid #e5e7eb;border-radius:12px;padding:10px}.btn{min-height:40px;padding:0 12px;border-radius:12px;border:2px solid #d4d4d8;background:#fff;font-weight:900}.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f1f5f9}.small{color:#71717a;font-size:13px}.sec{margin-top:16px}</style>
</head>
<body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./minna-auth.js?v=20.3"></script>
<script src="./minna-social.js?v=22.3"></script>
<script src="./minna-app-shell.js?v=22.1"></script>
<script>
(function(){
  function esc(s){return String(s||'').replace(/[&<>\"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]})}
  async function initAuth(){try{if(window.MinnaAuth&&MinnaAuth.init)await MinnaAuth.init({lessonId:'minna_friends'})}catch(e){}}
  async function render(){
    var list=await MinnaSocial.listFriends();
    var reqs=await MinnaSocial.listIncomingRequests();
    if(window.MinnaAppShell)window.MinnaAppShell.injectTop();
    document.getElementById('app').innerHTML='<main class="page"><section class="card"><h1 class="title">好友管理</h1>'
    +'<div class="row"><input id="friendInput" placeholder="直接添加好友显示名"><button class="btn" id="addBtn">添加</button></div>'
    +'<div class="row sec"><input id="reqEmail" placeholder="输入对方登录邮箱发送好友申请"><button class="btn" id="reqBtn">发申请</button></div>'
    +'<p class="small">当前好友：'+list.length+' 人</p><div id="list">'+(list.length?list.map(function(n){return '<div class="item"><span>'+esc(n)+'</span><button class="btn" data-v="'+esc(n)+'">删除</button></div>'}).join(''):'<p class="small">还没有好友，先添加一个吧。</p>')+'</div>'
    +'<div class="sec"><h3>待处理申请（'+reqs.length+'）</h3><div>'+(reqs.length?reqs.map(function(r){return '<div class="item"><span>'+esc(r.from_email)+'</span><span><button class="btn" data-a="'+r.id+'">同意</button> <button class="btn" data-r="'+r.id+'">拒绝</button></span></div>'}).join(''):'<p class="small">暂无待处理申请。</p>')+'</div></div>'
    +'<div class="row" style="margin-top:10px"><button class="btn" id="openQr">我的二维码名片</button></div></section></main>';
    if(window.MinnaAppShell)window.MinnaAppShell.injectTabs('me');
    document.getElementById('addBtn').onclick=async function(){var v=document.getElementById('friendInput').value.trim();if(!v)return;await MinnaSocial.addFriend(v);render();};
    document.getElementById('reqBtn').onclick=async function(){var v=document.getElementById('reqEmail').value.trim();if(!v)return;var res=await MinnaSocial.sendFriendRequest(v);alert(res.ok?'申请已发送':('发送失败：'+(res.msg||'')));render();};
    document.querySelectorAll('[data-v]').forEach(function(btn){btn.onclick=async function(){await MinnaSocial.removeFriend(btn.dataset.v);render();};});
    document.querySelectorAll('[data-a]').forEach(function(btn){btn.onclick=async function(){var r=await MinnaSocial.respondFriendRequest(Number(btn.dataset.a),true);if(!r.ok)alert('操作失败：'+(r.msg||''));render();};});
    document.querySelectorAll('[data-r]').forEach(function(btn){btn.onclick=async function(){var r=await MinnaSocial.respondFriendRequest(Number(btn.dataset.r),false);if(!r.ok)alert('操作失败：'+(r.msg||''));render();};});
    document.getElementById('openQr').onclick=function(){location.href='./minna-app-qr.html?v='+(window.MINNA_VERSION||'22.1');};
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',async function(){await initAuth();render();});else initAuth().then(render);
})();
</script><script src="./minna-sw-register.js?v=22.1"></script></body></html>
