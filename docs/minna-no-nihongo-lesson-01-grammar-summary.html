function setTalking(on){avatar.classList.toggle('speaking',on)}function setListening(on){avatar.classList.toggle('listening',on)}function voice(lang){return speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith(lang.toLowerCase()))||null}function speak(text,lang='zh-CN',rate=.92){speechSynthesis.cancel();setTalking(true);const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=rate;const v=voice(lang);if(v)u.voice=v;u.onend=()=>setTalking(false);u.onerror=()=>setTalking(false);speechSynthesis.speak(u)}function speakCN(){const s=slides[idx];speak(s.t+'。'+s.cn+'。小测验：'+s.q,'zh-CN',.92)}function speakJP(){const s=slides[idx],words=[...document.querySelectorAll('.word')];words.forEach(w=>w.classList.remove('active'));let n=0;const int=setInterval(()=>{words.forEach(w=>w.classList.remove('active'));if(words[n])words[n].classList.add('active');n++;if(n>words.length)clearInterval(int)},620);speak(s.jp,'ja-JP',.82)}
function normalize(s){return String(s).toLowerCase().replace(/[\s。、，,.!?！？・ー\-]/g,'').replace(/[は]/g,'わ')}function scorePronunciation(t,said){const a=normalize(t),b=normalize(said);if(!b)return 0;let hit=0;for(const ch of a){if(b.includes(ch))hit++}let base=Math.round(hit/Math.max(a.length,1)*100);if(b.includes(a)||a.includes(b))base=Math.max(base,85);return Math.min(100,base)}
function startRec(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition,box=el('recResult'),meter=el('pronMeter');if(!SR){box.innerHTML='这个浏览器暂不支持语音识别。建议用 Chrome 或 Edge。';return}speechSynthesis.cancel();setListening(true);box.innerHTML='正在听，请读：<b>'+esc(slides[idx].jp)+'</b>';meter.style.width='0%';const rec=new SR();rec.lang='ja-JP';rec.interimResults=false;rec.onresult=e=>{setListening(false);const said=e.results[0][0].transcript,sc=scorePronunciation(slides[idx].target,said);meter.style.width=sc+'%';box.innerHTML='识别结果：<b>'+esc(said)+'</b><br>跟读评分：<b>'+sc+' 分</b>'+(sc>=80?' ✅ 很好！':' 🔁 再练一遍。');if(sc>=80){state.score+=5;state.done[idx]=true;delete state.wrong[idx];save();renderMap();updateStats();speak('很好，跟读通过。','zh-CN',.95)}else speak('再练一遍。','zh-CN',.95)};rec.onerror=()=>{setListening(false);box.innerHTML='没有识别成功，请确认麦克风权限。'};rec.onend=()=>setListening(false);rec.start()}
function answer(k,btn){const s=slides[idx],fb=el('feedback'),bs=[...document.querySelectorAll('.quizOptions button')];bs.forEach((b,n)=>{b.disabled=true;if(n===s.a)b.classList.add('correct');if(n===k&&k!==s.a)b.classList.add('wrong')});if(k===s.a){fb.textContent='答对了！'+s.tip;fb.className='feedback ok';state.score+=10;state.done[idx]=true;delete state.wrong[idx];speak('答对了。'+s.tip,'zh-CN',.95)}else{fb.textContent='再想想：'+s.tip;fb.className='feedback bad';state.wrong[idx]=true;speak('再想想。'+s.tip,'zh-CN',.95)}save();updateStats();renderMap()}
function filteredNext(){if(state.mode!=='wrong')return idx+1;const w=ids(state.wrong).map(Number).sort((a,b)=>a-b);return w.find(x=>x>idx)??w[0]??0}function filteredPrev(){if(state.mode!=='wrong')return idx-1;const w=ids(state.wrong).map(Number).sort((a,b)=>a-b);return [...w].reverse().find(x=>x<idx)??w[w.length-1]??0}
function next(auto=false){const n=filteredNext();if(n<slides.length&&n>=0){idx=n;render();if(auto)speakCN()}else stop()}function prev(){const p=filteredPrev();if(p>=0){idx=p;render();speakCN()}}function go(i){stop();idx=i;render();speakCN()}function play(){if(playing){stop();return}playing=true;el('playBtn').textContent='⏸ 暂停';speakCN();schedule()}function schedule(){clearInterval(timer);timer=setInterval(()=>{next(true);schedule()},slides[idx].sec*1000)}function stop(){playing=false;clearInterval(timer);speechSynthesis.cancel();setTalking(false);setListening(false);el('playBtn').textContent='▶ 开始播放'}function setMode(m){stop();state.mode=m;if(m==='wrong'){const w=ids(state.wrong);if(w.length)idx=Number(w[0]);else alert('目前没有错题。')}render();speak(m==='wrong'?'错题复习模式。':'模式已切换。','zh-CN',.95)}function resetAll(){if(confirm('确定重置第1课学习进度吗？')){state={score:0,done:{},wrong:{},mode:'lesson'};idx=0;render();speak('进度已重置。','zh-CN',.95)}}
el('playBtn').onclick=play;el('nextBtn').onclick=()=>{stop();next(false);speakCN()};el('prevBtn').onclick=()=>{stop();prev()};el('voiceBtn').onclick=speakCN;el('jpBtn').onclick=speakJP;el('micBtn').onclick=startRec;el('wrongBtn').onclick=()=>setMode('wrong');speechSynthesis.onvoiceschanged=()=>{};render();
</script>
