<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>私信与群聊 | Minna App</title>
<script src="./minna-version.js?v=22.1"></script>
<link rel="stylesheet" href="./minna-app.css?v=22.1">
<style>.page{padding:20px 20px 120px}.card{background:#fff;border:2px solid #e5e7eb;border-radius:16px;padding:12px;margin-bottom:12px}.row{display:flex;gap:8px}.row input{flex:1;border:2px solid #e5e7eb;border-radius:12px;padding:10px}.btn{min-height:40px;padding:0 12px;border:2px solid #d4d4d8;border-radius:12px;background:#fff;font-weight:900}.list .item{padding:10px;border-bottom:1px solid #f1f5f9;cursor:pointer}.msgs{max-height:40vh;overflow:auto;border:1px solid #e5e7eb;border-radius:12px;padding:8px}.msg{margin:6px 0}.small{font-size:12px;color:#94a3b8}</style>
</head>
<body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./minna-auth.js?v=20.3"></script>
<script src="./minna-social.js?v=22.6"></script>
<script src="./minna-app-shell.js?v=22.1"></script>
<script>
(function(){
  var currentThread=0,pollId=0,rtChannel=null;
  async function init(){try{if(window.MinnaAuth&&MinnaAuth.init)await MinnaAuth.init({lessonId:'minna_chat'})}catch(e){}}
  function esc(s){return String(s||'').replace(/[&<>\"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]})}
  async function loadThreads(){try{return await MinnaSocial.listThreads()}catch(e){return []}}
  async function render(){
    var threads=await loadThreads();
    if(window.MinnaAppShell)window.MinnaAppShell.injectTop();
    document.getElementById('app').innerHTML='<main class="page">'
      +'<section class="card"><h2>发起私信</h2><div class="row"><input id="dmUid" placeholder="对方 user_id"><button class="btn" id="dmBtn">打开私信</button></div></section>'
      +'<section class="card"><h2>创建群聊</h2><div class="row"><input id="groupTitle" placeholder="群名"><input id="groupUids" placeholder="成员 user_id，逗号分隔"><button class="btn" id="groupBtn">建群</button></div></section>'
      +'<section class="card list"><h2>会话列表</h2>'+(threads.length?threads.map(function(t){return '<div class="item" data-tid="'+t.id+'">['+esc(t.thread_type)+'] '+esc(t.title||('会话#'+t.id))+'</div>'}).join(''):'<p class="small">暂无会话</p>')+'</section>'
      +'<section class="card"><h2>聊天内容</h2><div id="threadMeta" class="small">未选择会话</div><div id="msgs" class="msgs"></div><div class="row" style="margin-top:8px"><input id="msgInput" placeholder="输入消息"><button class="btn" id="sendBtn">发送</button></div><div class="row" style="margin-top:8px"><input id="inviteUids" placeholder="邀请 user_id，逗号分隔"><button class="btn" id="inviteBtn">邀请进群</button><button class="btn" id="leaveBtn">退出会话</button></div></section>'
      +'</main>';
    if(window.MinnaAppShell)window.MinnaAppShell.injectTabs('messages');
    document.getElementById('dmBtn').onclick=async function(){var uid=document.getElementById('dmUid').value.trim();if(!uid)return;currentThread=await MinnaSocial.getThreadIdWithUser(uid,'私信');await render();await openThread(currentThread);bindRealtime(currentThread);};
    document.getElementById('groupBtn').onclick=async function(){var title=document.getElementById('groupTitle').value.trim()||'学习群';var uids=document.getElementById('groupUids').value.trim().split(',').map(function(x){return x.trim()}).filter(Boolean);currentThread=await MinnaSocial.createGroup(title,uids);await render();await openThread(currentThread);bindRealtime(currentThread);};
    document.querySelectorAll('[data-tid]').forEach(function(el){el.onclick=function(){currentThread=Number(el.dataset.tid);openThread(currentThread);bindRealtime(currentThread);};});
    document.getElementById('sendBtn').onclick=async function(){if(!currentThread){alert('先选择会话');return;}var v=document.getElementById('msgInput').value.trim();if(!v)return;await MinnaSocial.sendMessage(currentThread,v);document.getElementById('msgInput').value='';openThread(currentThread);};
    document.getElementById('inviteBtn').onclick=async function(){if(!currentThread){alert('先选择会话');return;}var ids=document.getElementById('inviteUids').value.trim().split(',').map(function(x){return x.trim()}).filter(Boolean);if(!ids.length)return;try{await MinnaSocial.addGroupMembers(currentThread,ids);alert('已邀请');openThread(currentThread);}catch(e){alert('邀请失败：'+(e.message||e));}};
    document.getElementById('leaveBtn').onclick=async function(){if(!currentThread)return;try{await MinnaSocial.leaveThread(currentThread);currentThread=0;await render();}catch(e){alert('退出失败：'+(e.message||e));}};
    if(currentThread){openThread(currentThread);bindRealtime(currentThread);}
  }
  async function openThread(tid){
    try{
      var rows=await MinnaSocial.listMessages(tid), people=await MinnaSocial.listParticipants(tid);
      document.getElementById('threadMeta').textContent='当前会话 #'+tid+' · 成员 '+people.length+' 人';
      document.getElementById('msgs').innerHTML=rows.map(function(m){return '<div class="msg"><b>'+esc((m.from_email||m.from_user_id||'用户'))+'</b>：'+esc(m.body)+' <span class="small">'+esc(m.created_at)+'</span></div>';}).join('')||'<p class="small">暂无消息</p>';
      var box=document.getElementById('msgs'); box.scrollTop=box.scrollHeight;
    }catch(e){document.getElementById('msgs').innerHTML='<p class="small">读取失败：'+esc(e.message||e)+'</p>'}
  }
  function bindRealtime(tid){
    try{
      var c=window.MinnaAuth&&MinnaAuth.client?MinnaAuth.client():null;
      if(!c||!tid) return;
      if(rtChannel){ try{ c.removeChannel(rtChannel); }catch(_e){} rtChannel=null; }
      rtChannel=c.channel('minna-chat-'+tid).on('postgres_changes',{
        event:'INSERT',schema:'public',table:'minna_chat_messages',filter:'thread_id=eq.'+tid
      },function(){ openThread(tid); }).subscribe();
    }catch(e){}
  }
  function startPoll(){if(pollId)clearInterval(pollId);pollId=setInterval(function(){if(currentThread&&!rtChannel)openThread(currentThread);},8000);}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',async function(){await init();await render();startPoll();});else init().then(async function(){await render();startPoll();});
})();
</script>
<script src="./minna-sw-register.js?v=22.1"></script>
</body></html>
