<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>解锁诊断工具</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;margin:0;background:#f6f8fb;color:#0f172a}
    .wrap{max-width:1100px;margin:0 auto;padding:20px}
    .card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px 16px;margin-bottom:14px}
    h1{margin:0 0 8px;font-size:24px}
    h2{margin:0 0 8px;font-size:18px}
    p{margin:8px 0}
    .row{display:flex;flex-wrap:wrap;gap:10px}
    button{border:1px solid #cbd5e1;background:#fff;padding:8px 12px;border-radius:10px;cursor:pointer}
    button.primary{background:#0f172a;color:#fff;border-color:#0f172a}
    .ok{color:#15803d;font-weight:700}
    .bad{color:#b91c1c;font-weight:700}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th,td{border-bottom:1px solid #e2e8f0;padding:8px 6px;text-align:left;vertical-align:top}
    th{background:#f8fafc}
    .pill{display:inline-block;padding:2px 8px;border-radius:999px;border:1px solid #cbd5e1;font-size:12px}
    .pill.ok{border-color:#86efac;background:#f0fdf4}
    .pill.bad{border-color:#fca5a5;background:#fef2f2}
  </style>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="./minna-auth.js?v=unlock-diagnose-1"></script>
  <script src="./minna-role.js?v=unlock-diagnose-1"></script>
</head>
<body>
  <div class="wrap">
    <h1>课程解锁诊断工具</h1>
    <p>用途：检测“为什么课程没解锁”。会显示当前账号、角色、全解锁开关，以及 1-50 课逐课判定。</p>

    <div class="card">
      <h2>操作</h2>
      <div class="row">
        <button class="primary" id="btnRefresh">刷新诊断</button>
        <button id="btnLogin">Google 登录</button>
        <button id="btnLogout">退出登录</button>
      </div>
    </div>

    <div class="card">
      <h2>账号与角色</h2>
      <div id="authBox">读取中...</div>
    </div>

    <div class="card">
      <h2>核心结论</h2>
      <div id="summaryBox">读取中...</div>
    </div>

    <div class="card">
      <h2>逐课锁定明细（1-50）</h2>
      <div style="overflow:auto">
        <table>
          <thead>
            <tr>
              <th>课次</th>
              <th>可进入</th>
              <th>前置课通过</th>
              <th>当前课通过</th>
              <th>原因</th>
            </tr>
          </thead>
          <tbody id="lessonRows">
            <tr><td colspan="5">读取中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    (function(){
      var cloudProgress = {};
      var role = { effectiveRole: 'normal', bypassLessonLock: false, role: 'normal' };
      var user = null;

      function pad(n){ return String(n).padStart(2,'0'); }
      function lessonId(n){ return 'minna_lesson_'+pad(n); }
      function readJson(key){ try { return JSON.parse(localStorage.getItem(key)||'null'); } catch(e){ return null; } }
      function legacyState(n){
        var no = pad(n);
        var keys = ['minna_lesson_'+no,'lesson'+no+'v8','lesson'+no+'v7','lesson'+no+'v6','lesson'+no+'v5','lesson'+n+'v8','lesson'+n+'v7','lesson'+n+'v6','lesson'+n+'v5'];
        for(var i=0;i<keys.length;i++){ var v=readJson(keys[i]); if(v) return v; }
        return null;
      }
      function cloudState(n){
        var row = cloudProgress[lessonId(n)];
        return row && row.progress ? row.progress : null;
      }
      function progressOf(n){
        var state = cloudState(n) || legacyState(n) || {};
        var mastery = state.mastery || {};
        var wrong = state.wrong_count != null ? Number(state.wrong_count) : (state.wrong ? Object.keys(state.wrong).filter(function(k){ return state.wrong[k]; }).length : 0);
        var passed = !!state.mastery_passed || ((Number(mastery.vocab||0) >= 100) && (Number(mastery.grammar||0) >= 80) && (Number(mastery.examples||0) >= 80) && (Number(mastery.final||0) >= 80) && wrong === 0);
        return { passed: passed, hasRecord: Object.keys(state).length > 0, wrong: wrong };
      }
      function canAccess(n){
        if(role.bypassLessonLock) return true;
        if(n===1) return true;
        return progressOf(n-1).passed;
      }

      function renderAuth(){
        var email = user && user.email ? user.email : '未登录';
        var html = ''
          + '<p><b>当前邮箱：</b> <span class="mono">'+email+'</span></p>'
          + '<p><b>原始角色(role)：</b> <span class="mono">'+(role.role||'normal')+'</span></p>'
          + '<p><b>生效角色(effectiveRole)：</b> <span class="mono">'+(role.effectiveRole||'normal')+'</span></p>'
          + '<p><b>全课解锁(bypassLessonLock)：</b> '
          + (role.bypassLessonLock ? '<span class="pill ok">true</span>' : '<span class="pill bad">false</span>')
          + '</p>';
        document.getElementById('authBox').innerHTML = html;
      }

      function renderSummary(){
        var forced = role.bypassLessonLock;
        var locked = [];
        for(var n=1;n<=50;n++){ if(!canAccess(n)) locked.push(n); }
        var html = '';
        if(forced){
          html += '<p class="ok">当前账号已开启全课解锁。若你仍看到锁课，通常是页面缓存旧脚本，请强制刷新页面。</p>';
        }else{
          html += '<p class="bad">当前账号未开启全课解锁，因此会按前置课通过状态锁课。</p>';
        }
        html += '<p><b>当前锁住课次：</b> '+(locked.length ? locked.join(', ') : '无（全部可进入）')+'</p>';
        html += '<p>若此处显示已全解锁，但实际页面仍锁定，请按顺序执行：退出登录 → 重新登录 → 强制刷新（Shift+刷新）。</p>';
        document.getElementById('summaryBox').innerHTML = html;
      }

      function renderLessons(){
        var out = '';
        for(var n=1;n<=50;n++){
          var access = canAccess(n);
          var prev = n===1 ? {passed:true} : progressOf(n-1);
          var curr = progressOf(n);
          var reason = '';
          if(role.bypassLessonLock) reason = '角色全解锁';
          else if(n===1) reason = '第1课默认开放';
          else if(prev.passed) reason = '前置课已通过';
          else reason = '前置课未通过';
          out += '<tr>'
            + '<td>'+n+'</td>'
            + '<td>'+(access?'<span class="pill ok">可进入</span>':'<span class="pill bad">锁定</span>')+'</td>'
            + '<td>'+(prev.passed?'<span class="ok">是</span>':'<span class="bad">否</span>')+'</td>'
            + '<td>'+(curr.passed?'<span class="ok">是</span>':'<span class="bad">否</span>')+'</td>'
            + '<td>'+reason+'</td>'
            + '</tr>';
        }
        document.getElementById('lessonRows').innerHTML = out;
      }

      async function diagnose(){
        try{
          document.getElementById('authBox').textContent = '读取中...';
          document.getElementById('summaryBox').textContent = '读取中...';
          document.getElementById('lessonRows').innerHTML = '<tr><td colspan="5">读取中...</td></tr>';
          await MinnaAuth.init({ lessonId: 'minna_unlock_diagnose' });
          user = MinnaAuth.getUser ? MinnaAuth.getUser() : null;
          role = await MinnaAuth.loadRole(true);
          cloudProgress = {};
          try{
            var rows = await MinnaAuth.listProgress();
            (rows||[]).forEach(function(r){ if(r && r.lesson_id) cloudProgress[r.lesson_id] = r; });
          }catch(e){}
          renderAuth();
          renderSummary();
          renderLessons();
        }catch(err){
          document.getElementById('authBox').innerHTML = '<p class="bad">读取失败：'+String(err&&err.message||err)+'</p>';
          document.getElementById('summaryBox').innerHTML = '<p class="bad">请检查网络或 Supabase 配置。</p>';
          document.getElementById('lessonRows').innerHTML = '<tr><td colspan="5">失败</td></tr>';
        }
      }

      document.getElementById('btnRefresh').onclick = diagnose;
      document.getElementById('btnLogin').onclick = async function(){
        try{ await MinnaAuth.loginWithGoogle(); }catch(e){ alert('登录失败：'+(e.message||e)); }
      };
      document.getElementById('btnLogout').onclick = async function(){
        try{ await MinnaAuth.logout(); await diagnose(); }catch(e){ alert('退出失败：'+(e.message||e)); }
      };
      window.addEventListener('minna-auth-changed', function(){ setTimeout(diagnose, 250); });
      diagnose();
    })();
  </script>
</body>
</html>
