<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#58cc02">
<title>Lesson Complete</title>
<link rel="stylesheet" href="./minna-stage.css?v=1.7">
<style>
.nextLessonBox{margin:28px auto 0;max-width:560px;text-align:center;border-top:1px solid #ececec;padding-top:28px}.nextBadge{display:inline-flex;background:#e0f2fe;color:#0284c7;border-radius:10px;padding:7px 14px;font-weight:1000;margin-bottom:12px}.nextLessonBox h2{font-size:36px;margin:0 0 12px;color:#3f3f46}.nextLessonBox p{font-size:20px;line-height:1.45;color:#52525b;margin:0 0 22px}.ghostLink{display:inline-block;margin-top:18px;color:#94a3b8;font-weight:900}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var lesson = Number(params.get('lesson') || 1);
  var nextLesson = lesson + 1;
  var lang = localStorage.getItem('minna_ui_lang') || localStorage.getItem('minna_app_lang') || 'zh';
  var NEXT = {
    2:{zh:{title:'第 2 课',desc:'学会日常交流中基础的单词、短语和语法概念'},en:{title:'Lesson 2',desc:'Learn basic words, phrases, and grammar for daily communication'}},
    3:{zh:{title:'第 3 课',desc:'继续学习场所、指示词和简单问答'},en:{title:'Lesson 3',desc:'Continue with places, demonstratives, and simple Q&A'}}
  };
  function xp(){ try{return Number(localStorage.getItem('minna.xp.v1') || 0)}catch(e){return 0} }
  function today(){return new Date().toISOString().slice(0,10)}
  function yesterday(d){var x=new Date(d);x.setDate(x.getDate()-1);return x.toISOString().slice(0,10)}
  function tt(v){return (v&&(v[lang]||v.zh||v.en))||''}
  function updateStats(){
    var key='minna.learning.stats.v1';
    var now=today();
    var stats={streak:0,lastDate:'',daily:{}};
    try{stats=JSON.parse(localStorage.getItem(key)||JSON.stringify(stats))}catch(e){}
    if(stats.lastDate!==now){stats.streak=(stats.lastDate===yesterday(now))?Number(stats.streak||0)+1:1;stats.lastDate=now;}
    stats.daily=stats.daily||{};stats.daily[now]=Number(stats.daily[now]||0)+20;localStorage.setItem(key,JSON.stringify(stats));
    try{var appState=JSON.parse(localStorage.getItem('minna.mobile.learning.state.v1')||'{}');appState.streak=stats.streak;appState.lastLesson=nextLesson;localStorage.setItem('minna.mobile.learning.state.v1',JSON.stringify(appState));}catch(e){}
    return stats;
  }
  var stats=updateStats();
  var todayXp=(stats.daily&&stats.daily[today()])||0;
  var info=NEXT[nextLesson]||{zh:{title:'第 '+nextLesson+' 课',desc:'继续下一课学习'},en:{title:'Lesson '+nextLesson,desc:'Continue to the next lesson'}};
  document.getElementById('app').innerHTML=''
    +'<main class="stageScreen completeScreen">'
    +'<section class="stageTitle"><div style="font-size:92px">🏆</div>'
    +'<h1>'+(lang==='en'?'Lesson Complete!':'第一课完成！')+'</h1>'
    +'<p>'+(lang==='en'?'Total XP':'累计 XP')+': '+xp()+'</p>'
    +'<p>🔥 '+(lang==='en'?'Streak':'连续学习')+': '+stats.streak+'</p>'
    +'<p>💎 '+(lang==='en'?'Today XP':'今日 XP')+': '+todayXp+'</p></section>'
    +'<section class="nextLessonBox"><span class="nextBadge">'+(lang==='en'?'NEXT':'下一级')+'</span><h2>'+tt(info) .title+'</h2><p>'+tt(info).desc+'</p></section>'
    +'<button class="stageAction" id="goNext">'+(lang==='en'?'Continue':'继续')+'</button>'
    +'<a class="ghostLink" id="backPath" href="#">'+(lang==='en'?'Back to current path':'返回当前路径')+'</a>'
    +'</main>';
  document.getElementById('goNext').onclick=function(){location.href='./minna-path.html?lesson='+nextLesson+'&v=1.7'};
  document.getElementById('backPath').onclick=function(e){e.preventDefault();location.href='./minna-path.html?lesson='+lesson+'&v=1.7'};
})();
</script>
</body>
</html>
