<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#58cc02">
<title>Lesson Complete</title>
<link rel="stylesheet" href="./minna-stage.css?v=1.4">
</head>
<body>
<div id="app"></div>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var lesson = Number(params.get('lesson') || 1);
  var lang = localStorage.getItem('minna_ui_lang') || localStorage.getItem('minna_app_lang') || 'zh';
  function xp(){ try{return Number(localStorage.getItem('minna.xp.v1') || 0)}catch(e){return 0} }
  function today(){return new Date().toISOString().slice(0,10)}
  function yesterday(d){var x=new Date(d);x.setDate(x.getDate()-1);return x.toISOString().slice(0,10)}
  function updateStats(){
    var key='minna.learning.stats.v1';
    var now=today();
    var stats={streak:0,lastDate:'',daily:{}};
    try{stats=JSON.parse(localStorage.getItem(key)||JSON.stringify(stats))}catch(e){}
    if(stats.lastDate!==now){
      stats.streak=(stats.lastDate===yesterday(now))?Number(stats.streak||0)+1:1;
      stats.lastDate=now;
    }
    stats.daily=stats.daily||{};
    stats.daily[now]=Number(stats.daily[now]||0)+20;
    localStorage.setItem(key,JSON.stringify(stats));
    try{
      var appState=JSON.parse(localStorage.getItem('minna.mobile.learning.state.v1')||'{}');
      appState.streak=stats.streak;
      appState.lastLesson=lesson+1;
      localStorage.setItem('minna.mobile.learning.state.v1',JSON.stringify(appState));
    }catch(e){}
    return stats;
  }
  var stats=updateStats();
  var todayXp=(stats.daily&&stats.daily[today()])||0;
  document.getElementById('app').innerHTML = ''
    + '<main class="stageScreen completeScreen">'
    + '<section class="stageTitle"><div style="font-size:92px">🏆</div>'
    + '<h1>' + (lang === 'en' ? 'Lesson Complete!' : '第一课完成！') + '</h1>'
    + '<p>' + (lang === 'en' ? 'Total XP' : '累计 XP') + ': ' + xp() + '</p>'
    + '<p>🔥 ' + (lang === 'en' ? 'Streak' : '连续学习') + ': ' + stats.streak + '</p>'
    + '<p>💎 ' + (lang === 'en' ? 'Today XP' : '今日 XP') + ': ' + todayXp + '</p></section>'
    + '<button class="stageAction" id="backPath">' + (lang === 'en' ? 'Back to path' : '返回路径') + '</button>'
    + '</main>';
  document.getElementById('backPath').onclick = function(){
    location.href = './minna-path.html?lesson=' + lesson + '&v=1.4';
  };
})();
</script>
</body>
</html>
