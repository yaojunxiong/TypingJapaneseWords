<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#58cc02">
<title>Lesson Complete</title>
<link rel="stylesheet" href="./minna-stage.css?v=1.3">
</head>
<body>
<div id="app"></div>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var lesson = Number(params.get('lesson') || 1);
  var lang = localStorage.getItem('minna_ui_lang') || localStorage.getItem('minna_app_lang') || 'zh';
  function xp(){ try{return Number(localStorage.getItem('minna.xp.v1') || 0)}catch(e){return 0} }
  document.getElementById('app').innerHTML = ''
    + '<main class="stageScreen completeScreen">'
    + '<section class="stageTitle"><div style="font-size:92px">🏆</div>'
    + '<h1>' + (lang === 'en' ? 'Lesson Complete!' : '第一课完成！') + '</h1>'
    + '<p>' + (lang === 'en' ? 'Total XP' : '累计 XP') + ': ' + xp() + '</p></section>'
    + '<button class="stageAction" id="backPath">' + (lang === 'en' ? 'Back to path' : '返回路径') + '</button>'
    + '</main>';
  document.getElementById('backPath').onclick = function(){
    location.href = './minna-path.html?lesson=' + lesson + '&v=1.3';
  };
})();
</script>
</body>
</html>
