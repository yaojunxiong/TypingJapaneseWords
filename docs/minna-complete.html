<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#58cc02">
<title>Lesson Complete</title>
<link rel="stylesheet" href="./minna-stage.css?v=1.8">
<style>
body{background:#fff;padding-bottom:96px}.completeTop{position:sticky;top:0;z-index:10;background:#fff;padding:18px 28px 10px;display:flex;align-items:center;justify-content:space-between;font-size:20px;font-weight:1000}.completeTop .stat{display:flex;align-items:center;gap:8px;color:#3f3f46}.completeTop .fire{color:#f59e0b}.completeTop .gem{color:#0ea5e9}.completeTop .energy{color:#ec4899}.completeHero{min-height:52vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.coinMedal{font-size:96px;margin-bottom:18px}.completeHero h1{font-size:36px;margin:0;color:#3f3f46}.completeHero p{color:#71717a;margin:8px 0 0;font-weight:900}.nextLessonBox{border-top:1px solid #e5e7eb;padding:30px 28px 120px;text-align:center}.nextBadge{display:inline-flex;background:#e0f2fe;color:#0284c7;border-radius:10px;padding:7px 14px;font-weight:1000;margin-bottom:14px}.nextLessonBox h2{font-size:36px;margin:0 0 12px;color:#3f3f46}.nextLessonBox p{font-size:22px;line-height:1.45;color:#52525b;margin:0 auto 24px;max-width:640px}.completeBtn{display:flex;align-items:center;justify-content:center;min-height:66px;border-radius:18px;background:#1daeea;color:#fff;font-size:22px;font-weight:1000;box-shadow:0 6px 0 #0d8fc5;margin:0 auto;max-width:720px}.completeBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #0d8fc5}.completeTabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid #e5e7eb;display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:calc(env(safe-area-inset-bottom) + 8px)}.completeTabs a{min-height:72px;display:flex;align-items:center;justify-content:center;font-size:32px;text-decoration:none}.completeTabs a.active{outline:3px solid #7dd3fc;border-radius:14px;margin:8px 14px}.ghostLink{display:inline-block;margin-top:16px;color:#94a3b8;font-weight:900}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  var params=new URLSearchParams(location.search);
  var lesson=Number(params.get('lesson')||1);
  var nextLesson=lesson+1;
  var lang=localStorage.getItem('minna_ui_lang')||localStorage.getItem('minna_app_lang')||'zh';
  var NEXT={2:{zh:{title:'第 2 阶段',desc:'学会日常交流中基础的单词、短语和语法概念'},en:{title:'Stage 2',desc:'Learn basic words, phrases, and grammar for daily communication'}},3:{zh:{title:'第 3 阶段',desc:'继续学习场所、指示词和简单问答'},en:{title:'Stage 3',desc:'Continue with places, demonstratives, and simple Q&A'}}};
  function xp(){try{return Number(localStorage.getItem('minna.xp.v1')||0)}catch(e){return 0}}
  function today(){return new Date().toISOString().slice(0,10)}
  function yesterday(d){var x=new Date(d);x.setDate(x.getDate()-1);return x.toISOString().slice(0,10)}
  function tt(v){return(v&&(v[lang]||v.zh||v.en))||''}
  function updateStats(){var key='minna.learning.stats.v1',now=today(),stats={streak:0,lastDate:'',daily:{}};try{stats=JSON.parse(localStorage.getItem(key)||JSON.stringify(stats))}catch(e){}if(stats.lastDate!==now){stats.streak=(stats.lastDate===yesterday(now))?Number(stats.streak||0)+1:1;stats.lastDate=now}stats.daily=stats.daily||{};stats.daily[now]=Number(stats.daily[now]||0)+20;localStorage.setItem(key,JSON.stringify(stats));try{var appState=JSON.parse(localStorage.getItem('minna.mobile.learning.state.v1')||'{}');appState.streak=stats.streak;appState.lastLesson=nextLesson;localStorage.setItem('minna.mobile.learning.state.v1',JSON.stringify(appState))}catch(e){}return stats}
  var stats=updateStats();
  var todayXp=(stats.daily&&stats.daily[today()])||0;
  var info=NEXT[nextLesson]||{zh:{title:'第 '+nextLesson+' 阶段',desc:'继续下一课学习'},en:{title:'Stage '+nextLesson,desc:'Continue to the next lesson'}};
  document.getElementById('app').innerHTML=''
    +'<header class="completeTop"><div class="stat">🇯🇵 115</div><div class="stat fire">🔥 '+stats.streak+'</div><div class="stat gem">💎 '+xp()+'</div><div class="stat energy">⚡ 25</div></header>'
    +'<main>'
    +'<section class="completeHero"><div class="coinMedal">🏅</div><h1>'+(lang==='en'?'Lesson Complete!':'第 '+lesson+' 课完成！')+'</h1><p>💎 '+(lang==='en'?'Today XP':'今日 XP')+': '+todayXp+'</p></section>'
    +'<section class="nextLessonBox"><span class="nextBadge">'+(lang==='en'?'NEXT':'下一级')+'</span><h2>'+tt(info).title+'</h2><p>'+tt(info).desc+'</p><a class="completeBtn" id="goNext" href="#">'+(lang==='en'?'Continue':'继续')+'</a><a class="ghostLink" id="backPath" href="#">'+(lang==='en'?'Back to current path':'返回当前路径')+'</a></section>'
    +'</main>'
    +'<nav class="completeTabs"><a class="active" href="./minna-app.html?v=21.4">🏠</a><a href="#">🧰</a><a href="./minna-path.html?lesson='+nextLesson+'&v=1.8">🌳</a><a href="#">💗</a><a href="./minna-app.html#me">⋯</a></nav>';
  document.getElementById('goNext').onclick=function(e){e.preventDefault();location.href='./minna-path.html?lesson='+nextLesson+'&v=1.8'};
  document.getElementById('backPath').onclick=function(e){e.preventDefault();location.href='./minna-path.html?lesson='+lesson+'&v=1.8'};
})();
</script>
</body>
</html>
