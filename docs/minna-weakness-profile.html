<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minna Weakness Profile</title>
<script src="./minna-i18n-core.js?v=20.3"></script>
<link rel="stylesheet" href="./minna-site.css?v=20.3">
<style>
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:0 8px 24px rgba(15,23,42,.06)}.card b{font-size:28px;display:block}.pill{display:inline-block;border-radius:999px;padding:4px 10px;margin:4px;font-weight:900;font-size:12px}.red{background:#fee2e2;color:#991b1b}.yellow{background:#fef3c7;color:#92400e}.blue{background:#dbeafe;color:#1d4ed8}.list{display:grid;gap:10px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px}.footer{text-align:center;color:var(--muted);font-size:13px;padding:22px}.rec a{display:inline-flex;margin:4px;border-radius:8px;padding:8px 11px;background:#eef2ff;color:#3730a3!important;font-weight:1000}.bars{display:grid;gap:8px}.bar{display:grid;grid-template-columns:80px 1fr auto;gap:8px;align-items:center}.track{height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden}.fill{height:100%;background:#ef4444}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
const VERSION='20.3';
const ITEMS=[
[14,'て形','Te-form','te-form'],[17,'ない形','Nai-form','nai-form'],[19,'た形','Ta-form','ta-form'],[20,'普通形','Plain Form','plain-form'],[25,'たら・ても','Tara / Temo','tara-temo'],[27,'可能形','Potential Form','potential'],[31,'意向形','Volitional Form','volitional'],[37,'受身形','Passive Form','passive'],[48,'使役形','Causative Form','causative'],[49,'敬语','Keigo','keigo'],[50,'敬语','Keigo','keigo']];
const D={badge:{zh:'Weakness Profile｜AI弱点画像',en:'Weakness Profile'},title:{zh:'AI 弱点画像 v1',en:'AI Weakness Profile v1'},sub:{zh:'根据本机学习记录，自动找出需要优先复习的语法。',en:'Find grammar areas that need review based on local learning records.'},home:{zh:'返回首页',en:'Back Home'},report:{zh:'学习报告',en:'Learning Report'},drill:{zh:'AI练习',en:'AI Drill'},cards:{zh:'语法卡片',en:'Grammar Cards'},top:{zh:'最高优先级',en:'Top Priority'},rank:{zh:'弱点排名',en:'Weakness Ranking'},rec:{zh:'个性化推荐',en:'Recommendations'},lesson:{zh:'第{n}课',en:'Lesson {n}'},score:{zh:'弱点分 {n}',en:'Weakness Score {n}'},wrong:{zh:'错题 {n}',en:'Mistakes {n}'},mastery:{zh:'掌握度 {n}%',en:'Mastery {n}%'},none:{zh:'暂无明显弱点。继续学习后会自动生成画像。',en:'No clear weakness yet. Continue learning to generate a profile.'},openCard:{zh:'打开知识卡片',en:'Open Card'},startDrill:{zh:'开始专项训练',en:'Start Drill'},wrongbook:{zh:'错题专项',en:'Wrongbook'},byLesson:{zh:'错题课次分布',en:'Wrong Distribution by Lesson'},trend:{zh:'最近7天错题趋势',en:'Wrong Trend (7 Days)'},eventWrong:{zh:'题目级错答 {n}',en:'Question-level wrong {n}'},eventRight:{zh:'题目级订正 {n}',en:'Question-level corrected {n}'},footer:{zh:'Minna AI Learning System｜Weakness Profile',en:'Minna AI Learning System | Weakness Profile'}};
const lang=()=>window.MinnaI18n?window.MinnaI18n.lang():(localStorage.getItem('minna_ui_lang')||'zh');
const t=(k,v)=>{let s=(D[k]&&D[k][lang()])||D[k].zh||'';if(v)Object.keys(v).forEach(x=>s=s.split('{'+x+'}').join(v[x]));return s};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function readJson(key){try{return JSON.parse(localStorage.getItem(key)||'null')}catch(e){return null}}
function questionLog(){const x=readJson('minna_question_log_v1');return x&&typeof x==='object'?x:{}}
function state(n){const no=String(n).padStart(2,'0');return readJson('minna_lesson_'+no)||readJson('lesson'+no+'v8')||readJson('lesson'+n+'v8')||{}}
function prog(n){const s=state(n);const m=s.mastery||{};const wrong=s.wrong_count!=null?Number(s.wrong_count):(s.wrong?Object.keys(s.wrong).filter(k=>s.wrong[k]).length:0);const pct=Math.round((Number(m.vocab||0)+Number(m.grammar||0)+Number(m.examples||0)+Number(m.final||0))/4)||0;return{wrong,pct,has:!!Object.keys(s).length}}
function eventsByLesson(){const out={};Object.values(questionLog()).forEach(x=>{const n=Number(x&&x.lessonNo||0);if(!n)return;out[n]=out[n]||{wrong:0,right:0};out[n].wrong+=Number(x.wrongCount||0);out[n].right+=Number(x.rightCount||0)});return out}
function last7DaysTrend(){const map={};const now=new Date();for(let i=6;i>=0;i--){const d=new Date(now);d.setDate(now.getDate()-i);const k=d.toISOString().slice(0,10);map[k]={day:k.slice(5),wrong:0,right:0}}Object.values(questionLog()).forEach(x=>{const k=String(x&&x.lastAt||'').slice(0,10);if(!map[k])return;if(x.lastResult==='wrong')map[k].wrong+=1;else if(x.lastResult==='right')map[k].right+=1});return Object.values(map)}
function rows(){const ev=eventsByLesson();return ITEMS.map(x=>{const p=prog(x[0]);const e=ev[x[0]]||{wrong:0,right:0};const score=Math.min(100,p.wrong*25+e.wrong*8+(p.has?Math.max(0,80-p.pct):10));return{item:x,p,e,score}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score)}
function render(){const r=rows();const top=r[0];const byLesson=Object.entries(eventsByLesson()).map(([lesson,v])=>({lesson:Number(lesson),wrong:Number(v.wrong||0),right:Number(v.right||0)})).filter(x=>x.wrong>0||x.right>0).sort((a,b)=>(b.wrong-b.right)-(a.wrong-a.right)).slice(0,8);const trend=last7DaysTrend();const maxTrend=Math.max(1,...trend.map(x=>x.wrong));document.documentElement.lang=lang()==='en'?'en':'zh-CN';document.title=lang()==='en'?'Weakness Profile':'AI弱点画像';document.getElementById('app').innerHTML=`<header class="hero"><div class="wrap heroGrid"><div class="heroCopy"><div class="heroMeta"><span class="badge">${esc(t('badge'))}</span><span id="langMount"></span></div><h1>${esc(t('title'))}</h1><p>${esc(t('sub'))}</p><div class="heroActions"><a class="primary" href="./minna-index.html?v=${VERSION}">${esc(lang()==='en'?'Home':'首页')}</a><a class="ghostHero" href="./minna-review.html?v=${VERSION}">${esc(lang()==='en'?'Review':'总复习')}</a><a class="ghostHero" href="./minna-ai-coach.html?v=${VERSION}">${esc(lang()==='en'?'AI Coach':'AI教练')}</a><a class="ghostHero" href="./minna-learning-path.html?v=${VERSION}">${esc(lang()==='en'?'Path':'学习路线')}</a><a class="ghostHero" href="./minna-grammar-hub.html?v=${VERSION}">${esc(lang()==='en'?'Grammar':'语法中心')}</a><a class="lightHero" href="./minna-ai-drill.html?v=${VERSION}">${esc(lang()==='en'?'Drill':'AI练习')}</a><a class="lightHero" href="./minna-report.html?v=${VERSION}">${esc(lang()==='en'?'Report':'学习报告')}</a></div></div><div class="heroStats"><div><b>${top?Math.round(top.score):0}</b><span>${esc(t('top'))}</span></div><div><b>${r.length}</b><span>${esc(t('rank'))}</span></div><div><b>AI</b><span>${esc(t('rec'))}</span></div></div></div></header><main class="wrap"><section class="panel"><h2>${esc(t('top'))}</h2>${top?`<div class="card"><b>${esc(lang()==='en'?top.item[2]:top.item[1])}</b><p><span class="pill red">${esc(t('score',{n:Math.round(top.score)}))}</span><span class="pill yellow">${esc(t('wrong',{n:top.p.wrong}))}</span><span class="pill yellow">${esc(t('eventWrong',{n:top.e.wrong}))}</span><span class="pill blue">${esc(t('eventRight',{n:top.e.right}))}</span><span class="pill blue">${esc(t('mastery',{n:top.p.pct}))}</span></p></div>`:`<p class="small">${esc(t('none'))}</p>`}</section><section class="panel"><h2>${esc(t('rank'))}</h2>${r.length?`<div class="list">${r.map(x=>`<div class="row"><span><b>${esc(lang()==='en'?x.item[2]:x.item[1])}</b><br><small>${esc(t('lesson',{n:x.item[0]}))}</small></span><span><span class="pill red">${esc(t('score',{n:Math.round(x.score)}))}</span><span class="pill yellow">${esc(t('eventWrong',{n:x.e.wrong}))}</span></span></div>`).join('')}</div>`:`<p class="small">${esc(t('none'))}</p>`}</section><section class="panel"><h2>${esc(t('byLesson'))}</h2>${byLesson.length?`<div class="bars">${byLesson.map(x=>`<div class="bar"><small>${esc(t('lesson',{n:x.lesson}))}</small><div class="track"><div class="fill" style="width:${Math.max(6,Math.round((x.wrong/Math.max(1,byLesson[0].wrong))*100))}%"></div></div><small>${esc(t('eventWrong',{n:x.wrong}))}</small></div>`).join('')}</div>`:`<p class="small">${esc(t('none'))}</p>`}</section><section class="panel"><h2>${esc(t('trend'))}</h2>${trend.length?`<div class="bars">${trend.map(x=>`<div class="bar"><small>${esc(x.day)}</small><div class="track"><div class="fill" style="width:${Math.round((x.wrong/maxTrend)*100)}%"></div></div><small>${esc(t('eventWrong',{n:x.wrong}))}</small></div>`).join('')}</div>`:`<p class="small">${esc(t('none'))}</p>`}</section><section class="panel rec"><h2>${esc(t('rec'))}</h2>${top?`<a href="./minna-grammar-card.html?g=${top.item[3]}&v=${VERSION}">${esc(t('openCard'))}</a><a href="./minna-ai-drill.html?v=${VERSION}">${esc(t('startDrill'))}</a><a href="./minna-wrongbook-v2.html?v=${VERSION}">${esc(t('wrongbook'))}</a>`:`<p class="small">${esc(t('none'))}</p>`}</section></main><footer class="wrap footer">${esc(t('footer'))}</footer>`;if(window.MinnaI18n)window.MinnaI18n.installToggle(document.getElementById('langMount'))}
if(window.MinnaI18n)window.MinnaI18n.onChange(render);render();
})();
</script>
</body>
</html>
