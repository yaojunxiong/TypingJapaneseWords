<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>视频通话 | Minna App</title>
<script src="./minna-version.js?v=22.1"></script>
<link rel="stylesheet" href="./minna-app.css?v=22.1">
<style>.page{padding:22px 22px 120px}.card{background:#fff;border:3px solid #ececec;border-radius:20px;padding:16px;box-shadow:0 4px 0 #ececec}.title{font-size:28px;font-weight:1000;margin:0 0 12px}.row{display:flex;gap:8px;flex-wrap:wrap}.row input{flex:1;min-width:180px;border:2px solid #e5e7eb;border-radius:12px;padding:10px}.btn{min-height:44px;padding:0 14px;border-radius:12px;border:2px solid #d4d4d8;background:#fff;font-weight:900}.item{padding:10px 0;border-bottom:1px solid #f1f5f9}.small{color:#71717a;font-size:13px}</style>
</head>
<body><div id="app"></div>
<script src="./minna-social.js?v=22.2"></script>
<script src="./minna-app-shell.js?v=22.1"></script>
<script>
(function(){
  var KEY='minna.calls.v1';
  function read(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')||[]}catch(e){return []}}
  function write(v){localStorage.setItem(KEY,JSON.stringify(v||[]))}
  function room(){return 'minna-'+Math.random().toString(36).slice(2,8)}
  function notify(title,body){try{if(window.Notification&&Notification.permission==='granted'){new Notification(title,{body:body});}}catch(e){}}
  async function askNotify(){try{if(window.Notification&&Notification.permission==='default')await Notification.requestPermission();}catch(e){}}
  function render(){var rows=read();if(window.MinnaAppShell)window.MinnaAppShell.injectTop();document.getElementById('app').innerHTML='<main class="page"><section class="card"><h1 class="title">视频通话共学</h1><p class="small">可创建共学房间并保存预约记录；支持浏览器提醒。</p><div class="row"><input id="topic" placeholder="主题：第10课复习"><input id="time" placeholder="时间：今晚 21:00"><button class="btn" id="createBtn">创建</button></div><div id="list">'+(rows.length?rows.map(function(r,i){return '<div class="item"><b>'+r.topic+'</b><div class="small">'+r.time+' · <a href="'+r.url+'" target="_blank">进入房间</a> · <button class="btn" data-rem="'+i+'">提醒我</button></div></div>'}).join(''):'<p class="small">还没有预约。</p>')+'</div></section></main>';if(window.MinnaAppShell)window.MinnaAppShell.injectTabs('me');
  document.getElementById('createBtn').onclick=function(){var topic=document.getElementById('topic').value.trim()||'日语共学';var time=document.getElementById('time').value.trim()||'待定';var url='https://meet.jit.si/'+room();var l=read();var item={topic:topic,time:time,url:url,createdAt:Date.now()};l.unshift(item);write(l.slice(0,20));MinnaSocial.logEvent('call','创建了共学通话','主题：'+topic+'（'+time+'）');render();window.open(url,'_blank');};
  document.querySelectorAll('[data-rem]').forEach(function(btn){btn.onclick=async function(){await askNotify();var idx=Number(btn.dataset.rem);var r=read()[idx];if(!r)return;MinnaSocial.logEvent('call','设置了通话提醒',r.topic+' · '+r.time);setTimeout(function(){notify('Minna 共学提醒','你预约的「'+r.topic+'」即将开始');},10000);alert('已设置提醒（演示版：10秒后提醒）');};});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',render);else render();
})();
</script><script src="./minna-sw-register.js?v=22.1"></script></body></html>
