<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minna AI Study Coach</title>
<script src="./minna-i18n-core.js?v=20.3"></script>
<link rel="stylesheet" href="./minna-site.css?v=20.3">
<style>
.coachGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.coachCard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:0 8px 24px rgba(15,23,42,.06)}.coachCard b{display:block;font-size:28px}.mission{display:grid;gap:10px}.missionItem{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;justify-content:space-between;gap:12px;align-items:center}.pill{display:inline-block;border-radius:999px;padding:4px 10px;margin:4px;font-weight:900;font-size:12px}.blue{background:#dbeafe;color:#1d4ed8}.green{background:#dcfce7;color:#166534}.yellow{background:#fef3c7;color:#92400e}.red{background:#fee2e2;color:#991b1b}.rec a{display:inline-flex;margin:4px;border-radius:8px;padding:8px 11px;background:#eef2ff;color:#3730a3!important;font-weight:1000}.footer{text-align:center;color:var(--muted);font-size:13px;padding:22px}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
const VERSION='20.3';
const G=[[14,'て形','Te-form','te-form'],[17,'ない形','Nai-form','nai-form'],[19,'た形','Ta-form','ta-form'],[20,'普通形','Plain Form','plain-form'],[25,'たら・ても','Tara / Temo','tara-temo'],[27,'可能形','Potential Form','potential'],[31,'意向形','Volitional Form','volitional'],[37,'受身形','Passive Form','passive'],[48,'使役形','Causative Form','causative'],[49,'敬语','Keigo','keigo'],[50,'敬语','Keigo','keigo']];
const D={badge:{zh:'AI Study Coach｜每日学习教练',en:'AI Study Coach'},title:{zh:'AI 每日学习教练 v1',en:'AI Daily Study Coach v1'},sub:{zh:'根据你的进度、错题和弱点，自动生成今天的 15 分钟学习计划。',en:'Generate a 15-minute daily study plan from your progress, mistakes, and weak areas.'},home:{zh:'返回首页',en:'Back Home'},weak:{zh:'弱点画像',en:'Weakness Profile'},report:{zh:'学习报告',en:'Learning Report'},mission:{zh:'今日任务',en:"Today's Mission"},focus:{zh:'今日重点',en:"Today's Focus"},why:{zh:'推荐原因',en:'Why this plan?'},time:{zh:'预计时间',en:'Estimated Time'},min:{zh:'{n} 分钟',en:'{n} min'},task1:{zh:'看知识卡片',en:'Review Knowledge Card'},task2:{zh:'做 AI 专项练习',en:'Do AI Drill'},task3:{zh:'清理错题',en:'Clear Mistakes'},reason:{zh:'系统根据错题数量和 Mastery 掌握度，选择当前最需要复习的语法。',en:'The system chooses the grammar point that needs the most review based on mistakes and Mastery.'},encourage:{zh:'今天只要完成 15 分钟，就能推进一个小闭环。',en:'Finish just 15 minutes today to complete one small learning loop.'},openCard:{zh:'打开知识卡片',en:'Open Card'},startDrill:{zh:'开始练习',en:'Start Drill'},wrongbook:{zh:'错题专项',en:'Wrongbook'},none:{zh:'暂无明显弱点。建议继续当前课程或做总复习。',en:'No clear weakness yet. Continue the current lesson or do a general review.'},lesson:{zh:'第{n}课',en:'Lesson {n}'},footer:{zh:'Minna AI Learning System｜AI Study Coach',en:'Minna AI Learning System | AI Study Coach'}};
const lang=()=>window.MinnaI18n?window.MinnaI18n.lang():(localStorage.getItem('minna_ui_lang')||'zh');
const t=(k,v)=>{let s=(D[k]&&D[k][lang()])||D[k].zh||'';if(v)Object.keys(v).forEach(x=>s=s.split('{'+x+'}').join(v[x]));return s};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function readJson(key){try{return JSON.parse(localStorage.getItem(key)||'null')}catch(e){return null}}
function state(n){const no=String(n).padStart(2,'0');return readJson('minna_lesson_'+no)||readJson('lesson'+no+'v8')||readJson('lesson'+n+'v8')||{}}
function prog(n){const s=state(n),m=s.mastery||{};const wrong=s.wrong_count!=null?Number(s.wrong_count):(s.wrong?Object.keys(s.wrong).filter(k=>s.wrong[k]).length:0);const pct=Math.round((Number(m.vocab||0)+Number(m.grammar||0)+Number(m.examples||0)+Number(m.final||0))/4)||0;return{wrong,pct,has:!!Object.keys(s).length}}
function top(){return G.map(x=>{const p=prog(x[0]);const score=Math.min(100,p.wrong*25+(p.has?Math.max(0,80-p.pct):10));return{item:x,p,score}}).sort((a,b)=>b.score-a.score)[0]}
function render(){const x=top();const has=x&&x.score>0;const name=has?(lang()==='en'?x.item[2]:x.item[1]):'';document.documentElement.lang=lang()==='en'?'en':'zh-CN';document.title=lang()==='en'?'AI Study Coach':'AI每日学习教练';document.getElementById('app').innerHTML=`<header class="hero"><div class="wrap heroGrid"><div class="heroCopy"><div class="heroMeta"><span class="badge">${esc(t('badge'))}</span><span id="langMount"></span></div><h1>${esc(t('title'))}</h1><p>${esc(t('sub'))}</p><div class="heroActions"><a class="primary" href="./minna-index.html?v=${VERSION}">${esc(t('home'))}</a><a class="ghostHero" href="./minna-weakness-profile.html?v=${VERSION}">${esc(t('weak'))}</a><a class="lightHero" href="./minna-report.html?v=${VERSION}">${esc(t('report'))}</a></div></div><div class="heroStats"><div><b>${has?Math.round(x.score):0}</b><span>${esc(t('focus'))}</span></div><div><b>15</b><span>${esc(t('time'))}</span></div><div><b>3</b><span>${esc(t('mission'))}</span></div></div></div></header><main class="wrap"><section class="panel"><h2>${esc(t('focus'))}</h2>${has?`<div class="coachCard"><b>${esc(name)}</b><p><span class="pill red">Score ${Math.round(x.score)}</span><span class="pill yellow">${esc(t('lesson',{n:x.item[0]}))}</span><span class="pill blue">${esc(t('min',{n:15}))}</span></p></div>`:`<p class="small">${esc(t('none'))}</p>`}</section><section class="panel"><h2>${esc(t('mission'))}</h2><div class="mission"><div class="missionItem"><span>1. ${esc(t('task1'))}</span><span class="pill blue">5 min</span></div><div class="missionItem"><span>2. ${esc(t('task2'))}</span><span class="pill green">5 min</span></div><div class="missionItem"><span>3. ${esc(t('task3'))}</span><span class="pill yellow">5 min</span></div></div></section><section class="panel"><h2>${esc(t('why'))}</h2><p>${esc(t('reason'))}</p><p><span class="pill green">${esc(t('encourage'))}</span></p></section><section class="panel rec"><h2>${esc(t('mission'))}</h2>${has?`<a href="./minna-grammar-card.html?g=${x.item[3]}&v=${VERSION}">${esc(t('openCard'))}</a><a href="./minna-ai-drill.html?v=${VERSION}">${esc(t('startDrill'))}</a><a href="./minna-wrongbook-v2.html?v=${VERSION}">${esc(t('wrongbook'))}</a>`:`<a href="./minna-review.html?v=${VERSION}">${esc(t('home'))}</a>`}</section></main><footer class="wrap footer">${esc(t('footer'))}</footer>`;if(window.MinnaI18n)window.MinnaI18n.installToggle(document.getElementById('langMount'))}
if(window.MinnaI18n)window.MinnaI18n.onChange(render);render();
})();
</script>
</body>
</html>
