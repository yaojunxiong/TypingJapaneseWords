<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>《新版 标准日本语 初级》语法总结导航</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif;line-height:1.75;background:#f7f7fb;color:#1f2937}header{background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;padding:30px 18px 26px}header h1{margin:0;font-size:25px;line-height:1.35}header p{margin:10px 0 0;opacity:.92;font-size:15px}main{max-width:920px;margin:0 auto;padding:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin:16px 0;box-shadow:0 8px 24px rgba(15,23,42,.05)}h2{font-size:20px;margin:0 0 12px;border-left:5px solid #f59e0b;padding-left:10px}.controls{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.select{width:100%;font-size:17px;padding:12px;border:1px solid #d1d5db;border-radius:12px;background:#fff}.btn{border:0;border-radius:12px;background:#ef4444;color:#fff;padding:12px 18px;font-weight:700;font-size:16px;cursor:pointer}.btn:hover{filter:brightness(.95)}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.lesson{display:block;text-decoration:none;text-align:center;border:1px solid #fed7aa;background:#fff7ed;color:#9a3412;border-radius:12px;padding:10px 6px;font-weight:700}.lesson:hover{background:#ffedd5}.vol{display:inline-block;background:#ecfeff;color:#155e75;border:1px solid #a5f3fc;border-radius:999px;padding:3px 10px;font-size:13px;margin:0 8px 8px 0}.hint{color:#6b7280;font-size:14px}.latest{display:flex;gap:10px;flex-wrap:wrap}.latest a{color:#ef4444;font-weight:700;text-decoration:none}.titles{font-size:14px;color:#374151}.titles li{margin:4px 0}.search{width:100%;box-sizing:border-box;font-size:16px;padding:12px;border:1px solid #d1d5db;border-radius:12px;margin:8px 0 12px}footer{color:#6b7280;text-align:center;font-size:13px;padding:20px 10px 34px}@media(max-width:760px){.grid{grid-template-columns:repeat(4,1fr)}.controls{grid-template-columns:1fr}.btn{width:100%}}@media(max-width:480px){header h1{font-size:21px}main{padding:12px}.card{padding:14px;border-radius:14px}.grid{grid-template-columns:repeat(3,1fr)}.lesson{padding:9px 4px}}</style></head><body><header><h1>《新版 标准日本语 初级》语法总结导航</h1><p>选择第几课，直接打开对应语法总结页｜初级上册 1–24课｜初级下册 25–48课</p></header><main><section class="card"><h2>快速选择课程</h2><div class="controls"><select id="lessonSelect" class="select" aria-label="选择课程"><option value="">请选择第几课</option></select><button class="btn" onclick="goLesson()">打开语法总结</button></div><p class="hint">也可以在下面直接点击课号。网页适合手机阅读。</p></section><section class="card"><h2>最近生成</h2><div class="latest"><a href="biaozhun-nihongo-lesson-48-grammar-summary.html">第48课：お荷物は私がお持ちします</a><a href="biaozhun-nihongo-lesson-47-grammar-summary.html">第47课：周先生は明日日本へ行かれます</a><a href="biaozhun-nihongo-lesson-46-grammar-summary.html">第46课：これは柔らかくて、まるで本物の毛皮のようです</a></div></section><section class="card"><h2>初级上册：第1课～第24课</h2><p><span class="vol">上册</span><span class="hint">点击课号打开语法总结页</span></p><div class="grid" id="upperGrid"></div></section><section class="card"><h2>初级下册：第25课～第48课</h2><p><span class="vol">下册</span><span class="hint">点击课号打开语法总结页</span></p><div class="grid" id="lowerGrid"></div></section><section class="card"><h2>按标题查找</h2><input id="searchBox" class="search" placeholder="输入关键词，比如：被动、使役、敬语、ところ、ば形、ようです" oninput="renderTitles()"><ol class="titles" id="titleList"></ol></section></main><footer>《新版 标准日本语 初级》语法总结导航页｜Generated for Japanese grammar review.</footer><script>const lessons={1:'李さんは 中国人です',2:'これは 本です',3:'ここは デパートです',4:'部屋に机といすが あります',5:'森さんは7時に起きます',6:'吉田さんは来月中国へ行きます',7:'李さんは毎日コーヒーを飲みます',8:'李さんは日本語で手紙を書きます',9:'四川料理は辛いです',10:'京都の紅葉は有名です',11:'小野さんは歌が好きです',12:'李さんは森さんより若いです',13:'机の上に本が三冊あります',14:'昨日デパートへ行って、買い物しました',15:'小野さんは今新聞を読んでいます',16:'ホテルの部屋は広くて明るいです',17:'わたしは新しい洋服が欲しいです',18:'携帯電話はとても小さくなりました',19:'部屋のかぎを忘れないでください',20:'スミスさんはピアノを弾くことができます',21:'わたしはすき焼きを食べたことがあります',22:'森さんは毎晩テレビを見る',23:'休みの日、散歩したり買い物に行ったりします',24:'李さんはもうすぐ来ると思います',25:'これは明日会議で使う資料です',26:'自転車に2人で乗るのは危ないです',27:'子供の時、大きな地震がありました',28:'馬さんはわたしに地図をくれました',29:'電気を消せ',30:'もう11時だから寝よう',31:'このボタンを押すと、電源が入ります',32:'今度の日曜日に遊園地へ行くつもりです',33:'電車が急に止まりました',34:'壁にカレンダーが掛けてあります',35:'明日雨が降ったら、マラソン大会は中止です',36:'遅くなって、すみません',37:'優勝すれば、オリンピックに出場することができます',38:'戴さんは英語が話せます',39:'眼鏡をかけて本を読みます',40:'これから友達と食事に行くところです',41:'李さんは部長にほめられました',42:'テレビをつけたまま、出かけてしまいました',43:'陳さんは、息子をアメリカに留学させます',44:'玄関のところにだれかいるようです',45:'少子化が進んで、日本の人口はだんだん減っていくでしょう',46:'これは柔らかくて、まるで本物の毛皮のようです',47:'周先生は明日日本へ行かれます',48:'お荷物は私がお持ちします'};const tags={1:'名词判断 は/です',2:'こそあど これそれあれ',3:'地点 ここ どこ いくら',4:'あります います 方位',5:'时间 动词ます',6:'移动 へ から で',7:'を で か ください',8:'工具 授受 もう',9:'一类形容词',10:'二类形容词',11:'好き 上手 わかります',12:'比较 より ほど 一番',13:'数量词 ぐらい かかる',14:'て形 てください',15:'ています てもいい',16:'形容词连接 状态',17:'欲しい たい ましょう',18:'なります します',19:'ない形 なければ',20:'基本形 ことができます',21:'た形 たことがあります',22:'简体 敬体',23:'たり かどうか',24:'と思います と言いました',25:'小句修饰名词',26:'の 名词化 でしょう',27:'時 ながら',28:'授受 くれます てもらう',29:'命令形 禁止形 なさい',30:'意志形 つもり 予定',31:'と 条件 副词化',32:'ことにします そうです',33:'自动词 他动词 そうです',34:'てあります ておきます てみます',35:'たら ても だけ しか',36:'て原因 に用途 ばかり',37:'ば形 なら とか',38:'可能形 ように',39:'ないで ために ていく てくる',40:'ところ ばかり 始める',41:'被动形',42:'まま のに はず',43:'使役形 やすい にくい',44:'ようです みたい らしい 過ぎる',45:'ていく てくる し',46:'よう らしい までに 間',47:'尊敬语',48:'谦让语'};function path(n){return `biaozhun-nihongo-lesson-${String(n).padStart(2,'0')}-grammar-summary.html`}function init(){const sel=document.getElementById('lessonSelect');for(let i=1;i<=48;i++){const opt=document.createElement('option');opt.value=path(i);opt.textContent=`第${i}课｜${lessons[i]}`;sel.appendChild(opt)}renderGrid(1,24,'upperGrid');renderGrid(25,48,'lowerGrid');renderTitles()}function renderGrid(start,end,id){const box=document.getElementById(id);for(let i=start;i<=end;i++){const a=document.createElement('a');a.className='lesson';a.href=path(i);a.textContent=`第${i}课`;a.title=lessons[i];box.appendChild(a)}}function goLesson(){const v=document.getElementById('lessonSelect').value;if(v) location.href=v}function renderTitles(){const q=(document.getElementById('searchBox')?.value||'').trim().toLowerCase();const list=document.getElementById('titleList');list.innerHTML='';for(let i=1;i<=48;i++){const text=`第${i}课 ${lessons[i]} ${tags[i]}`.toLowerCase();if(!q||text.includes(q)){const li=document.createElement('li');li.innerHTML=`<a href="${path(i)}">第${i}课：${lessons[i]}</a> <span class="hint">｜${tags[i]}</span>`;list.appendChild(li)}}}init();</script></body></html>
