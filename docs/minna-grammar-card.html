<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>《みんなの日本語 初級》语法知识卡片</title>
<script src="./minna-i18n-core.js?v=20.3"></script>
<link rel="stylesheet" href="./minna-site.css?v=20.3">
<style>
.cardGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.kcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:0 8px 24px rgba(15,23,42,.06)}.ruleTable{width:100%;border-collapse:collapse}.ruleTable th,.ruleTable td{border:1px solid var(--line);padding:9px 10px;text-align:left}.ruleTable th{background:#f1f5f9}.pill{display:inline-block;border-radius:999px;padding:4px 10px;margin:4px;font-weight:900;font-size:12px}.blue{background:#dbeafe;color:#1d4ed8}.green{background:#dcfce7;color:#166534}.yellow{background:#fef3c7;color:#92400e}.red{background:#fee2e2;color:#991b1b}.explain{border-left:5px solid #2563eb;background:#eff6ff;border-radius:10px;padding:12px 14px;margin-top:10px}.mistake{display:grid;gap:8px}.mistake div{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px}.footer{text-align:center;color:var(--muted);font-size:13px;padding:22px}.control{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.control select{border:1px solid var(--line);border-radius:8px;padding:10px;min-width:240px}.graph a{display:inline-block;margin:4px;padding:6px 10px;border-radius:999px;background:#eef2ff;color:#3730a3;font-weight:900}.smallBtn{border:0;border-radius:8px;padding:8px 12px;font-weight:1000;cursor:pointer;background:#e2e8f0}.hidden{display:none}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
const VERSION='20.3';
const cards={
 'te-form':{lesson:14,zh:'て形',en:'Te-form',jlpt:'N5',overview:{zh:'て形用于请求、连接动作、许可、禁止、状态持续等，是初级日语最核心的动词形之一。',en:'The te-form is one of the most important beginner verb forms. It is used for requests, connecting actions, permission, prohibition, and ongoing states.'},rules:[['う・つ・る','って','買う→買って / 待つ→待って'],['む・ぶ・ぬ','んで','読む→読んで / 遊ぶ→遊んで'],['く','いて','書く→書いて'],['ぐ','いで','泳ぐ→泳いで'],['す','して','話す→話して'],['一段','て','食べる→食べて'],['special','して / 来て / 行って','する→して / 来る→来て / 行く→行って']],mistakes:[['行きて','行って','「行く」是特殊变化，不是普通的 く→いて。'],['飲みて','飲んで','む・ぶ・ぬ 结尾变成 んで。']],links:['てください','てもいい','てはいけない','ている','てから']},
 'nai-form':{lesson:17,zh:'ない形',en:'Nai-form',jlpt:'N5',overview:{zh:'ない形用于否定、请求不要做某事、必须/不必等表达。',en:'The nai-form is used for negation, asking someone not to do something, obligation, and lack of necessity.'},rules:[['五段','あ段＋ない','行く→行かない'],['う','わない','買う→買わない'],['一段','る→ない','食べる→食べない'],['する','しない','勉強する→勉強しない'],['来る','来ない','来る→来ない']],mistakes:[['行くない','行かない','五段动词要变到 あ 段。'],['食べらない','食べない','一段动词去 る 加 ない。']],links:['ないでください','なければなりません','なくてもいいです']},
 'ta-form':{lesson:19,zh:'た形',en:'Ta-form',jlpt:'N5',overview:{zh:'た形用于过去动作、经验表达、动作完成等。变形规则基本与て形平行。',en:'The ta-form is used for past actions, experiences, and completed actions. Its conjugation patterns parallel the te-form.'},rules:[['う・つ・る','った','買う→買った'],['む・ぶ・ぬ','んだ','読む→読んだ'],['く','いた','書く→書いた'],['ぐ','いだ','泳ぐ→泳いだ'],['す','した','話す→話した'],['一段','た','食べる→食べた'],['special','した / 来た / 行った','する→した / 来る→来た / 行く→行った']],mistakes:[['行きた','行った','「行く」是特殊变化。'],['読みた','読んだ','む・ぶ・ぬ 对应 んだ。']],links:['たことがあります','たり〜たりします','たら']},
 'plain-form':{lesson:20,zh:'普通形',en:'Plain Form',jlpt:'N5',overview:{zh:'普通形用于朋友会话、引用、从句和许多复合语法。',en:'Plain forms are used in casual conversation, quotations, clauses, and many compound grammar patterns.'},rules:[['动词','辞书形 / ない形 / た形 / なかった','行く・行かない・行った'],['い形容词','い / くない / かった','高い・高くない・高かった'],['な形容词','だ / じゃない / だった','静かだ・静かじゃない'],['名词','だ / じゃない / だった','学生だ・学生じゃない']],mistakes:[['静かですと思います','静かだと思います','と思います 前通常用普通形。'],['行きますと思います','行くと思います','动词引用要用普通形。']],links:['と思います','と言いました','んです']},
 'tara-temo':{lesson:25,zh:'たら・ても',en:'Tara / Temo',jlpt:'N5',overview:{zh:'たら表示“如果/之后”，ても表示“即使……也……”。',en:'Tara means “if/when/after,” while temo means “even if.”'},rules:[['た形 + ら','如果/之后','雨が降ったら、行きません'],['て形 + も','即使……也','高くても買います']],mistakes:[['雨が降ってら','雨が降ったら','たら 接在た形后面。'],['高いたら','高かったら','い形容词要变过去形再加ら。']],links:['条件形','場合は','とき']},
 'potential':{lesson:27,zh:'可能形',en:'Potential Form',jlpt:'N4',overview:{zh:'可能形表示“能做某事”。对象助词常由 を 变为 が。',en:'The potential form expresses ability. The object marker often changes from を to が.'},rules:[['五段','え段 + る','読む→読める'],['一段','られる','食べる→食べられる'],['する','できる','勉強する→勉強できる'],['来る','来られる','来る→来られる']],mistakes:[['日本語を話せます','日本語が話せます','可能形中对象常用 が。'],['食べれる','食べられる','标准形式是一段动词 + られる。']],links:['ことができます','見えます・聞こえます']},
 'volitional':{lesson:31,zh:'意向形',en:'Volitional Form',jlpt:'N4',overview:{zh:'意向形表示“做吧/打算做”，常用于提议和计划。',en:'The volitional form expresses “let’s do” or intention, often used for suggestions and plans.'},rules:[['五段','お段 + う','行く→行こう'],['一段','よう','食べる→食べよう'],['する','しよう','勉強する→勉強しよう'],['来る','来よう','来る→来よう']],mistakes:[['行くよう','行こう','五段动词变 お段 + う。'],['食べろう','食べよう','一段动词去る加よう。']],links:['と思っています','つもりです','予定です']},
 'passive':{lesson:37,zh:'受身形',en:'Passive Form',jlpt:'N4',overview:{zh:'受身形表示“被……”，也可表达受害感。',en:'The passive form means “be done by” and can also express being negatively affected.'},rules:[['五段','あ段 + れる','言う→言われる'],['一段','られる','食べる→食べられる'],['する','される','注意する→注意される'],['来る','来られる','来る→来られる']],mistakes:[['言うられる','言われる','五段动词要变 あ段 + れる。'],['先生にほめました','先生にほめられました','被老师表扬要用受身。']],links:['使役受身','尊敬语']},
 'causative':{lesson:48,zh:'使役形',en:'Causative Form',jlpt:'N4',overview:{zh:'使役形表示“让/使某人做某事”。',en:'The causative form means “make/let someone do something.”'},rules:[['五段','あ段 + せる','行く→行かせる'],['一段','させる','食べる→食べさせる'],['する','させる','勉強する→勉強させる'],['来る','来させる','来る→来させる']],mistakes:[['行くさせる','行かせる','五段动词变 あ段 + せる。'],['食べせる','食べさせる','一段动词去る加させる。']],links:['使役受身','てもらう']},
 'keigo':{lesson:49,zh:'敬语体系',en:'Honorific System',jlpt:'N4',overview:{zh:'敬语分为尊敬语、谦让语和丁宁语。尊敬语抬高对方，谦让语降低自己。',en:'Keigo includes honorific, humble, and polite language. Honorific raises the other person; humble lowers oneself.'},rules:[['尊敬语','お/ご + ます形 + になります','先生がお話になります'],['谦让语','お/ご + ます形 + します','私がお持ちします'],['特殊尊敬语','いらっしゃいます・おっしゃいます','先生がいらっしゃいます'],['特殊谦让语','参ります・申します・拝見します','私が参ります']],mistakes:[['先生に申します','先生がおっしゃいます','申す 是谦让语，用于自己。'],['私がいらっしゃいます','私が参ります','いらっしゃる 是尊敬语，用于对方。']],links:['尊敬语','谦让语','商务日语']}
};
const dict={badge:{zh:'Grammar Knowledge Cards｜语法知识卡片',en:'Grammar Knowledge Cards'},title:{zh:'语法知识卡片 v1',en:'Grammar Knowledge Cards v1'},subtitle:{zh:'把语法规则、常见错误、AI解释和专项训练连接起来。',en:'Connect grammar rules, common mistakes, AI explanations, and targeted drills.'},home:{zh:'返回首页',en:'Back Home'},hub:{zh:'语法中心',en:'Grammar Hub'},drill:{zh:'专项训练',en:'Drill'},wrong:{zh:'错题专项',en:'Wrongbook'},choose:{zh:'选择语法卡片',en:'Choose a grammar card'},overview:{zh:'核心说明',en:'Overview'},rules:{zh:'规则表',en:'Rule Table'},type:{zh:'类型',en:'Type'},change:{zh:'变化',en:'Change'},example:{zh:'例子',en:'Example'},mistakes:{zh:'常见错误',en:'Common Mistakes'},wrongEx:{zh:'错误',en:'Wrong'},rightEx:{zh:'正确',en:'Correct'},why:{zh:'AI解释',en:'AI Explanation'},graph:{zh:'语法关联',en:'Grammar Links'},jlpt:{zh:'JLPT 标签',en:'JLPT Tag'},show:{zh:'为什么错？',en:'Why is it wrong?'},footer:{zh:'《みんなの日本語 初級》AI互动学习系统｜语法知识卡片',en:'Minna no Nihongo AI Learning System | Grammar Knowledge Cards'},pageTitle:{zh:'《みんなの日本語 初級》语法知识卡片',en:'Minna no Nihongo Grammar Knowledge Cards'}};
const params=new URLSearchParams(location.search);let current=params.get('g')||localStorage.getItem('minna_grammar_card')||'te-form';if(!cards[current])current='te-form';
const lang=()=>window.MinnaI18n?window.MinnaI18n.lang():(localStorage.getItem('minna_ui_lang')||'zh');
const t=(k)=>((dict[k]&&dict[k][lang()])||dict[k].zh||'');
const pick=v=>v&&typeof v==='object'?(lang()==='en'?v.en:v.zh):v;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function options(){return Object.keys(cards).map(k=>`<option value="${k}" ${k===current?'selected':''}>Lesson ${cards[k].lesson} · ${esc(lang()==='en'?cards[k].en:cards[k].zh)}</option>`).join('')}
function render(){const c=cards[current];document.documentElement.lang=lang()==='en'?'en':'zh-CN';document.title=t('pageTitle');document.getElementById('app').innerHTML=`<header class="hero"><div class="wrap heroGrid"><div class="heroCopy"><div class="heroMeta"><span class="badge">${esc(t('badge'))}</span><span id="langMount"></span></div><h1>${esc(t('title'))}: ${esc(lang()==='en'?c.en:c.zh)}</h1><p>${esc(t('subtitle'))}</p><div class="heroActions"><a class="primary" href="./minna-index.html?v=${VERSION}">${esc(t('home'))}</a><a class="ghostHero" href="./minna-grammar-hub.html?v=${VERSION}">${esc(t('hub'))}</a><a class="ghostHero" href="./minna-ai-drill.html?v=${VERSION}">${esc(t('drill'))}</a><a class="lightHero" href="./minna-wrongbook-v2.html?v=${VERSION}">${esc(t('wrong'))}</a></div></div><div class="heroStats"><div><b>${c.lesson}</b><span>Lesson</span></div><div><b>${esc(c.jlpt)}</b><span>${esc(t('jlpt'))}</span></div><div><b>AI</b><span>${esc(t('why'))}</span></div></div></div></header><main class="wrap"><section class="panel"><h2>${esc(t('choose'))}</h2><select id="cardSel" style="border:1px solid var(--line);border-radius:8px;padding:10px;min-width:260px">${options()}</select></section><section class="panel"><h2>${esc(t('overview'))}</h2><p>${esc(pick(c.overview))}</p><p><span class="pill blue">Lesson ${c.lesson}</span><span class="pill green">${esc(c.jlpt)}</span><span class="pill yellow">${esc(lang()==='en'?c.en:c.zh)}</span></p></section><section class="panel"><h2>${esc(t('rules'))}</h2><table class="ruleTable"><thead><tr><th>${esc(t('type'))}</th><th>${esc(t('change'))}</th><th>${esc(t('example'))}</th></tr></thead><tbody>${c.rules.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}</tbody></table></section><section class="panel"><h2>${esc(t('mistakes'))}</h2><div class="mistake">${c.mistakes.map((m,i)=>`<div><p><span class="pill red">${esc(t('wrongEx'))}</span> ${esc(m[0])}</p><p><span class="pill green">${esc(t('rightEx'))}</span> ${esc(m[1])}</p><button class="smallBtn" data-explain="${i}">${esc(t('show'))}</button><div class="explain hidden" id="exp${i}">${esc(m[2])}</div></div>`).join('')}</div></section><section class="panel"><h2>${esc(t('graph'))}</h2><p class="graph">${c.links.map(x=>`<a href="./minna-ai-drill.html?v=${VERSION}">${esc(x)}</a>`).join('')}</p></section></main><footer class="wrap footer">${esc(t('footer'))}</footer>`;if(window.MinnaI18n)window.MinnaI18n.installToggle(document.getElementById('langMount'));document.getElementById('cardSel').onchange=e=>{current=e.target.value;localStorage.setItem('minna_grammar_card',current);history.replaceState(null,'',`?g=${current}&v=${VERSION}`);render()};document.querySelectorAll('[data-explain]').forEach(b=>b.onclick=()=>document.getElementById('exp'+b.dataset.explain).classList.toggle('hidden'))}
if(window.MinnaI18n)window.MinnaI18n.onChange(render);render();
})();
</script>
</body>
</html>
