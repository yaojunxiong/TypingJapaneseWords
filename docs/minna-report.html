<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>《みんなの日本語 初級》学习报告</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./minna-auth.js?v=20.3"></script>
<script src="./minna-i18n-core.js?v=20.3"></script>
<link rel="stylesheet" href="./minna-site.css?v=20.3">
<style>
.reportGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.reportCard{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px;box-shadow:0 8px 22px rgba(15,23,42,.06)}.reportCard b{display:block;font-size:30px;line-height:1.1}.reportCard span{color:var(--muted);font-weight:800}.bar{height:10px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:#22c55e}.list{display:grid;gap:10px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff}.pill{display:inline-block;background:#eef2ff;color:#3730a3;border-radius:999px;padding:3px 10px;margin:3px;font-weight:900;font-size:13px}.pill.ok{background:#dcfce7;color:#166534}.pill.warn{background:#fef3c7;color:#92400e}.pill.blue{background:#dbeafe;color:#1d4ed8}.footerReport{text-align:center;color:var(--muted);font-size:13px;padding:22px}
</style>
</head>
<body data-lesson-id="minna_report_v20">
<div id="app"><main class="wrap"><section class="panel">Loading...</section></main></div>
<script>
(function(){
const VERSION='20.3';
const pad=n=>String(n).padStart(2,'0');
const topics={1:'名词句・自我介绍',2:'これ・それ・あれ',3:'ここ・そこ・あそこ',4:'时间・星期',5:'移动・交通',6:'动词ます形',7:'工具・授受基础',8:'形容词',9:'好き・上手',10:'存在句',11:'数量表达',12:'过去式・比较',13:'想要・目的',14:'て形',15:'て形许可',16:'连接动作',17:'ない形',18:'辞书形',19:'た形',20:'普通形',21:'と思います',22:'名词修饰',23:'とき・と',24:'くれます',25:'たら・ても',26:'んです',27:'可能形',28:'ながら',29:'自动词',30:'他动词',31:'意向形',32:'建议・推量',33:'命令・禁止',34:'〜とおりに',35:'条件形',36:'ように',37:'受身形',38:'のは',39:'原因理由',40:'疑问词嵌入',41:'授受高级',42:'ために',43:'そうです',44:'すぎます',45:'場合は',46:'ところです',47:'そうです',48:'使役形',49:'尊敬语',50:'谦让语'};
const topicsEn={1:'Noun Sentences and Self-introduction',2:'Kore, Sore, Are',3:'Koko, Soko, Asoko',4:'Time and Weekdays',5:'Movement and Transport',6:'Verb Masu-form',7:'Tools and Giving/Receiving Basics',8:'Adjectives',9:'Likes and Skills',10:'Existence Sentences',11:'Quantity Expressions',12:'Past Tense and Comparison',13:'Wants and Purpose',14:'Te-form',15:'Te-form Permission',16:'Connecting Actions',17:'Nai-form',18:'Dictionary Form',19:'Ta-form',20:'Plain Form',21:'To omoimasu',22:'Noun Modification',23:'Toki and To',24:'Kuremasu',25:'Tara and Temo',26:'N desu',27:'Potential Form',28:'Nagara',29:'Intransitive Verbs',30:'Transitive Verbs',31:'Volitional Form',32:'Advice and Conjecture',33:'Commands and Prohibition',34:'Toori ni',35:'Conditional Form',36:'You ni',37:'Passive Form',38:'No wa',39:'Causes and Reasons',40:'Embedded Questions',41:'Advanced Giving and Receiving',42:'Tame ni',43:'Sou desu',44:'Sugimasu',45:'Baai wa',46:'Tokoro desu',47:'Sou desu',48:'Causative Form',49:'Honorific Language',50:'Humble Language'};
const dict={badge:{zh:'Learning Report｜学习报告',en:'Learning Report'},title:{zh:'《みんなの日本語 初級》学习报告',en:'Minna no Nihongo Beginner Learning Report'},subtitle:{zh:'汇总本机与云端学习进度，帮助判断下一步该复习哪里。',en:'Summarizes local and cloud progress to help decide what to review next.'},home:{zh:'返回首页',en:'Back Home'},review:{zh:'总复习中心',en:'Review Hub'},wrongbook:{zh:'错题本',en:'Mistakes'},completion:{zh:'总完成率',en:'Overall Completion'},mastered:{zh:'已掌握课程',en:'Mastered Lessons'},records:{zh:'有记录课程',en:'Lessons with Records'},mistakes:{zh:'错题总数',en:'Total Mistakes'},current:{zh:'当前建议课程',en:'Recommended Lesson'},next:{zh:'下一步建议',en:'Next Recommendation'},nextBody:{zh:'优先完成当前课 Mastery；如果有错题，先进入错题本清零。',en:'Finish the current lesson’s Mastery first. If there are mistakes, clear them in the mistake book.'},stage:{zh:'阶段进度',en:'Stage Progress'},weak:{zh:'需要关注的课程',en:'Lessons Needing Attention'},weakEmpty:{zh:'暂时没有明显薄弱课程。',en:'No obvious weak lessons for now.'},lesson:{zh:'第{n}课',en:'Lesson {n}'},progress:{zh:'进度 {p}%',en:'Progress {p}%'},wrong:{zh:'错题 {n}',en:'Mistakes {n}'},noRecord:{zh:'暂无进度记录。请先从首页开始学习。',en:'No progress record yet. Start learning from the home page first.'},footer:{zh:'《みんなの日本語 初級》AI互动学习系统｜学习报告',en:'Minna no Nihongo Beginner AI Learning System | Learning Report'},pageTitle:{zh:'《みんなの日本語 初級》学习报告',en:'Minna no Nihongo Beginner Learning Report'}};
let cloudProgress={};
const i18n=()=>window.MinnaI18n||null;
const lang=()=>i18n()?i18n().lang():(localStorage.getItem('minna_ui_lang')||'zh');
const pick=(zh,en)=>lang()==='en'?en:zh;
const t=(k,vars)=>{let s=(dict[k]&&dict[k][lang()])||dict[k].zh||'';if(vars)Object.keys(vars).forEach(x=>s=s.split('{'+x+'}').join(vars[x]));return s};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function readJson(key){try{return JSON.parse(localStorage.getItem(key)||'null')}catch(e){return null}}
function legacyState(n){const no=pad(n);const keys=[`minna_lesson_${no}`,`lesson${no}v8`,`lesson${no}v7`,`lesson${no}v6`,`lesson${no}v5`,`lesson${n}v8`,`lesson${n}v7`,`lesson${n}v6`,`lesson${n}v5`];for(const key of keys){const value=readJson(key);if(value)return value}return null}
function cloudState(n){const row=cloudProgress['minna_lesson_'+pad(n)];return row&&row.progress?row.progress:null}
function progressOf(n){const state=cloudState(n)||legacyState(n)||{};const mastery=state.mastery||{};const wrong=state.wrong_count!=null?Number(state.wrong_count):state.wrong?Object.keys(state.wrong).filter(k=>state.wrong[k]).length:0;const passed=!!state.mastery_passed||((mastery.vocab||0)>=100&&(mastery.grammar||0)>=80&&(mastery.examples||0)>=80&&(mastery.final||0)>=80&&wrong===0);const done=Number(state.doneLevels||state.completedLevels||state.done_pages||0);const score=Number(state.score||state.totalScore||mastery.final||0);const percent=passed?100:Math.max(0,Math.min(99,Math.round((Number(mastery.vocab||0)+Number(mastery.grammar||0)+Number(mastery.examples||0)+Number(mastery.final||0))/4)||Math.min(90,done*12)||Math.min(90,score)));return{state,wrong,passed,percent,hasRecord:!!Object.keys(state).length}}
function data(){const lessons=Array.from({length:50},(_,i)=>{const n=i+1;return{n,p:progressOf(n)}});const mastered=lessons.filter(x=>x.p.passed).length;const records=lessons.filter(x=>x.p.hasRecord).length;const mistakes=lessons.reduce((s,x)=>s+x.p.wrong,0);const current=lessons.find(x=>!x.p.passed)||lessons[49];const weak=lessons.filter(x=>x.p.hasRecord&&!x.p.passed&&(x.p.wrong>0||x.p.percent<80)).slice(0,8);return{lessons,mastered,records,mistakes,current,weak,completion:Math.round(mastered/50*100)}}
function stageHtml(d){const stages=[[1,13,pick('初级 I 前半','Beginner I First Half')],[14,25,pick('初级 I 后半','Beginner I Second Half')],[26,38,pick('初级 II 前半','Beginner II First Half')],[39,50,pick('初级 II 后半','Beginner II Second Half')]];return stages.map(([a,b,name])=>{const rows=d.lessons.filter(x=>x.n>=a&&x.n<=b);const done=rows.filter(x=>x.p.passed).length;const pct=Math.round(done/rows.length*100);return `<div class="reportCard"><b>${pct}%</b><span>${esc(name)} · ${done}/${rows.length}</span><div class="bar"><i style="width:${pct}%"></i></div></div>`}).join('')}
function weakHtml(d){if(!d.weak.length)return `<p class="small">${esc(d.records?t('weakEmpty'):t('noRecord'))}</p>`;return `<div class="list">${d.weak.map(x=>`<a class="row" href="./minna-lesson-v16.html?n=${x.n}&v=${VERSION}"><span><b>${esc(t('lesson',{n:x.n}))}</b><br><small>${esc(pick(topics[x.n],topicsEn[x.n]))}</small></span><span><span class="pill warn">${esc(t('wrong',{n:x.p.wrong}))}</span><span class="pill blue">${esc(t('progress',{p:x.p.percent}))}</span></span></a>`).join('')}</div>`}
function render(){const d=data();document.documentElement.lang=lang()==='en'?'en':'zh-CN';document.title=t('pageTitle');document.getElementById('app').innerHTML=`<header class="hero"><div class="wrap heroGrid"><div class="heroCopy"><div class="heroMeta"><span class="badge">${esc(t('badge'))}</span><span id="langMount"></span></div><h1>${esc(t('title'))}</h1><p>${esc(t('subtitle'))}</p><div class="heroActions"><a class="primary" href="./minna-index.html?v=${VERSION}">${esc(lang()==='en'?'Home':'首页')}</a><a class="ghostHero" href="./minna-review.html?v=${VERSION}">${esc(lang()==='en'?'Review':'总复习')}</a><a class="ghostHero" href="./minna-ai-coach.html?v=${VERSION}">${esc(lang()==='en'?'AI Coach':'AI教练')}</a><a class="ghostHero" href="./minna-learning-path.html?v=${VERSION}">${esc(lang()==='en'?'Path':'学习路线')}</a><a class="ghostHero" href="./minna-grammar-hub.html?v=${VERSION}">${esc(lang()==='en'?'Grammar':'语法中心')}</a><a class="lightHero" href="./minna-ai-drill.html?v=${VERSION}">${esc(lang()==='en'?'Drill':'AI练习')}</a><a class="lightHero" href="./minna-report.html?v=${VERSION}">${esc(lang()==='en'?'Report':'学习报告')}</a></div></div><div class="heroStats"><div><b>${d.completion}%</b><span>${esc(t('completion'))}</span></div><div><b>${d.mastered}</b><span>${esc(t('mastered'))}</span></div><div><b>${d.mistakes}</b><span>${esc(t('mistakes'))}</span></div></div></div></header><main class="wrap"><section class="panel"><h2>${esc(t('completion'))}</h2><div class="reportGrid"><div class="reportCard"><b>${d.completion}%</b><span>${esc(t('completion'))}</span><div class="bar"><i style="width:${d.completion}%"></i></div></div><div class="reportCard"><b>${d.mastered}</b><span>${esc(t('mastered'))}</span></div><div class="reportCard"><b>${d.records}</b><span>${esc(t('records'))}</span></div><div class="reportCard"><b>${d.mistakes}</b><span>${esc(t('mistakes'))}</span></div></div></section><section class="panel"><h2>${esc(t('next'))}</h2><p>${esc(t('nextBody'))}</p><p><a class="primary" href="./minna-lesson-v16.html?n=${d.current.n}&v=${VERSION}">${esc(t('current'))}: ${esc(t('lesson',{n:d.current.n}))}</a></p></section><section class="panel"><h2>${esc(t('stage'))}</h2><div class="reportGrid">${stageHtml(d)}</div></section><section class="panel"><h2>${esc(t('weak'))}</h2>${weakHtml(d)}</section></main><footer class="wrap footerReport">${esc(t('footer'))}</footer>`;if(window.MinnaI18n)window.MinnaI18n.installToggle(document.getElementById('langMount'))}
async function start(){try{if(window.MinnaAuth){await MinnaAuth.init({lessonId:'minna_report_v20'});const rows=await MinnaAuth.listProgress();cloudProgress={};rows.forEach(row=>{if(row&&row.lesson_id)cloudProgress[row.lesson_id]=row})}}catch(e){console.warn('[Minna Report] cloud skipped:',e.message||e)}render()}
if(window.MinnaI18n)window.MinnaI18n.onChange(render);
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
</script>
</body>
</html>
