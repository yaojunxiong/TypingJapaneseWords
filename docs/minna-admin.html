:root{--bg:#f8fafc;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--blue:#2563eb;--purple:#7c3aed}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,#dbeafe,var(--bg) 45%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Noto Sans JP","Microsoft YaHei",sans-serif;line-height:1.65}header{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;padding:30px 18px}.wrap,main{max-width:1220px;margin:auto}main{padding:18px}.badge{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:5px 12px;font-weight:900;margin-bottom:10px}h1{margin:0;font-size:30px}.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 30px rgba(15,23,42,.08);padding:16px;margin-bottom:14px}.btns,.filters,.pager{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}button,a.btn{border:0;border-radius:14px;padding:10px 14px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:#22c55e;color:#052e16}.light{background:#e2e8f0;color:#0f172a}.dark{background:#334155;color:#fff}.pill{display:inline-block;background:#eef2ff;color:#3730a3;border-radius:999px;padding:3px 9px;margin:2px;font-weight:800}.ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}.auto{background:#dbeafe;color:#1d4ed8}.small{color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center}.stats b{font-size:28px;display:block}.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:18px;background:white}.tbl{width:100%;border-collapse:collapse;min-width:1080px}.tbl th,.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.tbl th{background:#f1f5f9;color:#334155;font-size:13px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:12px}.filters input,.filters select{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:white;min-height:40px}.filters input{min-width:260px;flex:1}.pager button:disabled{opacity:.45;cursor:not-allowed}.footer{text-align:center;color:var(--muted);font-size:13px;padding:22px}@media(max-width:760px){h1{font-size:25px}.stats{grid-template-columns:1fr 1fr}.filters input{min-width:100%}}
