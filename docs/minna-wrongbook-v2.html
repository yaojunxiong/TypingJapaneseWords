<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>《みんなの日本語 初級》错题专项训练中心</title>
<script src="./minna-i18n-core.js?v=20.3"></script>
<link rel="stylesheet" href="./minna-site.css?v=20.3">
<style>
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:0 8px 24px rgba(15,23,42,.06)}.card b{font-size:28px;display:block}.pill{display:inline-block;border-radius:999px;padding:4px 10px;margin:4px;font-weight:900;font-size:12px}.red{background:#fee2e2;color:#991b1b}.yellow{background:#fef3c7;color:#92400e}.green{background:#dcfce7;color:#166534}.blue{background:#dbeafe;color:#1d4ed8}.list{display:grid;gap:10px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px}.groupCard{margin:10px 0;padding:12px;border:1px solid var(--line);border-radius:8px;background:#fff}.footer{text-align:center;color:var(--muted);font-size:13px;padding:22px}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
const VERSION='20.3';
const lessons=Array.from({length:50},(_,i)=>i+1);
const dict={title:{zh:'《みんなの日本語 初級》错题专项训练中心',en:'Minna no Nihongo Wrongbook Training Center'},badge:{zh:'Wrongbook Training｜错题专项',en:'Wrongbook Training'},subtitle:{zh:'集中处理高频错题、低掌握度课程和重点语法薄弱项。',en:'Focus on high-frequency mistakes, low-mastery lessons, and weak grammar areas.'},home:{zh:'返回首页',en:'Back Home'},review:{zh:'总复习',en:'Review Hub'},report:{zh:'学习报告',en:'Learning Report'},total:{zh:'错题总数',en:'Total Mistakes'},weak:{zh:'薄弱课程',en:'Weak Lessons'},focus:{zh:'重点训练',en:'Focus Training'},recovery:{zh:'恢复机制',en:'Recovery System'},recoveryBody:{zh:'连续正确 3 次后自动建议移出错题本（下一阶段接入真正 AI adaptive logic）。',en:'After 3 correct attempts, the system recommends removing the item from the wrongbook.'},types:{zh:'专项训练方向',en:'Training Modes'},particles:{zh:'助词专项',en:'Particles'},te:{zh:'变形专项',en:'Conjugation'},keigo:{zh:'敬语专项',en:'Keigo'},listening:{zh:'表达专项',en:'Expression'},daily:{zh:'今日推荐复习',en:'Today Recommended Review'},groupFix:{zh:'分组订正',en:'Grouped Corrections'},groupParticles:{zh:'基础句型与助词',en:'Basics and Particles'},groupConj:{zh:'动词变形与活用',en:'Verb Conjugations'},groupExpr:{zh:'原因条件与表达',en:'Reasons/Conditions'},groupKeigo:{zh:'敬语与商务表达',en:'Keigo and Business'},footer:{zh:'《みんなの日本語 初級》AI互动学习系统｜错题专项训练中心',en:'Minna no Nihongo AI Learning System | Wrongbook Training'},pageTitle:{zh:'《みんなの日本語 初級》错题专项训练中心',en:'Wrongbook Training Center'},lesson:{zh:'第{n}课',en:'Lesson {n}'},mistakes:{zh:'错题 {n}',en:'Mistakes {n}'},mastery:{zh:'掌握度 {n}%',en:'Mastery {n}%'}};
const lang=()=>window.MinnaI18n?window.MinnaI18n.lang():(localStorage.getItem('minna_ui_lang')||'zh');
const t=(k,v)=>{let s=(dict[k]&&dict[k][lang()])||dict[k].zh||'';if(v)Object.keys(v).forEach(x=>s=s.split('{'+x+'}').join(v[x]));return s};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function readJson(key){try{return JSON.parse(localStorage.getItem(key)||'null')}catch(e){return null}}
function lessonState(n){const no=String(n).padStart(2,'0');return readJson('minna_lesson_'+no)||{}}
function lessonData(){return lessons.map(n=>{const s=lessonState(n);const mastery=s.mastery||{};const wrong=s.wrong_count!=null?Number(s.wrong_count):(s.wrong?Object.keys(s.wrong).length:0);const pct=Math.round((Number(mastery.vocab||0)+Number(mastery.grammar||0)+Number(mastery.examples||0)+Number(mastery.final||0))/4)||0;return{n,wrong,pct}})}
function groupOf(n){
  if(n<=13)return 'particles';
  if([14,17,19,20,25,26,27,31,37,48].includes(n))return 'conj';
  if([49,50,41].includes(n))return 'keigo';
  return 'expr';
}
function groupedHtml(rows){
  const groups={particles:[],conj:[],expr:[],keigo:[]};
  rows.forEach(r=>groups[groupOf(r.n)].push(r));
  const names={particles:t('groupParticles'),conj:t('groupConj'),expr:t('groupExpr'),keigo:t('groupKeigo')};
  return Object.keys(groups).filter(k=>groups[k].length).map(k=>`<div class="groupCard"><h3>${esc(names[k])}</h3><div class="list">${groups[k].map(x=>`<a class="row" href="./minna-lesson-v16.html?n=${x.n}&v=${VERSION}&mode=wrong"><span><b>${esc(t('lesson',{n:x.n}))}</b></span><span><span class="pill red">${esc(t('mistakes',{n:x.wrong}))}</span><span class="pill yellow">${esc(t('mastery',{n:x.pct}))}</span></span></a>`).join('')}</div></div>`).join('');
}
function render(){const rows=lessonData();const total=rows.reduce((a,b)=>a+b.wrong,0);const weak=rows.filter(x=>x.wrong>0||x.pct<70).sort((a,b)=>(b.wrong-a.wrong)||(a.pct-b.pct)).slice(0,12);document.documentElement.lang=lang()==='en'?'en':'zh-CN';document.title=t('pageTitle');document.getElementById('app').innerHTML=`<header class="hero"><div class="wrap heroGrid"><div class="heroCopy"><div class="heroMeta"><span class="badge">${esc(t('badge'))}</span><span id="langMount"></span></div><h1>${esc(t('title'))}</h1><p>${esc(t('subtitle'))}</p><div class="heroActions"><a class="primary" href="./minna-index.html?v=${VERSION}">${esc(lang()==='en'?'Home':'首页')}</a><a class="ghostHero" href="./minna-review.html?v=${VERSION}">${esc(lang()==='en'?'Review':'总复习')}</a><a class="ghostHero" href="./minna-ai-coach.html?v=${VERSION}">${esc(lang()==='en'?'AI Coach':'AI教练')}</a><a class="ghostHero" href="./minna-learning-path.html?v=${VERSION}">${esc(lang()==='en'?'Path':'学习路线')}</a><a class="ghostHero" href="./minna-grammar-hub.html?v=${VERSION}">${esc(lang()==='en'?'Grammar':'语法中心')}</a><a class="lightHero" href="./minna-ai-drill.html?v=${VERSION}">${esc(lang()==='en'?'Drill':'AI练习')}</a><a class="lightHero" href="./minna-report.html?v=${VERSION}">${esc(lang()==='en'?'Report':'学习报告')}</a></div></div><div class="heroStats"><div><b>${total}</b><span>${esc(t('total'))}</span></div><div><b>${weak.length}</b><span>${esc(t('weak'))}</span></div><div><b>3×</b><span>${esc(t('recovery'))}</span></div></div></div></header><main class="wrap"><section class="panel"><div class="grid"><div class="card"><b>${total}</b><span>${esc(t('total'))}</span><p><span class="pill red">Hard</span><span class="pill yellow">Medium</span><span class="pill green">Recovered</span></p></div><div class="card"><b>${weak.length}</b><span>${esc(t('focus'))}</span><p>${esc(t('daily'))}</p></div><div class="card"><b>3×</b><span>${esc(t('recovery'))}</span><p>${esc(t('recoveryBody'))}</p></div></div></section><section class="panel"><h2>${esc(t('types'))}</h2><p><span class="pill blue">${esc(t('particles'))}</span><span class="pill blue">${esc(t('te'))}</span><span class="pill blue">${esc(t('keigo'))}</span><span class="pill blue">${esc(t('listening'))}</span></p></section><section class="panel"><h2>${esc(t('groupFix'))}</h2>${weak.length?groupedHtml(weak):`<p class="small">No weak lessons.</p>`}</section></main><footer class="wrap footer">${esc(t('footer'))}</footer>`;if(window.MinnaI18n)window.MinnaI18n.installToggle(document.getElementById('langMount'))}
if(window.MinnaI18n)window.MinnaI18n.onChange(render);render();
})();
</script>
</body>
</html>
