<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="./minna-pwa-manifest.json">
<title>我的收藏词汇 | Minna AI</title>
<script src="./minna-version.js?v=22.1"></script>
<link rel="stylesheet" href="./minna-site.css?v=22.1">
<link rel="stylesheet" href="./minna-lesson-v16.css?v=22.1">
</head>
<body>
<div id="app">
  <header class="hero">
    <div class="wrap heroGrid">
      <div class="heroCopy">
        <span class="badge">Vocabulary Favorites</span>
        <h1>我的收藏词汇</h1>
        <p>集中复习你在课程中收藏的日语单词。</p>
        <div class="heroActions">
          <a class="primary" href="./minna-app.html?v=22.1">返回首页</a>
          <a class="ghostHero" href="./minna-app-lessons.html?v=22.1">进入课程</a>
        </div>
      </div>
    </div>
  </header>
  <main class="wrap">
    <section class="panel">
      <div class="sectionHead">
        <div>
          <h2>收藏词汇列表</h2>
          <p class="small" id="favCount">Loading...</p>
        </div>
        <div class="actionStrip">
          <button class="light" id="shuffleBtn">随机复习</button>
          <button class="ghost" id="exportBtn">导出 JSON</button>
          <button class="light" id="clearBtn">清空收藏</button>
        </div>
      </div>
      <div class="filters">
        <input id="favSearch" placeholder="搜索：日本 / にほん / 第2课">
      </div>
      <div id="favGrid" class="lessonGrid"></div>
    </section>
  </main>
</div>
<script src="./minna-favorites-page.js?v=22.1"></script>
<script src="./minna-sw-register.js?v=22.1"></script>
</body>
</html>
