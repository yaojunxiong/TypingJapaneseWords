<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>《みんなの日本語 初級》AI练习引擎</title>
<script src="./minna-i18n-core.js?v=20.3"></script>
<link rel="stylesheet" href="./minna-site.css?v=20.3">
<style>
.drillGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.drillCard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:0 8px 24px rgba(15,23,42,.06)}.drillCard b{font-size:26px;display:block}.pill{display:inline-block;border-radius:999px;padding:4px 10px;margin:4px;font-weight:900;font-size:12px}.blue{background:#dbeafe;color:#1d4ed8}.green{background:#dcfce7;color:#166534}.yellow{background:#fef3c7;color:#92400e}.red{background:#fee2e2;color:#991b1b}.box{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0}.q{font-weight:1000}.answer{display:none;margin-top:8px;color:#166534;font-weight:900}.show .answer{display:block}.footer{text-align:center;color:var(--muted);font-size:13px;padding:22px}select,button{font:inherit}.control{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.control select{border:1px solid var(--line);border-radius:8px;padding:10px;min-width:220px}.control button{border:0;border-radius:8px;padding:10px 14px;font-weight:1000;cursor:pointer}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
const VERSION='20.3';
const lessons={14:['て形','Te-form',['書きます → 書いて','飲みます → 飲んで','行きます → 行って']],17:['ない形','Nai-form',['行きます → 行かない','食べます → 食べない','します → しない']],19:['た形','Ta-form',['書きます → 書いた','飲みます → 飲んだ','行きます → 行った']],21:['と思います','To omoimasu',['明日雨が降ると思います','日本語はおもしろいと思います']],25:['たら・ても','Tara / Temo',['雨が降ったら、行きません','高くても買います']],26:['んです','N desu',['どうしたんですか','頭が痛いんです']],27:['可能形','Potential Form',['日本語が話せます','漢字が読めます']],49:['尊敬语','Honorific Language',['先生がいらっしゃいます','社長がおっしゃいました']],50:['谦让语','Humble Language',['私が参ります','資料を拝見します']]};
const dict={badge:{zh:'AI Drill Engine｜AI练习引擎',en:'AI Drill Engine'},title:{zh:'《みんなの日本語 初級》AI练习引擎 v1',en:'Minna no Nihongo AI Drill Engine v1'},subtitle:{zh:'根据课程主题自动生成词汇、语法、场景和错题导向练习。当前为前端模板版，后续可接入真正 AI API。',en:'Generate vocabulary, grammar, scenario, and mistake-focused drills by lesson topic. This is a frontend template version, ready for future AI API integration.'},home:{zh:'返回首页',en:'Back Home'},review:{zh:'总复习',en:'Review Hub'},grammar:{zh:'语法中心',en:'Grammar Hub'},wrong:{zh:'错题专项',en:'Wrongbook Training'},choose:{zh:'选择课程主题',en:'Choose lesson topic'},generate:{zh:'生成练习',en:'Generate Drills'},types:{zh:'练习类型',en:'Drill Types'},vocab:{zh:'词汇/变形',en:'Vocabulary / Conjugation'},grammarDrill:{zh:'语法选择',en:'Grammar Choice'},scenario:{zh:'场景表达',en:'Scenario Expression'},error:{zh:'错题导向',en:'Error-focused'},prompt:{zh:'AI提示词模板',en:'AI Prompt Template'},promptBody:{zh:'请根据《みんなの日本語 初級》第{n}课「{topic}」生成10道适合初学者的中英双语练习题，包含答案、解释和常见错误提醒。',en:'Generate 10 beginner-friendly bilingual exercises for Minna no Nihongo Lesson {n}: {topic}, including answers, explanations, and common mistake notes.'},q1:{zh:'把下面表达转换为目标语法：',en:'Convert the expression using the target grammar:'},q2:{zh:'选择最自然的句子：',en:'Choose the most natural sentence:'},q3:{zh:'在这个场景中应该怎么说？',en:'What would you say in this situation?'},q4:{zh:'找出常见错误并改正：',en:'Find and correct the common mistake:'},show:{zh:'显示答案',en:'Show Answer'},answer:{zh:'参考答案',en:'Sample Answer'},footer:{zh:'《みんなの日本語 初級》AI互动学习系统｜AI练习引擎',en:'Minna no Nihongo AI Learning System | AI Drill Engine'},pageTitle:{zh:'《みんなの日本語 初級》AI练习引擎',en:'Minna no Nihongo AI Drill Engine'}};
const lang=()=>window.MinnaI18n?window.MinnaI18n.lang():(localStorage.getItem('minna_ui_lang')||'zh');
const t=(k,v)=>{let s=(dict[k]&&dict[k][lang()])||dict[k].zh||'';if(v)Object.keys(v).forEach(x=>s=s.split('{'+x+'}').join(v[x]));return s};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const params=()=>new URLSearchParams(location.search);
function lessonFromQuery(){
  const p=params();
  const lessonNum=Number(p.get('lesson')||p.get('l')||0);
  if(lessons[lessonNum])return lessonNum;
  const g=String(p.get('g')||'').trim().toLowerCase();
  if(!g)return 0;
  const hit=Object.keys(lessons).find(n=>String(lessons[n][1]||'').toLowerCase().includes(g)||String(lessons[n][0]||'').toLowerCase().includes(g));
  return Number(hit||0);
}
let current=lessonFromQuery()||Number(localStorage.getItem('minna_ai_drill_lesson')||14);
function options(){return Object.keys(lessons).map(n=>`<option value="${n}" ${Number(n)===current?'selected':''}>${lang()==='en'?'Lesson':'第'} ${n} · ${esc(lang()==='en'?lessons[n][1]:lessons[n][0])}</option>`).join('')}
function drillHtml(){const [zh,en,examples]=lessons[current];const topic=lang()==='en'?en:zh;const sample=examples[0];return `<div class="box"><p class="q">1. ${esc(t('q1'))}</p><p>${esc(sample.split('→')[0]||sample)}</p><button class="primary" onclick="this.parentElement.classList.toggle('show')">${esc(t('show'))}</button><p class="answer">${esc(t('answer'))}: ${esc(sample)}</p></div><div class="box"><p class="q">2. ${esc(t('q2'))}</p><p>A. ${esc(examples[1]||sample)}<br>B. ${esc((examples[1]||sample).replace('ます','です'))}</p><button class="primary" onclick="this.parentElement.classList.toggle('show')">${esc(t('show'))}</button><p class="answer">${esc(t('answer'))}: A</p></div><div class="box"><p class="q">3. ${esc(t('q3'))}</p><p>${esc(topic)} · ${lang()==='en'?'Make one sentence for daily conversation.':'请造一个日常会话句。'}</p><button class="primary" onclick="this.parentElement.classList.toggle('show')">${esc(t('show'))}</button><p class="answer">${esc(t('answer'))}: ${esc(examples[2]||sample)}</p></div><div class="box"><p class="q">4. ${esc(t('q4'))}</p><p>${esc((examples[0]||sample).replace('て','ますて'))}</p><button class="primary" onclick="this.parentElement.classList.toggle('show')">${esc(t('show'))}</button><p class="answer">${esc(t('answer'))}: ${esc(sample)}</p></div>`}
function render(){const [zh,en]=lessons[current];const topic=lang()==='en'?en:zh;document.documentElement.lang=lang()==='en'?'en':'zh-CN';document.title=t('pageTitle');document.getElementById('app').innerHTML=`<header class="hero"><div class="wrap heroGrid"><div class="heroCopy"><div class="heroMeta"><span class="badge">${esc(t('badge'))}</span><span id="langMount"></span></div><h1>${esc(t('title'))}</h1><p>${esc(t('subtitle'))}</p><div class="heroActions"><a class="primary" href="./minna-index.html?v=${VERSION}">${esc(lang()==='en'?'Home':'首页')}</a><a class="ghostHero" href="./minna-review.html?v=${VERSION}">${esc(lang()==='en'?'Review':'总复习')}</a><a class="ghostHero" href="./minna-ai-coach.html?v=${VERSION}">${esc(lang()==='en'?'AI Coach':'AI教练')}</a><a class="ghostHero" href="./minna-learning-path.html?v=${VERSION}">${esc(lang()==='en'?'Path':'学习路线')}</a><a class="ghostHero" href="./minna-grammar-hub.html?v=${VERSION}">${esc(lang()==='en'?'Grammar':'语法中心')}</a><a class="lightHero" href="./minna-ai-drill.html?v=${VERSION}">${esc(lang()==='en'?'Drill':'AI练习')}</a><a class="lightHero" href="./minna-report.html?v=${VERSION}">${esc(lang()==='en'?'Report':'学习报告')}</a></div></div><div class="heroStats"><div><b>4</b><span>${esc(t('types'))}</span></div><div><b>${current}</b><span>Lesson</span></div><div><b>AI</b><span>Ready</span></div></div></div></header><main class="wrap"><section class="panel"><h2>${esc(t('choose'))}</h2><div class="control"><select id="lessonSel">${options()}</select><button class="primary" id="genBtn">${esc(t('generate'))}</button></div></section><section class="panel"><h2>${esc(t('types'))}</h2><p><span class="pill blue">${esc(t('vocab'))}</span><span class="pill green">${esc(t('grammarDrill'))}</span><span class="pill yellow">${esc(t('scenario'))}</span><span class="pill red">${esc(t('error'))}</span></p><div id="drills">${drillHtml()}</div></section><section class="panel"><h2>${esc(t('prompt'))}</h2><div class="box"><code>${esc(t('promptBody',{n:current,topic}))}</code></div></section></main><footer class="wrap footer">${esc(t('footer'))}</footer>`;if(window.MinnaI18n)window.MinnaI18n.installToggle(document.getElementById('langMount'));document.getElementById('lessonSel').onchange=e=>{current=Number(e.target.value);localStorage.setItem('minna_ai_drill_lesson',current);render()};document.getElementById('genBtn').onclick=render}
if(window.MinnaI18n)window.MinnaI18n.onChange(render);render();
})();
</script>
</body>
</html>
