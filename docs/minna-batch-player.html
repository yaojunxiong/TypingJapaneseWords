<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minna Batch Lesson</title><link rel="manifest" href="./minna-app.webmanifest"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./minna-auth.js"></script><script src="./minna-batch-lesson.js"></script><style>:root{--bg:#f8fafc;--card:#fff;--ink:#0f172a;--line:#e2e8f0;--blue:#2563eb;--purple:#7c3aed}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,#dbeafe,var(--bg) 45%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Noto Sans JP",sans-serif}header{background:linear-gradient(135deg,var(--blue),var(--purple));color:white;padding:22px 18px}.wrap,main{max-width:1180px;margin:auto}main{padding:18px}.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 30px rgba(15,23,42,.08);padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.map{display:flex;gap:7px;flex-wrap:wrap}.dot{border:0;border-radius:999px;padding:8px 11px;font-weight:900}.cur{background:#2563eb;color:white}.done{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}button,a.btn{border:0;border-radius:14px;padding:10px 13px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-block;margin:3px}.primary{background:#22c55e;color:#052e16}.light{background:#e2e8f0;color:#0f172a}.ghost{background:#334155;color:white}.google{background:white;color:#111827;border:1px solid #d1d5db}.jp{font-size:30px;font-weight:900;line-height:1.7}.kana{color:#2563eb;font-weight:800}.small{color:#64748b}.box{border-radius:18px;padding:14px;margin:10px 0}.jpbox{border:2px solid #bfdbfe}.cnbox{background:#ecfdf5;border:1px solid #99f6e4;color:#14532d}.quiz{background:#fffbeb;border:1px solid #fde68a}.opts button{background:#fef3c7;color:#78350f;border-radius:999px}.opts .correct{background:#dcfce7;color:#166534}.opts .wrong{background:#fee2e2;color:#991b1b}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}.stats b{font-size:24px;display:block}.bar{height:10px;background:#e2e8f0;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,#f59e0b,#22c55e);width:0}.pill{display:inline-block;background:#eef2ff;color:#3730a3;border-radius:999px;padding:3px 9px;margin:2px;font-weight:800}@media(max-width:850px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.jp{font-size:24px}}</style></head><body><header><div class="wrap"><span class="pill" id="badge">Batch Lesson</span><h1 id="title">Loading...</h1><p id="sub"></p></div></header><main><section class="grid"><div class="panel"><b>学习地图</b><div id="map" class="map"></div><p><a class="btn primary" href="./minna-index.html">🏠 课程首页</a><button class="google" onclick="login()">G Google登录</button><button class="light" onclick="logout()">退出</button><button class="ghost" onclick="cloudSave()">☁️ 保存</button><button class="ghost" onclick="cloudLoad()">⬇️ 读取</button></p><p><b>登录：</b><span id="auth">检查中</span><br><b>云端：</b><span id="cloud">初始化中</span></p></div><div class="panel"><div class="stats"><div><b id="score">0</b><span>分数</span></div><div><b id="level">1</b><span>等级</span></div><div><b id="done">0</b><span>完成</span></div><div><b id="wrong">0</b><span>错题</span></div></div><div class="bar"><span id="xp"></span></div><p id="badges"></p></div></section><section class="card"><div id="stage"></div><p><button class="primary" onclick="speakCN()">🔊 中文讲解</button><button class="ghost" onclick="speakJP()">🇯🇵 日语朗读</button><button class="light" onclick="prev()">上一页</button><button class="light" onclick="next()">下一页</button><button class="primary" onclick="markDone()">✅ 学会了</button><button class="ghost" onclick="showAllProgress()">📚 全课进度</button><span id="meta" class="small"></span></p></section><section class="grid"><div class="panel"><h3>本课重点</h3><div id="points"></div></div><div class="panel"><h3>使用说明</h3><p>这是第11–50课批量版：统一页面、统一登录、统一云端保存。后续可继续把每课内容扩展成更详细的逐句讲解版。</p></div></section></main><script>const n=Number(new URLSearchParams(location.search).get('n')||document.body.dataset.lesson||11),d=MinnaBatchLesson.DATA[n],LESSON_ID='minna_lesson_'+MinnaBatchLesson.pad(n),slides=MinnaBatchLesson.buildSlides(d,n),esc=MinnaBatchLesson.esc;document.body.dataset.lessonId=LESSON_ID;let key='lesson'+MinnaBatchLesson.pad(n)+'v1',idx=Number(localStorage.getItem(key+'idx')||0),state=JSON.parse(localStorage.getItem(key)||'{"xp":0,"score":0,"done":{},"wrong":{},"badges":{}}'),user=null;const $=id=>document.getElementById(id);$('badge').textContent='AI互动学习App｜'+d.title;$('title').textContent='《みんなの日本語 初級Ⅰ》'+d.title;$('sub').textContent=d.sub+'｜'+d.theme;$('points').innerHTML=d.points.map(p=>'<span class="pill">'+esc(p)+'</span>').join('');function ids(o){return Object.keys(o||{}).filter(k=>o[k])}function save(){localStorage.setItem(key,JSON.stringify(state));localStorage.setItem(key+'idx',idx)}function update(){save();$('score').textContent=state.score||0;$('level').textContent=Math.floor((state.xp||0)/100)+1;$('done').textContent=ids(state.done).length;$('wrong').textContent=ids(state.wrong).length;$('xp').style.width=((state.xp||0)%100)+'%';$('map').innerHTML=slides.map((s,i)=>'<button class="dot '+(i===idx?'cur ':'')+(state.done[i]?'done ':'')+(state.wrong[i]?'bad ':'')+'" onclick="go('+i+')">'+(i+1)+'</button>').join('');$('badges').innerHTML=Object.values(state.badges||{}).map(b=>'<span class="pill">🏅 '+esc(b)+'</span>').join('')||'<span class="pill">还没有徽章</span>';$('meta').textContent=(idx+1)+'/'+slides.length}function render(){const s=slides[idx];$('stage').innerHTML='<h2>'+esc(s.t)+'</h2><div class="box jpbox"><b>日语例句</b><div class="jp">'+esc(s.jp)+'</div><div class="kana">假名：'+esc(s.kana)+'</div><div class="small">Romaji: '+esc(s.romaji)+'</div></div><div class="box cnbox"><b>中文讲解</b><p>'+esc(s.cn)+'</p><p><b>提示：</b>'+esc(s.tip)+'</p></div><div class="box quiz"><b>小测验</b><p>'+esc(s.q)+'</p><div class="opts">'+s.opts.map((o,i)=>'<button onclick="answer('+i+')">'+esc(o)+'</button>').join('')+'</div><p id="fb" class="small">请选择一个答案</p></div>';update()}function speak(t,lang){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang=lang;u.rate=lang==='ja-JP'?.82:.92;speechSynthesis.speak(u)}function speakCN(){let s=slides[idx];speak(s.t+'。'+s.cn+'。'+s.tip,'zh-CN')}function speakJP(){speak(slides[idx].jp,'ja-JP')}function gain(x,b){state.xp=(state.xp||0)+x;state.score=(state.score||0)+x;if(ids(state.done).length>=3)state.badges.first=d.title+'入门';if(ids(state.done).length>=slides.length)state.badges.finish=d.title+'完成';update()}function answer(k){let s=slides[idx];document.querySelectorAll('.opts button').forEach((b,i)=>{b.disabled=true;if(i===s.a)b.classList.add('correct');if(i===k&&k!==s.a)b.classList.add('wrong')});if(k===s.a){$('fb').innerHTML='答对了！';state.done[idx]=true;delete state.wrong[idx];gain(10,'quiz')}else{$('fb').innerHTML='再想想：'+esc(s.tip);state.wrong[idx]=true;update()}}function markDone(){state.done[idx]=true;gain(5,'done');next()}function next(){idx=Math.min(slides.length-1,idx+1);render()}function prev(){idx=Math.max(0,idx-1);render()}function go(i){idx=i;render()}function authStatus(){user=MinnaAuth.getUser();$('auth').textContent=user?('已登录：'+(user.email||user.id)):'未登录';$('cloud').textContent=user?'Supabase 已连接':'可本地学习'}async function login(){try{await MinnaAuth.loginWithGoogle()}catch(e){alert(e.message)}}async function logout(){await MinnaAuth.logout();authStatus()}async function cloudSave(){try{$('cloud').textContent='保存中...';await MinnaAuth.saveProgress(state,LESSON_ID);$('cloud').textContent='已保存 '+new Date().toLocaleTimeString()}catch(e){$('cloud').textContent='保存失败：'+e.message}}async function cloudLoad(){try{$('cloud').textContent='读取中...';let r=await MinnaAuth.loadProgress(LESSON_ID);if(r&&r.progress){state=r.progress;render();$('cloud').textContent='已读取'}}catch(e){$('cloud').textContent='读取失败：'+e.message}}async function showAllProgress(){try{let rows=await MinnaAuth.listProgress();alert(rows.map(r=>r.lesson_id+' / '+new Date(r.updated_at).toLocaleString()).join('\n')||'暂无云端记录')}catch(e){alert(e.message)}}MinnaAuth.init({lessonId:LESSON_ID}).then(()=>{authStatus();render();window.addEventListener('minna-auth-changed',authStatus)}).catch(e=>{$('auth').textContent='Auth失败';$('cloud').textContent=e.message;render()});</script></body></html>
