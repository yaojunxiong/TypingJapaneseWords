[q.a];if(ok){state.quizOK[kind+'_'+qi]=true;state.score=(state.score||0)+10;state.xp=(state.xp||0)+10}else{state.wrong[kind+'_'+qi]=true}const pct=Object.keys(state.quizOK).filter(x=>x.startsWith(kind+'_')).length/masteryData[kind].length*100;setMastery(kind,pct)}function renderExamples(){state.exampleOK=state.exampleOK||{};const ex=masteryData.examples[0];$('stage').innerHTML='<h2>核心例句｜句子排序</h2>'+meter()+'<p class="small">先读中文，再按顺序点击日语片段。</p><div class="box cnbox"><b>中文：</b>'+esc(ex.cn)+'</div><div class="sentenceBox" id="orderBox">'+orderAnswer.map(x=>'<span class="pill">'+esc(x)+'</span>').join('')+'</div><div class="sentenceBank">'+ex.parts.sort(()=>Math.random()-.5).map(p=>'<button class="choice" onclick="pickPart(this,\''+p.replace(/'/g,'&#39;')+'\')">'+esc(p)+'</button>').join('')+'</div><p><button class="primary" onclick="checkOrder()">检查排序</button><button class="light" onclick="nextExample()">下一句</button></p><p id="fb" class="small"></p>'}let exampleIndex=0;function nextExample(){exampleIndex=(exampleIndex+1)%masteryData.examples.length;orderAnswer=[];renderExampleIndex()}function renderExampleIndex(){const ex=masteryData.examples[exampleIndex];$('stage').innerHTML='<h2>核心例句｜句子排序</h2>'+meter()+'<div class="box cnbox"><b>中文：</b>'+esc(ex.cn)+'</div><div class="sentenceBox" id="orderBox">'+orderAnswer.map(x=>'<span class="pill">'+esc(x)+'</span>').join('')+'</div><div class="sentenceBank">'+[...ex.parts].sort(()=>Math.random()-.5).map(p=>'<button class="choice" onclick="pickPart(this,\''+p.replace(/'/g,'&#39;')+'\')">'+esc(p)+'</button>').join('')+'</div><p><button class="primary" onclick="checkOrder()">检查排序</button><button class="light" onclick="nextExample()">下一句</button><button class="ghost" onclick="speak(\''+ex.jp.replace(/'/g,'&#39;')+'\',\'ja-JP\')">朗读</button></p><p id="fb" class="small"></p>'}function pickPart(btn,p){orderAnswer.push(p);btn.disabled=true;btn.classList.add('selected');$('orderBox').innerHTML=orderAnswer.map(x=>'<span class="pill">'+esc(x)+'</span>').join('')}function checkOrder(){const ex=masteryData.examples[exampleIndex],ok=orderAnswer.join('')===ex.parts.join('');$('fb').textContent=ok?'正确：'+ex.jp:'顺序不对，正确是：'+ex.jp;if(ok){state.exampleOK[exampleIndex]=true;state.score=(state.score||0)+15;state.xp=(state.xp||0)+15}else{state.wrong['example_'+exampleIndex]=true}const pct=Object.keys(state.exampleOK).length/masteryData.examples.length*100;setMastery('examples',pct)}function render(){if(locked)return;if(masteryData){renderMastery(mode==='classic'?'vocab':mode);return}const s=slides[idx];$('stage').innerHTML='<h2>'+esc(s.t)+'</h2><div class="box jpbox"><b>日语例句</b><div class="jp">'+esc(s.jp)+'</div><div class="kana">假名：'+esc(s.kana)+'</div><div class="small">Romaji: '+esc(s.romaji)+'</div></div><div class="box cnbox"><b>中文讲解</b><p>'+esc(s.cn)+'</p><p><b>提示：</b>'+esc(s.tip)+'</p></div><div class="box quiz"><b>小测验</b><p>'+esc(s.q)+'</p><div class="opts">'+s.opts.map((o,i)=>'<button onclick="answer('+i+')">'+esc(o)+'</button>').join('')+'</div><p id="fb" class="small">请选择一个答案</p></div>';update()}function speak(t,lang){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang=lang;u.rate=lang==='ja-JP'?.82:.92;speechSynthesis.speak(u)}function speakCN(){let s=slides[idx];speak(s.t+'。'+s.cn+'。'+s.tip,'zh-CN')}function speakJP(){speak(slides[idx].jp,'ja-JP')}function gain(x,reason){state.xp=(state.xp||0)+x;state.score=(state.score||0)+x;if(ids(state.done).length>=3)state.badges.first=d.title+'入门';if(ids(state.done).length>=slides.length)state.badges.finish=d.title+'完成';update();autoCloud(reason||'score')}function answer(k){let s=slides[idx];document.querySelectorAll('.opts button').forEach((b,i)=>{b.disabled=true;if(i===s.a)b.classList.add('correct');if(i===k&&k!==s.a)b.classList.add('wrong')});state.last_answer_at=new Date().toISOString();state.last_slide=idx;if(k===s.a){$('fb').innerHTML='答对了！正在自动保存到云端……';state.done[idx]=true;delete state.wrong[idx];gain(10,'quiz_correct')}else{$('fb').innerHTML='再想想：'+esc(s.tip)+' 正在自动保存错题……';state.wrong[idx]=true;update();autoCloud('quiz_wrong')}}function markDone(){state.done[idx]=true;state.last_done_at=new Date().toISOString();gain(5,'mark_done');next()}function next(){idx=Math.min(slides.length-1,idx+1);render()}function prev(){idx=Math.max(0,idx-1);render()}function go(i){idx=i;render()}function authStatus(){user=MinnaAuth.getUser();$('auth').textContent=user?('已登录：'+(user.email||user.id)):'未登录';$('cloud').textContent=user?'Supabase 已连接，学习会自动保存':'未登录；会以本地/legacy user_key 保存'}async function login(){try{await MinnaAuth.loginWithGoogle()}catch(e){alert(e.message)}}async function logout(){await MinnaAuth.logout();authStatus()}async function cloudSave(reason){if(isSaving||locked)return;try{isSaving=true;enrich();state.save_reason=reason||'manual';$('cloud').textContent='保存中...';const payload=await MinnaAuth.saveProgress(state,LESSON_ID);state.cloudSaves=(state.cloudSaves||0)+1;state.last_cloud_saved_at=payload.updated_at||new Date().toISOString();save();$('cloud').textContent='已保存 '+new Date().toLocaleTimeString()+'｜分数 '+(state.score||0)+'｜Mastery '+(state.mastery_avg||0)+'%'}catch(e){$('cloud').textContent='保存失败：'+e.message}finally{isSaving=false}}async function cloudLoad(){if(locked)return;try{$('cloud').textContent='读取中...';let r=await MinnaAuth.loadProgress(LESSON_ID);if(r&&r.progress){state=Object.assign({xp:0,score:0,done:{},wrong:{},badges:{},mastery:{vocab:0,grammar:0,examples:0,final:0}},r.progress);save();render();$('cloud').textContent='已读取 '+new Date(r.updated_at).toLocaleTimeString()+'｜分数 '+(state.score||0)}else{$('cloud').textContent='云端暂无本课记录'}}catch(e){$('cloud').textContent='读取失败：'+e.message}}async function showAllProgress(){try{let rows=await MinnaAuth.listProgress();alert(rows.map(r=>r.lesson_id+'｜分数 '+((r.progress&&r.progress.score)||0)+'｜Mastery '+((r.progress&&r.progress.mastery_avg)||0)+'%｜'+new Date(r.updated_at).toLocaleString()).join('\n')||'暂无云端记录')}catch(e){alert(e.message)}}MinnaAuth.init({lessonId:LESSON_ID}).then(async()=>{authStatus();window.addEventListener('minna-auth-changed',async()=>{authStatus();if(await checkUnlock()){locked=false;$('locked').classList.add('hidden');$('app').classList.remove('hidden');autoCloud('auth_changed')}});const ok=await checkUnlock();if(ok){render();setTimeout(()=>cloudLoad(),500)}}).catch(e=>{$('auth').textContent='Auth失败';$('cloud').textContent=e.message;render()});</script></body></html>
