<style>
:root{--bg:#f8fafc;--card:#fff;--ink:#0f172a;--line:#e2e8f0;--blue:#2563eb;--purple:#7c3aed;--green:#22c55e;--red:#fb7185}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,#dbeafe,#f8fafc 45%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Noto Sans JP",sans-serif}header{background:linear-gradient(135deg,var(--blue),var(--purple));color:white;padding:22px 18px}.wrap,main{max-width:1180px;margin:auto}main{padding:18px}.panel,.card{background:white;border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 30px rgba(15,23,42,.08);padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.map,.opts,.bank{display:flex;gap:8px;flex-wrap:wrap}.dot,button,a.btn{border:0;border-radius:14px;padding:10px 13px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-block;margin:3px}.dot{border-radius:999px}.cur{background:#2563eb;color:white}.done{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}.primary{background:#22c55e;color:#052e16}.light{background:#e2e8f0;color:#0f172a}.ghost{background:#334155;color:white}.danger{background:#fb7185;color:#450a0a}.google{background:white;color:#111827;border:1px solid #d1d5db}.jp{font-size:32px;font-weight:900;line-height:1.7}.small{color:#64748b}.box{border-radius:18px;padding:14px;margin:10px 0}.jpbox{border:2px solid #bfdbfe}.cnbox{background:#ecfdf5;border:1px solid #99f6e4;color:#14532d}.quiz{background:#fffbeb;border:1px solid #fde68a}.choice,.opts button{background:#fef3c7;color:#78350f;border-radius:999px}.correct{background:#dcfce7!important;color:#166534!important}.wrong{background:#fee2e2!important;color:#991b1b!important}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}.stats div{border-radius:14px;padding:6px}.clickable{cursor:pointer}.clickable:hover{background:#fff1f2}.stats b{font-size:24px;display:block}.bar{height:10px;background:#e2e8f0;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,#f59e0b,#22c55e);width:0}.pill{display:inline-block;background:#eef2ff;color:#3730a3;border-radius:999px;padding:3px 9px;margin:2px;font-weight:800}.meter{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.meter div{background:#f8fafc;border:1px solid #e2e8f0;border-radius:16px;padding:10px;text-align:center}.meter b{font-size:22px;display:block}.sentenceBox{min-height:58px;border:2px dashed #cbd5e1;border-radius:16px;padding:10px;margin:8px 0;background:#f8fafc}.wrongItem{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid #fecaca;background:#fff1f2;border-radius:16px;padding:10px 12px;margin:8px 0}.successBox{background:#f0fdf4;border:1px solid #86efac;color:#14532d;border-radius:18px;padding:16px;margin:10px 0}.hidden{display:none!important}.lockbox{text-align:center;padding:38px 18px}.lockicon{font-size:58px}@media(max-width:850px){.grid{grid-template-columns:1fr}.stats,.meter{grid-template-columns:1fr 1fr}.jp{font-size:25px}.wrongItem{display:block}.opts button,.choice{width:100%;text-align:left}}
</style>

<body>
<header><div class="wrap"><span class="pill" id="badge">Batch Lesson</span><h1 id="title">Loading...</h1><p id="sub"></p></div></header>
<main id="app">
<section class="grid"><div class="panel"><b>学习地图</b><div id="map" class="map"></div><p><a class="btn primary" href="./minna-index.html?v=12.4-mastery" target="_top">🏠 课程首页</a><button class="google" id="loginBtn">G Google登录</button><button class="light" id="logoutBtn">退出</button><button class="ghost" id="saveBtn">☁️ 手动保存</button><button class="ghost" id="loadBtn">⬇️ 读取</button></p><p><b>登录：</b><span id="auth">检查中</span><br><b>云端：</b><span id="cloud">初始化中</span></p></div><div class="panel"><div class="stats"><div><b id="score">0</b><span>分数</span></div><div><b id="level">1</b><span>等级</span></div><div><b id="done">0</b><span>完成</span></div><div id="wrongStat" class="clickable"><b id="wrong">0</b><span>错题</span></div></div><div class="bar"><span id="xp"></span></div><p id="badges"></p></div></section>
<section class="card"><div id="stage"></div><p id="buttons"></p></section>
<section class="grid"><div class="panel"><h3>本课重点</h3><div id="points"></div></div><div class="panel"><h3>使用说明</h3><p id="helpText">第1课已升级为外部 Mastery 内容库；其他课程暂用普通互动模式。</p></div></section>
</main>
<main id="locked" class="hidden"><section class="panel lockbox"><div class="lockicon">🔒</div><h2>这一课还没有解锁</h2><p id="lockMsg">请先完成上一课。</p><p><a class="btn primary" id="prevLessonLink" href="#" target="_top">去完成上一课</a><a class="btn ghost" href="./minna-index.html?v=12.4-mastery" target="_top">回课程首页</a></p></section></main>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const n=Number(params.get('n')||document.body.dataset.lesson||1);
const pad=x=>String(x).padStart(2,'0');
const esc=s=>String(s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const ids=o=>Object.keys(o||{}).filter(k=>o[k]);
const shuffle=a=>a.slice().sort(()=>Math.random()-.5);
if(!window.MinnaBatchLesson||!window.MinnaAuth){$('title').textContent='加载失败';$('stage').innerHTML='<div class="box quiz">公共脚本没有加载成功，请强制刷新。</div>';return;}
const d=MinnaBatchLesson.DATA[n];
if(!d){$('title').textContent='课程数据不存在';return;}
const LESSON_ID='minna_lesson_'+pad(n);
const slides=MinnaBatchLesson.buildSlides(d,n);
const masteryData=(window.MinnaMasteryLessons&&window.MinnaMasteryLessons[n])||null;
$('badge').textContent='AI互动学习App｜'+d.title;
$('title').textContent='《みんなの日本語 初級Ⅰ》'+d.title;
$('sub').textContent=(d.sub||'')+'｜'+(d.theme||'');
$('points').innerHTML=(d.points||[]).map(p=>'<span class="pill">'+esc(p)+'</span>').join('');
let key='lesson'+pad(n)+'v8',oldKey='lesson'+pad(n)+'v7';
let state=JSON.parse(localStorage.getItem(key)||localStorage.getItem(oldKey)||'{"xp":0,"score":0,"done":{},"wrong":{},"badges":{},"mastery":{"vocab":0,"grammar":0,"examples":0,"final":0}}');
state.done=state.done||{};state.wrong=state.wrong||{};state.badges=state.badges||{};state.mastery=state.mastery||{vocab:0,grammar:0,examples:0,final:0};state.vocabOK=state.vocabOK||{};state.quizOK=state.quizOK||{};state.exampleOK=state.exampleOK||{};
let idx=Number(localStorage.getItem(key+'idx')||0), mode=masteryData?'vocab':'classic', locked=false, saveTimer=null, isSaving=false, vocabIndex=0, exampleIndex=0, order=[];
function doneCountOf(p){if(!p)return 0;if(p.mastery_passed)return Number(p.total_slides)||1;if(Number.isFinite(Number(p.completed_count)))return Number(p.completed_count);return ids(p.done).length}
function totalSlidesOf(p){return Math.max(1,Number(p&&p.total_slides)||12)}
function masteredProgress(p){return !!(p&&p.mastery_passed)||doneCountOf(p)>=totalSlidesOf(p)}
async function checkUnlock(){if(n<=1)return true;try{let r=await MinnaAuth.loadProgress('minna_lesson_'+pad(n-1));let ok=!!(r&&r.progress&&masteredProgress(r.progress));if(!ok){locked=true;$('app').classList.add('hidden');$('locked').classList.remove('hidden');$('lockMsg').textContent='请先完成第'+(n-1)+'课，掌握后第'+n+'课会自动解锁。';$('prevLessonLink').href='./minna-no-nihongo-lesson-'+pad(n-1)+'.html?v=12.4';}return ok}catch(e){locked=true;$('app').classList.add('hidden');$('locked').classList.remove('hidden');$('lockMsg').textContent='无法确认上一课进度，请登录后回首页刷新。';$('prevLessonLink').href='./minna-index.html?v=12.4-mastery';return false}}
function masteryAvg(){let m=state.mastery||{};return Math.round(((m.vocab||0)+(m.grammar||0)+(m.examples||0)+(m.final||0))/4)}
function masteryPassed(){let m=state.mastery||{},rule=masteryData&&masteryData.masteryRule||{vocab:80,grammar:80,examples:80,final:80,wrong:0};return (m.vocab||0)>=rule.vocab&&(m.grammar||0)>=rule.grammar&&(m.examples||0)>=rule.examples&&(m.final||0)>=rule.final&&ids(state.wrong).length<=rule.wrong}
function checkMasteryBadge(){if(masteryData&&masteryPassed()){state.badges.mastery=d.title+' Mastery 达成';state.score=Math.max(state.score||0,400);state.xp=Math.max(state.xp||0,400)}}
function enrich(){checkMasteryBadge();state.lesson_id=LESSON_ID;state.lesson_number=n;state.lesson_title=d.title;state.mastery_mode=!!masteryData;state.mastery_avg=masteryData?masteryAvg():0;state.mastery_passed=masteryData?masteryPassed():false;state.total_slides=masteryData?1:slides.length;state.completed_count=masteryData?(state.mastery_passed?1:0):ids(state.done).length;state.wrong_count=ids(state.wrong).length;state.level=Math.floor((state.xp||0)/100)+1;state.updated_client_at=new Date().toISOString();return state}
function save(){enrich();localStorage.setItem(key,JSON.stringify(state));localStorage.setItem(key+'idx',idx)}
function autoCloud(reason){save();clearTimeout(saveTimer);saveTimer=setTimeout(()=>cloudSave(reason||'auto'),600)}
function update(){save();$('score').textContent=state.score||0;$('level').textContent=state.level||1;$('done').textContent=state.completed_count||0;$('wrong').textContent=state.wrong_count||0;$('xp').style.width=((state.xp||0)%100)+'%';$('badges').innerHTML=Object.values(state.badges).map(b=>'<span class="pill">🏅 '+esc(b)+'</span>').join('')||'<span class="pill">还没有徽章</span>';$('map').innerHTML=masteryData?['vocab','grammar','examples','final','wrong'].map(k=>'<button class="dot '+(k!=='wrong'&&(state.mastery[k]||0)>=80?'done ':'')+(mode===k?'cur ':'')+(k==='wrong'&&ids(state.wrong).length?'bad ':'')+'" data-mode="'+k+'">'+({vocab:'词汇',grammar:'语法',examples:'例句',final:'测试',wrong:'错题'}[k])+'</button>').join(''):slides.map((s,i)=>'<button class="dot '+(i===idx?'cur ':'')+(state.done[i]?'done ':'')+(state.wrong[i]?'bad ':'')+'" data-go="'+i+'">'+(i+1)+'</button>').join('');document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>renderMastery(b.dataset.mode));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{idx=Number(b.dataset.go);renderClassic()});}
function setMastery(k,p){state.mastery[k]=Math.max(state.mastery[k]||0,Math.round(p));checkMasteryBadge();update();autoCloud('mastery_'+k)}
function resetLesson(){if(!confirm('确定要重学本课吗？本课分数、Mastery、错题都会重置。'))return;state={xp:0,score:0,done:{},wrong:{},badges:{},mastery:{vocab:0,grammar:0,examples:0,final:0},vocabOK:{},quizOK:{},exampleOK:{}};idx=0;vocabIndex=0;exampleIndex=0;order=[];update();autoCloud('reset_lesson');masteryData?renderMastery('vocab'):renderClassic()}
function meter(){let m=state.mastery;return '<div class="meter"><div><b>'+Math.round(m.vocab||0)+'%</b><span>词汇</span></div><div><b>'+Math.round(m.grammar||0)+'%</b><span>语法</span></div><div><b>'+Math.round(m.examples||0)+'%</b><span>例句</span></div><div><b>'+Math.round(m.final||0)+'%</b><span>综合</span></div></div>'}
function tabs(){return '<button class="primary" data-tab="vocab">核心词汇</button><button class="ghost" data-tab="grammar">核心语法</button><button class="ghost" data-tab="examples">核心例句</button><button class="ghost" data-tab="final">综合测试</button><button class="danger" data-tab="wrong">错题复习 '+ids(state.wrong).length+'</button><button class="light" id="resetBtn">重学本课</button><button class="light" id="progressBtn">📚 全课进度</button><span class="small">Mastery '+masteryAvg()+'%</span>'}
function bindTabs(){$('buttons').innerHTML=tabs();document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>renderMastery(b.dataset.tab));$('resetBtn').onclick=resetLesson;$('progressBtn').onclick=showAllProgress}
function renderMastery(k){mode=k;bindTabs();$('helpText').textContent='第1课 Mastery 内容已从独立文件读取。词汇需100%，其他模块≥80%，且错题清零才算掌握。';if(k==='vocab')renderVocabChoice();else if(k==='grammar')renderQuiz('grammar');else if(k==='examples')renderExample();else if(k==='wrong')renderWrongReview();else renderQuiz('final');update()}
function renderVocabChoice(){let list=masteryData.vocab,item=list[vocabIndex]||list[0];let correct={idx:String(vocabIndex),jp:item[0],cn:item[1]};let wrongs=shuffle(list.map((x,i)=>({idx:String(i),jp:x[0],cn:x[1]})).filter(x=>x.idx!==correct.idx)).slice(0,3);let opts=shuffle([correct].concat(wrongs));$('stage').innerHTML='<h2>核心词汇｜选择题</h2>'+meter()+'<div class="box jpbox" style="text-align:center"><div class="small">请选择中文意思</div><div class="jp">'+esc(correct.jp)+'</div><div class="small">'+(vocabIndex+1)+'/'+list.length+'</div></div><div class="opts">'+opts.map(o=>'<button data-vocab="'+o.idx+'">'+esc(o.cn)+'</button>').join('')+'</div><p id="fb" class="small"></p>';document.querySelectorAll('[data-vocab]').forEach(btn=>btn.onclick=()=>answerVocab(btn,correct));}
function answerVocab(btn,correct){let ok=btn.dataset.vocab===correct.idx;btn.classList.add(ok?'correct':'wrong');if(ok){state.vocabOK[correct.idx]=true;delete state.wrong['vocab_'+correct.idx];$('fb').textContent='答对了！';state.score=(state.score||0)+5;state.xp=(state.xp||0)+5;setMastery('vocab',ids(state.vocabOK).length/masteryData.vocab.length*100);vocabIndex=Math.min(masteryData.vocab.length-1,vocabIndex+1);setTimeout(renderVocabChoice,500)}else{state.wrong['vocab_'+correct.idx]=true;$('fb').textContent='不对，正确答案是：'+correct.cn+'。已加入错题本。';update();autoCloud('wrong_vocab')}}
function renderQuiz(kind){state.quizOK=state.quizOK||{};let qs=masteryData[kind];$('stage').innerHTML='<h2>'+(kind==='grammar'?'核心语法理解':'综合测试')+'</h2>'+meter()+qs.map((q,qi)=>'<div class="box quiz"><b>Q'+(qi+1)+'. '+esc(q.q)+'</b><div class="opts">'+q.opts.map((o,i)=>'<button data-q="'+qi+'" data-a="'+i+'">'+esc(o)+'</button>').join('')+'</div><p id="fb_'+kind+'_'+qi+'" class="small">'+esc(q.tip||'')+'</p></div>').join('');document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>answerMastery(kind,Number(b.dataset.q),Number(b.dataset.a),b))}
function answerMastery(kind,qi,ans,btn){let q=masteryData[kind][qi],ok=ans===q.a;btn.classList.add(ok?'correct':'wrong');$('fb_'+kind+'_'+qi).textContent=ok?'答对了！错题已复习。':'不对，正确答案：'+q.opts[q.a]+'。已加入错题本。';if(ok){state.quizOK[kind+'_'+qi]=true;delete state.wrong[kind+'_'+qi];state.score=(state.score||0)+10;state.xp=(state.xp||0)+10}else{state.wrong[kind+'_'+qi]=true}setMastery(kind,Object.keys(state.quizOK).filter(x=>x.startsWith(kind+'_')).length/masteryData[kind].length*100)}
function renderExample(){state.exampleOK=state.exampleOK||{};order=[];let ex=masteryData.examples[exampleIndex];$('stage').innerHTML='<h2>核心例句｜句子排序</h2>'+meter()+'<div class="box cnbox"><b>中文：</b>'+esc(ex.cn)+'</div><div class="sentenceBox" id="orderBox"></div><div class="bank">'+shuffle(ex.parts.map((p,i)=>({p,i}))).map(x=>'<button class="choice" data-part="'+x.i+'">'+esc(x.p)+'</button>').join('')+'</div><p><button class="primary" id="checkOrder">检查排序</button><button class="light" id="nextEx">下一句</button><button class="ghost" id="speakEx">朗读完整句</button></p><p id="fb" class="small"></p>';document.querySelectorAll('[data-part]').forEach(b=>b.onclick=()=>{order.push(ex.parts[Number(b.dataset.part)]);b.disabled=true;b.classList.add('correct');$('orderBox').innerHTML=order.map(x=>'<span class="pill">'+esc(x)+'</span>').join('')});$('checkOrder').onclick=()=>{let ok=order.join('')===ex.parts.join('');$('fb').textContent=ok?'正确：'+ex.jp+'。错题已复习。':'顺序不对，正确是：'+ex.jp+'。已加入错题本。';if(ok){state.exampleOK[exampleIndex]=true;delete state.wrong['example_'+exampleIndex];state.score=(state.score||0)+15;state.xp=(state.xp||0)+15}else{state.wrong['example_'+exampleIndex]=true}setMastery('examples',Object.keys(state.exampleOK).length/masteryData.examples.length*100)};$('nextEx').onclick=()=>{exampleIndex=(exampleIndex+1)%masteryData.examples.length;renderExample()};$('speakEx').onclick=()=>speak(ex.jp,'ja-JP')}
function wrongLabel(k){if(k.startsWith('vocab_')){let i=Number(k.split('_')[1]);return '词汇：'+((masteryData.vocab[i]||[])[0]||'词汇')}if(k.startsWith('grammar_'))return '核心语法 Q'+(Number(k.split('_')[1])+1);if(k.startsWith('final_'))return '综合测试 Q'+(Number(k.split('_')[1])+1);if(k.startsWith('example_'))return '核心例句：'+((masteryData.examples[Number(k.split('_')[1])]||{}).cn||'例句排序');return '普通练习：第'+(Number(k)+1)+'题'}
function reviewWrong(k){if(k.startsWith('vocab_')){vocabIndex=Number(k.split('_')[1])||0;renderMastery('vocab')}else if(k.startsWith('grammar_'))renderMastery('grammar');else if(k.startsWith('final_'))renderMastery('final');else if(k.startsWith('example_')){exampleIndex=Number(k.split('_')[1])||0;renderMastery('examples')}else{idx=Number(k)||0;renderClassic()}}
function renderWrongReview(){mode='wrong';bindTabs();let wrongs=ids(state.wrong);if(!wrongs.length){let extra=masteryPassed()?'<div class="successBox"><b>🎉 第'+n+'课已真正掌握！</b><p>你可以回课程首页刷新进度，解锁下一课。</p><a class="btn primary" href="./minna-index.html?v=12.4-mastery" target="_top">回首页解锁下一课</a></div>':'';$('stage').innerHTML='<h2>错题复习</h2><div class="box cnbox"><b>太好了！</b><p>当前没有错题。</p></div>'+meter()+extra;update();autoCloud('wrong_zero');return}$('stage').innerHTML='<h2>错题复习</h2>'+meter()+'<p class="small">当前有 '+wrongs.length+' 个错题。答对后会自动清除。</p>'+wrongs.map(k=>'<div class="wrongItem"><div><b>错题</b><br>'+esc(wrongLabel(k))+'</div><button class="primary" data-review="'+esc(k)+'">去复习</button></div>').join('')+'<p><button class="danger" id="clearWrong">我已全部重新掌握，清空错题</button></p>';document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>reviewWrong(b.dataset.review));$('clearWrong').onclick=()=>{state.wrong={};checkMasteryBadge();update();autoCloud('clear_wrong');renderWrongReview()}}
function renderClassic(){let s=slides[idx];$('buttons').innerHTML='<button class="primary" id="cnBtn">🔊 中文讲解</button><button class="ghost" id="jpBtn">🇯🇵 日语朗读</button><button class="light" id="prevBtn">上一页</button><button class="light" id="nextBtn">下一页</button><button class="primary" id="doneBtn">✅ 学会了</button><button class="danger" id="wrongBtn">错题复习 '+ids(state.wrong).length+'</button><button class="light" id="resetBtn">重学本课</button><button class="ghost" id="allBtn">📚 全课进度</button><span class="small">'+(idx+1)+'/'+slides.length+'</span>';$('stage').innerHTML='<h2>'+esc(s.t)+'</h2><div class="box jpbox"><b>日语例句</b><div class="jp">'+esc(s.jp)+'</div><div class="small">'+esc(s.kana||'')+'</div></div><div class="box cnbox"><b>中文讲解</b><p>'+esc(s.cn)+'</p><p><b>提示：</b>'+esc(s.tip)+'</p></div><div class="box quiz"><b>小测验</b><p>'+esc(s.q)+'</p><div class="opts">'+s.opts.map((o,i)=>'<button data-ans="'+i+'">'+esc(o)+'</button>').join('')+'</div><p id="fb" class="small">请选择一个答案</p></div>';document.querySelectorAll('[data-ans]').forEach(b=>b.onclick=()=>answerClassic(Number(b.dataset.ans),b));$('cnBtn').onclick=()=>speak(s.t+'。'+s.cn+'。'+s.tip,'zh-CN');$('jpBtn').onclick=()=>speak(s.jp,'ja-JP');$('prevBtn').onclick=()=>{idx=Math.max(0,idx-1);renderClassic()};$('nextBtn').onclick=()=>{idx=Math.min(slides.length-1,idx+1);renderClassic()};$('doneBtn').onclick=()=>{state.done[idx]=true;state.score=(state.score||0)+5;state.xp=(state.xp||0)+5;idx=Math.min(slides.length-1,idx+1);update();autoCloud('mark_done');renderClassic()};$('wrongBtn').onclick=renderWrongReview;$('resetBtn').onclick=resetLesson;$('allBtn').onclick=showAllProgress;update()}
function answerClassic(k,btn){let s=slides[idx],ok=k===s.a;btn.classList.add(ok?'correct':'wrong');if(ok){$('fb').textContent='答对了！错题已复习。';state.done[idx]=true;delete state.wrong[String(idx)];state.score=(state.score||0)+10;state.xp=(state.xp||0)+10}else{$('fb').textContent='再想想：'+s.tip+'。已加入错题本。';state.wrong[String(idx)]=true}update();autoCloud(ok?'quiz_correct':'quiz_wrong')}
function speak(t,lang){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang=lang;u.rate=lang==='ja-JP'?.82:.92;speechSynthesis.speak(u)}
function authStatus(){let u=MinnaAuth.getUser();$('auth').textContent=u?('已登录：'+(u.email||u.id)):'未登录';$('cloud').textContent=u?'Supabase 已连接，学习会自动保存':'未登录；会以本地/legacy user_key 保存'}
async function cloudSave(reason){if(isSaving||locked)return;try{isSaving=true;enrich();state.save_reason=reason||'manual';$('cloud').textContent='保存中...';let payload=await MinnaAuth.saveProgress(state,LESSON_ID);state.last_cloud_saved_at=payload.updated_at||new Date().toISOString();save();$('cloud').textContent='已保存 '+new Date().toLocaleTimeString()+'｜分数 '+(state.score||0)+'｜Mastery '+(state.mastery_avg||0)+'%｜错题 '+ids(state.wrong).length}catch(e){$('cloud').textContent='保存失败：'+e.message}finally{isSaving=false}}
async function cloudLoad(){if(locked)return;try{$('cloud').textContent='读取中...';let r=await MinnaAuth.loadProgress(LESSON_ID);if(r&&r.progress){state=Object.assign(state,r.progress);state.done=state.done||{};state.wrong=state.wrong||{};state.badges=state.badges||{};state.mastery=state.mastery||{vocab:0,grammar:0,examples:0,final:0};state.vocabOK=state.vocabOK||{};state.quizOK=state.quizOK||{};state.exampleOK=state.exampleOK||{};save();masteryData?renderMastery(mode):renderClassic();$('cloud').textContent='已读取 '+new Date(r.updated_at).toLocaleTimeString()}else{$('cloud').textContent='云端暂无本课记录'}}catch(e){$('cloud').textContent='读取失败：'+e.message}}
async function showAllProgress(){try{let rows=await MinnaAuth.listProgress();alert(rows.map(r=>r.lesson_id+'｜分数 '+((r.progress&&r.progress.score)||0)+'｜Mastery '+((r.progress&&r.progress.mastery_avg)||0)+'%｜错题 '+((r.progress&&r.progress.wrong_count)||0)+'｜'+new Date(r.updated_at).toLocaleString()).join('\n')||'暂无云端记录')}catch(e){alert(e.message)}}
$('loginBtn').onclick=()=>MinnaAuth.loginWithGoogle().catch(e=>alert(e.message));$('logoutBtn').onclick=()=>MinnaAuth.logout().then(authStatus);$('saveBtn').onclick=()=>cloudSave('manual');$('loadBtn').onclick=cloudLoad;$('wrongStat').onclick=()=>masteryData?renderMastery('wrong'):renderWrongReview();
MinnaAuth.init({lessonId:LESSON_ID}).then(async()=>{authStatus();let ok=await checkUnlock();if(ok){masteryData?renderMastery('vocab'):renderClassic();setTimeout(cloudLoad,500)}window.addEventListener('minna-auth-changed',async()=>{authStatus();if(await checkUnlock()){locked=false;$('locked').classList.add('hidden');$('app').classList.remove('hidden');masteryData?renderMastery(mode):renderClassic()}})}).catch(e=>{$('auth').textContent='Auth失败';$('cloud').textContent=e.message;masteryData?renderMastery('vocab'):renderClassic()});
})();
</script>
