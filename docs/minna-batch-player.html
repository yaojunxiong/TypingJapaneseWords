<style>
:root{--bg:#f8fafc;--card:#fff;--ink:#0f172a;--line:#e2e8f0;--blue:#2563eb;--purple:#7c3aed;--green:#22c55e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,#dbeafe,var(--bg) 45%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Noto Sans JP",sans-serif}header{background:linear-gradient(135deg,var(--blue),var(--purple));color:white;padding:22px 18px}.wrap,main{max-width:1180px;margin:auto}main{padding:18px}.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 30px rgba(15,23,42,.08);padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.map{display:flex;gap:7px;flex-wrap:wrap}.dot{border:0;border-radius:999px;padding:8px 11px;font-weight:900}.cur{background:#2563eb;color:white}.done{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}button,a.btn{border:0;border-radius:14px;padding:10px 13px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-block;margin:3px}.primary{background:#22c55e;color:#052e16}.light{background:#e2e8f0;color:#0f172a}.ghost{background:#334155;color:white}.google{background:white;color:#111827;border:1px solid #d1d5db}.jp{font-size:30px;font-weight:900;line-height:1.7}.kana{color:#2563eb;font-weight:800}.small{color:#64748b}.box{border-radius:18px;padding:14px;margin:10px 0}.jpbox{border:2px solid #bfdbfe}.cnbox{background:#ecfdf5;border:1px solid #99f6e4;color:#14532d}.quiz{background:#fffbeb;border:1px solid #fde68a}.choice,.opts button{background:#fef3c7;color:#78350f;border-radius:999px}.correct{background:#dcfce7!important;color:#166534!important}.wrong{background:#fee2e2!important;color:#991b1b!important}.selected{outline:4px solid #93c5fd}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}.stats b{font-size:24px;display:block}.bar{height:10px;background:#e2e8f0;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,#f59e0b,#22c55e);width:0}.pill{display:inline-block;background:#eef2ff;color:#3730a3;border-radius:999px;padding:3px 9px;margin:2px;font-weight:800}.hidden{display:none!important}.lockbox{text-align:center;padding:38px 18px}.lockicon{font-size:58px}.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}.match button{width:100%;min-height:46px}.meter{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.meter div{background:#f8fafc;border:1px solid #e2e8f0;border-radius:16px;padding:10px;text-align:center}.meter b{font-size:22px;display:block}.sentenceBank{display:flex;gap:8px;flex-wrap:wrap}.sentenceBox{min-height:54px;border:2px dashed #cbd5e1;border-radius:16px;padding:10px;margin:8px 0;background:#f8fafc}@media(max-width:850px){.grid,.match{grid-template-columns:1fr}.stats,.meter{grid-template-columns:1fr 1fr}.jp{font-size:24px}}

<body>
<header><div class="wrap"><span class="pill" id="badge">Batch Lesson</span><h1 id="title">Loading...</h1><p id="sub"></p></div></header>
<main id="app">
<section class="grid"><div class="panel"><b>学习地图</b><div id="map" class="map"></div><p><a class="btn primary" href="./minna-index.html?v=12.3-path" target="_top">🏠 课程首页</a><button class="google" id="loginBtn">G Google登录</button><button class="light" id="logoutBtn">退出</button><button class="ghost" id="saveBtn">☁️ 手动保存</button><button class="ghost" id="loadBtn">⬇️ 读取</button></p><p><b>登录：</b><span id="auth">检查中</span><br><b>云端：</b><span id="cloud">初始化中</span></p></div><div class="panel"><div class="stats"><div><b id="score">0</b><span>分数</span></div><div><b id="level">1</b><span>等级</span></div><div><b id="done">0</b><span>完成</span></div><div><b id="wrong">0</b><span>错题</span></div></div><div class="bar"><span id="xp"></span></div><p id="badges"></p></div></section>
<section class="card"><div id="stage"></div><p id="buttons"></p></section>
<section class="grid"><div class="panel"><h3>本课重点</h3><div id="points"></div></div><div class="panel"><h3>使用说明</h3><p id="helpText">课程采用顺序解锁。第1课正在试用 Mastery 模式。</p></div></section>
</main>
<main id="locked" class="hidden"><section class="panel lockbox"><div class="lockicon">🔒</div><h2>这一课还没有解锁</h2><p id="lockMsg">请先完成上一课。</p><p><a class="btn primary" id="prevLessonLink" href="#" target="_top">去完成上一课</a><a class="btn ghost" href="./minna-index.html?v=12.3-path" target="_top">回课程首页</a></p></section></main>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const n=Number(params.get('n')||document.body.dataset.lesson||1);
function pad(x){return String(x).padStart(2,'0')}
function esc(s){return String(s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function ids(o){return Object.keys(o||{}).filter(k=>o[k])}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
if(!window.MinnaBatchLesson||!window.MinnaAuth){$('title').textContent='加载失败';$('stage').innerHTML='<div class="box quiz">公共脚本没有加载成功，请强制刷新。</div>';return;}
const d=MinnaBatchLesson.DATA[n];
if(!d){$('title').textContent='课程数据不存在';$('stage').innerHTML='<div class="box quiz">找不到第'+n+'课数据。</div>';return;}
const LESSON_ID='minna_lesson_'+pad(n);
const slides=MinnaBatchLesson.buildSlides(d,n);
$('badge').textContent='AI互动学习App｜'+d.title;
$('title').textContent='《みんなの日本語 初級Ⅰ》'+d.title;
$('sub').textContent=(d.sub||'')+'｜'+(d.theme||'');
$('points').innerHTML=(d.points||[]).map(p=>'<span class="pill">'+esc(p)+'</span>').join('');
const masteryData=n===1?{
 vocab:[['わたし','我'],['あなた','你'],['あの人','那个人'],['先生','老师'],['教師','教师'],['学生','学生'],['会社員','公司职员'],['銀行員','银行职员'],['医者','医生'],['研究者','研究员'],['大学','大学'],['病院','医院'],['アメリカ','美国'],['から','从/来自'],['来ました','来了'],['初めまして','初次见面'],['どうぞよろしく','请多关照']],
 grammar:[{q:'「N1 は N2 です」表示什么？',opts:['N1是N2','N1不是N2','N1去N2'],a:0},{q:'「は」作助词时读作？',opts:['wa','ha','ga'],a:0},{q:'「学生じゃありません」是什么意思？',opts:['不是学生','是学生','学生吗'],a:0},{q:'疑问句句尾通常加什么？',opts:['か','を','で'],a:0},{q:'「も」在第1课里表示什么？',opts:['也','从','和'],a:0},{q:'「アメリカから来ました」里的「から」表示什么？',opts:['从/来自','也','不是'],a:0}],
 examples:[
  {jp:'わたしは マイク・ミラーです。',cn:'我是迈克・米勒。',parts:['わたしは','マイク・ミラー','です。']},
  {jp:'サントスさんは 学生じゃありません。',cn:'桑托斯先生不是学生。',parts:['サントスさんは','学生じゃ','ありません。']},
  {jp:'ミラーさんは 会社員ですか。',cn:'米勒先生是公司职员吗？',parts:['ミラーさんは','会社員','ですか。']},
  {jp:'グプタさんも 会社員です。',cn:'古普塔先生也是公司职员。',parts:['グプタさんも','会社員','です。']},
  {jp:'アメリカから来ました。',cn:'我来自美国。',parts:['アメリカから','来ました。']},
  {jp:'初めまして。わたしは マイク・ミラーです。アメリカから来ました。どうぞよろしく。',cn:'初次见面。我是迈克・米勒。我来自美国。请多关照。',parts:['初めまして。','わたしは','マイク・ミラーです。','アメリカから','来ました。','どうぞよろしく。']}
 ],
 final:[{q:'「いいえ、違います」是什么意思？',opts:['不，不是','是，是的','请多关照'],a:0},{q:'不能用于自己的称呼是？',opts:['さん','わたし','教師'],a:0},{q:'「初めまして」用于什么场合？',opts:['初次见面','买东西','问时间'],a:0},{q:'「どうぞよろしく」是什么意思？',opts:['请多关照','几点了','多少钱'],a:0},{q:'「アメリカから来ました」是什么意思？',opts:['我来自美国','我要去美国','美国人吗'],a:0},{q:'完整自我介绍的正确顺序是？',opts:['初めまして→名前→出身→どうぞよろしく','どうぞよろしく→名前→初めまして','出身→どうぞよろしく→初めまして'],a:0},{q:'正确句子是哪一个？',opts:['わたしも学生です。','わたしはも学生です。','わたしを学生です。'],a:0}]
}:null;
let key='lesson'+pad(n)+'v5',oldKey='lesson'+pad(n)+'v4';
let state=JSON.parse(localStorage.getItem(key)||localStorage.getItem(oldKey)||'{"xp":0,"score":0,"done":{},"wrong":{},"badges":{},"mastery":{"vocab":0,"grammar":0,"examples":0,"final":0}}');
state.done=state.done||{};state.wrong=state.wrong||{};state.badges=state.badges||{};state.mastery=state.mastery||{vocab:0,grammar:0,examples:0,final:0};
let idx=Number(localStorage.getItem(key+'idx')||0), mode=masteryData?'vocab':'classic', locked=false, saveTimer=null, isSaving=false, matchL=null, matchR=null, exampleIndex=0, order=[];
function doneCountOf(p){if(!p)return 0;if(p.mastery_passed)return Number(p.total_slides)||1;if(Number.isFinite(Number(p.completed_count)))return Number(p.completed_count);return ids(p.done).length}
function totalSlidesOf(p){return Math.max(1,Number(p&&p.total_slides)||12)}
function masteredProgress(p){return !!(p&&p.mastery_passed)||doneCountOf(p)>=totalSlidesOf(p)}
async function checkUnlock(){if(n<=1)return true;try{let r=await MinnaAuth.loadProgress('minna_lesson_'+pad(n-1));let ok=!!(r&&r.progress&&masteredProgress(r.progress));if(!ok){locked=true;$('app').classList.add('hidden');$('locked').classList.remove('hidden');$('lockMsg').textContent='请先完成第'+(n-1)+'课，掌握后第'+n+'课会自动解锁。';$('prevLessonLink').href='./minna-no-nihongo-lesson-'+pad(n-1)+'.html?v=12.4';}return ok}catch(e){locked=true;$('app').classList.add('hidden');$('locked').classList.remove('hidden');$('lockMsg').textContent='无法确认上一课进度，请登录后回首页刷新。';$('prevLessonLink').href='./minna-index.html?v=12.3-path';return false}}
function masteryAvg(){let m=state.mastery||{};return Math.round(((m.vocab||0)+(m.grammar||0)+(m.examples||0)+(m.final||0))/4)}
function masteryPassed(){let m=state.mastery||{};return (m.vocab||0)>=80&&(m.grammar||0)>=80&&(m.examples||0)>=80&&(m.final||0)>=80}
function enrich(){state.lesson_id=LESSON_ID;state.lesson_number=n;state.lesson_title=d.title;state.mastery_mode=!!masteryData;state.mastery_avg=masteryData?masteryAvg():0;state.mastery_passed=masteryData?masteryPassed():false;state.total_slides=masteryData?1:slides.length;state.completed_count=masteryData?(state.mastery_passed?1:0):ids(state.done).length;state.wrong_count=ids(state.wrong).length;state.level=Math.floor((state.xp||0)/100)+1;state.updated_client_at=new Date().toISOString();return state}
function save(){enrich();localStorage.setItem(key,JSON.stringify(state));localStorage.setItem(key+'idx',idx)}
function update(){save();$('score').textContent=state.score||0;$('level').textContent=state.level||1;$('done').textContent=state.completed_count||0;$('wrong').textContent=state.wrong_count||0;$('xp').style.width=((state.xp||0)%100)+'%';$('badges').innerHTML=Object.values(state.badges).map(b=>'<span class="pill">🏅 '+esc(b)+'</span>').join('')||'<span class="pill">还没有徽章</span>';$('map').innerHTML=masteryData?['vocab','grammar','examples','final'].map(k=>'<button class="dot '+((state.mastery[k]||0)>=80?'done ':'')+(mode===k?'cur ':'')+'" data-mode="'+k+'">'+({vocab:'词汇',grammar:'语法',examples:'例句',final:'测试'}[k])+'</button>').join(''):slides.map((s,i)=>'<button class="dot '+(i===idx?'cur ':'')+(state.done[i]?'done ':'')+(state.wrong[i]?'bad ':'')+'" data-go="'+i+'">'+(i+1)+'</button>').join('');document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>renderMastery(b.dataset.mode));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{idx=Number(b.dataset.go);renderClassic()});}
function autoCloud(reason){save();clearTimeout(saveTimer);saveTimer=setTimeout(()=>cloudSave(reason||'auto'),600)}
function setMastery(k,p){state.mastery[k]=Math.max(state.mastery[k]||0,Math.round(p));if(masteryPassed()){state.badges.mastery=d.title+' Mastery 达成';state.score=Math.max(state.score||0,400);state.xp=Math.max(state.xp||0,400)}update();autoCloud('mastery_'+k)}
function meter(){let m=state.mastery;return '<div class="meter"><div><b>'+Math.round(m.vocab||0)+'%</b><span>词汇</span></div><div><b>'+Math.round(m.grammar||0)+'%</b><span>语法</span></div><div><b>'+Math.round(m.examples||0)+'%</b><span>例句</span></div><div><b>'+Math.round(m.final||0)+'%</b><span>综合</span></div></div>'}
function tabs(){return '<button class="primary" data-tab="vocab">核心词汇</button><button class="ghost" data-tab="grammar">核心语法</button><button class="ghost" data-tab="examples">核心例句</button><button class="ghost" data-tab="final">综合测试</button><button class="light" id="progressBtn">📚 全课进度</button><span class="small">Mastery '+masteryAvg()+'%</span>'}
function bindTabs(){$('buttons').innerHTML=tabs();document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>renderMastery(b.dataset.tab));$('progressBtn').onclick=showAllProgress}
function renderMastery(k){mode=k;bindTabs();$('helpText').textContent='第1课 Mastery：词汇、语法、例句、综合测试都达到80%才算掌握。完整自我介绍会话也属于核心内容。';if(k==='vocab')renderVocab();else if(k==='grammar')renderQuiz('grammar');else if(k==='examples')renderExample();else renderQuiz('final');update()}
function renderVocab(){matchL=null;matchR=null;state.matchOK=state.matchOK||{};let left=masteryData.vocab.map((x,i)=>({i,txt:x[0]}));let right=shuffle(masteryData.vocab.map((x,i)=>({i,txt:x[1]})));$('stage').innerHTML='<h2>核心词汇｜连连看</h2>'+meter()+'<p class="small">点击左边日语，再点击右边中文。</p><div class="match"><div>'+left.map(x=>'<button class="choice" data-l="'+x.i+'">'+esc(x.txt)+'</button>').join('')+'</div><div>'+right.map(x=>'<button class="choice" data-r="'+x.i+'">'+esc(x.txt)+'</button>').join('')+'</div></div><p id="fb" class="small"></p>';document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>pickMatch('l',Number(b.dataset.l),b));document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>pickMatch('r',Number(b.dataset.r),b))}
function pickMatch(side,i,btn){document.querySelectorAll('.choice').forEach(b=>b.classList.remove('selected'));if(side==='l'){matchL={i,btn}}else{matchR={i,btn}};if(matchL)matchL.btn.classList.add('selected');if(matchR)matchR.btn.classList.add('selected');if(matchL&&matchR){if(matchL.i===matchR.i){matchL.btn.classList.add('correct');matchR.btn.classList.add('correct');matchL.btn.disabled=true;matchR.btn.disabled=true;state.matchOK[matchL.i]=true;$('fb').textContent='配对正确！';setMastery('vocab',Object.keys(state.matchOK).length/masteryData.vocab.length*100)}else{matchL.btn.classList.add('wrong');matchR.btn.classList.add('wrong');$('fb').textContent='不对，再试一次。';state.wrong['vocab_'+Date.now()]=true;update()}matchL=null;matchR=null}}
function renderQuiz(kind){state.quizOK=state.quizOK||{};let qs=masteryData[kind];$('stage').innerHTML='<h2>'+(kind==='grammar'?'核心语法理解':'综合测试')+'</h2>'+meter()+qs.map((q,qi)=>'<div class="box quiz"><b>Q'+(qi+1)+'. '+esc(q.q)+'</b><div class="opts">'+q.opts.map((o,i)=>'<button data-q="'+qi+'" data-a="'+i+'">'+esc(o)+'</button>').join('')+'</div><p id="fb_'+kind+'_'+qi+'" class="small"></p></div>').join('');document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>answerMastery(kind,Number(b.dataset.q),Number(b.dataset.a),b))}
function answerMastery(kind,qi,ans,btn){let q=masteryData[kind][qi],ok=ans===q.a;btn.classList.add(ok?'correct':'wrong');$('fb_'+kind+'_'+qi).textContent=ok?'答对了！':'不对，正确答案：'+q.opts[q.a];if(ok){state.quizOK[kind+'_'+qi]=true;state.score=(state.score||0)+10;state.xp=(state.xp||0)+10}else{state.wrong[kind+'_'+qi]=true}setMastery(kind,Object.keys(state.quizOK).filter(x=>x.startsWith(kind+'_')).length/masteryData[kind].length*100)}
function renderExample(){state.exampleOK=state.exampleOK||{};order=[];let ex=masteryData.examples[exampleIndex];$('stage').innerHTML='<h2>核心例句｜句子排序</h2>'+meter()+'<div class="box cnbox"><b>中文：</b>'+esc(ex.cn)+'</div><div class="box jpbox"><b>目标：</b><span class="small">请把下面片段排成完整日语句子</span></div><div class="sentenceBox" id="orderBox"></div><div class="sentenceBank">'+shuffle(ex.parts.map((p,i)=>({p,i}))).map(x=>'<button class="choice" data-part="'+x.i+'">'+esc(x.p)+'</button>').join('')+'</div><p><button class="primary" id="checkOrder">检查排序</button><button class="light" id="nextEx">下一句</button><button class="ghost" id="speakEx">朗读完整句</button></p><p id="fb" class="small"></p>';document.querySelectorAll('[data-part]').forEach(b=>b.onclick=()=>{order.push(ex.parts[Number(b.dataset.part)]);b.disabled=true;b.classList.add('selected');$('orderBox').innerHTML=order.map(x=>'<span class="pill">'+esc(x)+'</span>').join('')});$('checkOrder').onclick=()=>{let ok=order.join('')===ex.parts.join('');$('fb').textContent=ok?'正确：'+ex.jp:'顺序不对，正确是：'+ex.jp;if(ok){state.exampleOK[exampleIndex]=true;state.score=(state.score||0)+15;state.xp=(state.xp||0)+15}else{state.wrong['example_'+exampleIndex]=true}setMastery('examples',Object.keys(state.exampleOK).length/masteryData.examples.length*100)};$('nextEx').onclick=()=>{exampleIndex=(exampleIndex+1)%masteryData.examples.length;renderExample()};$('speakEx').onclick=()=>speak(ex.jp,'ja-JP')}
function renderClassic(){let s=slides[idx];$('buttons').innerHTML='<button class="primary" id="cnBtn">🔊 中文讲解</button><button class="ghost" id="jpBtn">🇯🇵 日语朗读</button><button class="light" id="prevBtn">上一页</button><button class="light" id="nextBtn">下一页</button><button class="primary" id="doneBtn">✅ 学会了</button><button class="ghost" id="allBtn">📚 全课进度</button><span class="small">'+(idx+1)+'/'+slides.length+'</span>';$('stage').innerHTML='<h2>'+esc(s.t)+'</h2><div class="box jpbox"><b>日语例句</b><div class="jp">'+esc(s.jp)+'</div><div class="kana">假名：'+esc(s.kana)+'</div><div class="small">Romaji: '+esc(s.romaji)+'</div></div><div class="box cnbox"><b>中文讲解</b><p>'+esc(s.cn)+'</p><p><b>提示：</b>'+esc(s.tip)+'</p></div><div class="box quiz"><b>小测验</b><p>'+esc(s.q)+'</p><div class="opts">'+s.opts.map((o,i)=>'<button data-ans="'+i+'">'+esc(o)+'</button>').join('')+'</div><p id="fb" class="small">请选择一个答案</p></div>';document.querySelectorAll('[data-ans]').forEach(b=>b.onclick=()=>answerClassic(Number(b.dataset.ans),b));$('cnBtn').onclick=()=>speak(s.t+'。'+s.cn+'。'+s.tip,'zh-CN');$('jpBtn').onclick=()=>speak(s.jp,'ja-JP');$('prevBtn').onclick=()=>{idx=Math.max(0,idx-1);renderClassic()};$('nextBtn').onclick=()=>{idx=Math.min(slides.length-1,idx+1);renderClassic()};$('doneBtn').onclick=()=>{state.done[idx]=true;state.score=(state.score||0)+5;state.xp=(state.xp||0)+5;idx=Math.min(slides.length-1,idx+1);update();autoCloud('mark_done');renderClassic()};$('allBtn').onclick=showAllProgress;update()}
function answerClassic(k,btn){let s=slides[idx],ok=k===s.a;btn.classList.add(ok?'correct':'wrong');if(ok){$('fb').textContent='答对了！';state.done[idx]=true;state.score=(state.score||0)+10;state.xp=(state.xp||0)+10}else{$('fb').textContent='再想想：'+s.tip;state.wrong[idx]=true}update();autoCloud(ok?'quiz_correct':'quiz_wrong')}
function speak(t,lang){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang=lang;u.rate=lang==='ja-JP'?.82:.92;speechSynthesis.speak(u)}
function authStatus(){let u=MinnaAuth.getUser();$('auth').textContent=u?('已登录：'+(u.email||u.id)):'未登录';$('cloud').textContent=u?'Supabase 已连接，学习会自动保存':'未登录；会以本地/legacy user_key 保存'}
async function cloudSave(reason){if(isSaving||locked)return;try{isSaving=true;enrich();state.save_reason=reason||'manual';$('cloud').textContent='保存中...';let payload=await MinnaAuth.saveProgress(state,LESSON_ID);state.last_cloud_saved_at=payload.updated_at||new Date().toISOString();save();$('cloud').textContent='已保存 '+new Date().toLocaleTimeString()+'｜分数 '+(state.score||0)+'｜Mastery '+(state.mastery_avg||0)+'%'}catch(e){$('cloud').textContent='保存失败：'+e.message}finally{isSaving=false}}
async function cloudLoad(){if(locked)return;try{$('cloud').textContent='读取中...';let r=await MinnaAuth.loadProgress(LESSON_ID);if(r&&r.progress){state=Object.assign(state,r.progress);state.done=state.done||{};state.wrong=state.wrong||{};state.badges=state.badges||{};state.mastery=state.mastery||{vocab:0,grammar:0,examples:0,final:0};save();masteryData?renderMastery(mode):renderClassic();$('cloud').textContent='已读取 '+new Date(r.updated_at).toLocaleTimeString()}else{$('cloud').textContent='云端暂无本课记录'}}catch(e){$('cloud').textContent='读取失败：'+e.message}}
async function showAllProgress(){try{let rows=await MinnaAuth.listProgress();alert(rows.map(r=>r.lesson_id+'｜分数 '+((r.progress&&r.progress.score)||0)+'｜Mastery '+((r.progress&&r.progress.mastery_avg)||0)+'%｜'+new Date(r.updated_at).toLocaleString()).join('\n')||'暂无云端记录')}catch(e){alert(e.message)}}
$('loginBtn').onclick=()=>MinnaAuth.loginWithGoogle().catch(e=>alert(e.message));$('logoutBtn').onclick=()=>MinnaAuth.logout().then(authStatus);$('saveBtn').onclick=()=>cloudSave('manual');$('loadBtn').onclick=cloudLoad;
MinnaAuth.init({lessonId:LESSON_ID}).then(async()=>{authStatus();let ok=await checkUnlock();if(ok){masteryData?renderMastery('vocab'):renderClassic();setTimeout(cloudLoad,500)}window.addEventListener('minna-auth-changed',async()=>{authStatus();if(await checkUnlock()){locked=false;$('locked').classList.add('hidden');$('app').classList.remove('hidden');masteryData?renderMastery(mode):renderClassic()}})}).catch(e=>{$('auth').textContent='Auth失败';$('cloud').textContent=e.message;masteryData?renderMastery('vocab'):renderClassic()});
})();
</script>
</body>
</html>
