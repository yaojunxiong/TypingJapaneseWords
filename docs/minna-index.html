<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>《みんなの日本語 初級》AI学习系统｜全课程入口</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./minna-auth.js"></script>
<style>
:root{--bg:#f8fafc;--card:#fff;--ink:#0f172a;--line:#e2e8f0;--muted:#64748b;--blue:#2563eb;--purple:#7c3aed;--green:#16a34a;--amber:#f59e0b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,#dbeafe,var(--bg) 45%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Noto Sans JP","Microsoft YaHei",sans-serif}header{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;padding:28px 18px}.wrap,main{max-width:1180px;margin:auto}h1{margin:0;font-size:30px}.badge{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:5px 12px;font-weight:900;margin-bottom:10px}main{padding:18px}.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 30px rgba(15,23,42,.08);padding:16px}.top{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button,a.btn{border:0;border-radius:14px;padding:10px 14px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:#22c55e;color:#052e16}.google{background:#fff;color:#1f2937;border:1px solid #d1d5db}.ghost{background:#334155;color:white}.light{background:#e2e8f0;color:#0f172a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:16px}.lesson{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;position:relative;overflow:hidden}.lesson.current{border-color:#2563eb;background:#eff6ff}.lesson.locked{opacity:.86}.lesson h3{margin:0 0 8px}.pill{display:inline-block;background:#eef2ff;color:#3730a3;border-radius:999px;padding:3px 9px;margin:2px;font-weight:800}.ok{background:#dcfce7;color:#166534}.wait{background:#fef3c7;color:#92400e}.bar{height:10px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:10px 0}.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,#f59e0b,#22c55e)}.small{color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}.stats b{font-size:26px;display:block}.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.modalInner{max-width:820px;width:100%;max-height:84vh;overflow:auto;background:#fff;border-radius:24px;padding:20px}.footer{text-align:center;color:var(--muted);font-size:13px;padding:22px}@media(max-width:850px){.top{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr 1fr}}
</style>
</head>
<body data-lesson-id="minna_home">
<header><div class="wrap"><span class="badge">Minna AI Learning System 11.2</span><h1>《みんなの日本語 初級》AI互动学习系统</h1><p>一个 Google 账号，统一管理所有课程进度、打卡、错题和学习报告。</p></div></header>
<main>
<section class="top"><div class="panel"><h2>账号中心</h2><p><b>登录状态：</b><span id="authStatus">检查中</span></p><p><b>云端：</b><span id="cloudStatus">初始化中</span></p><div class="btns"><button class="google" onclick="login()">G 用 Google 登录</button><button class="light" onclick="logout()">退出</button><button class="primary" onclick="loadAll()">📚 刷新全课程进度</button><a class="btn ghost" href="./minna-no-nihongo-lesson-01-grammar-summary.html">进入第1课</a></div></div><div class="panel"><h2>总览</h2><div class="stats"><div><b id="totalLessons">0</b><span>云端课程</span></div><div><b id="totalScore">0</b><span>总分</span></div><div><b id="totalDone">0</b><span>完成关卡</span></div></div></div></section>
<section class="grid" id="lessonGrid"></section>
<div class="panel" style="margin-top:16px"><h2>后续开发路线</h2><p><span class="pill ok">已完成：第1课</span><span class="pill wait">下一步：第2课</span><span class="pill wait">第3课</span><span class="pill wait">课程地图</span><span class="pill wait">家长后台</span></p><p class="small">每个课程页面只需要引用 <code>minna-auth.js</code> 并设置自己的 <code>data-lesson-id</code>，就能自动共用 Google 登录和 Supabase 进度。</p></div>
</main>
<div class="footer">Minna AI Learning System</div>
<div class="modal" id="modal"><div class="modalInner"><h2 id="mt">窗口</h2><div id="mb"></div><p><button class="light" onclick="closeModal()">关闭</button></p></div></div>
<script>
const lessons=[
{id:'minna_lesson_01',title:'第1课',sub:'名词句・自我介绍',url:'./minna-no-nihongo-lesson-01-grammar-summary.html',status:'已上线'},
{id:'minna_lesson_02',title:'第2课',sub:'これ・それ・あれ',url:'#',status:'待生成'},
{id:'minna_lesson_03',title:'第3课',sub:'ここ・そこ・あそこ',url:'#',status:'待生成'},
{id:'minna_lesson_04',title:'第4课',sub:'时间・动词基础',url:'#',status:'待生成'},
{id:'minna_lesson_05',title:'第5课',sub:'移动・交通',url:'#',status:'待生成'},
{id:'minna_lesson_06',title:'第6课',sub:'动词ます形',url:'#',status:'待生成'}
];
let progressRows=[];const $=id=>document.getElementById(id);function esc(s){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function rowFor(id){return progressRows.find(r=>r.lesson_id===id)}function doneCount(p){return p&&p.done?Object.keys(p.done).filter(k=>p.done[k]).length:0}function score(p){return Number((p&&p.score)||0)}function render(){let totalScore=0,totalDone=0;const html=lessons.map(l=>{const r=rowFor(l.id),p=r&&r.progress||{};const done=doneCount(p),sc=score(p);totalScore+=sc;totalDone+=done;const pct=Math.min(100,Math.round(done/12*100));const isLive=l.status==='已上线';return `<div class="lesson ${isLive?'current':'locked'}"><h3>${esc(l.title)}</h3><p>${esc(l.sub)}</p><p><span class="pill ${isLive?'ok':'wait'}">${esc(l.status)}</span><span class="pill">lesson_id: ${esc(l.id)}</span></p><div class="bar"><span style="width:${pct}%"></span></div><p class="small">完成：${done}/12 ｜ 分数：${sc} ｜ ${r?('云端更新时间：'+new Date(r.updated_at).toLocaleString()):'暂无云端记录'}</p>${isLive?`<a class="btn primary" href="${l.url}">开始学习</a>`:`<button class="light" onclick="soon('${esc(l.title)}')">等待生成</button>`}</div>`}).join('');$('lessonGrid').innerHTML=html;$('totalLessons').textContent=progressRows.length;$('totalScore').textContent=totalScore;$('totalDone').textContent=totalDone}
async function init(){try{await MinnaAuth.init({lessonId:'minna_home'});updateAuth();window.addEventListener('minna-auth-changed',()=>{updateAuth();loadAll()});await loadAll()}catch(e){$('authStatus').textContent='Auth加载失败';$('cloudStatus').textContent=e.message;render()}}
function updateAuth(){const u=MinnaAuth.getUser();$('authStatus').textContent=u?('已登录：'+(u.email||u.id)):'未登录';$('cloudStatus').textContent=u?'Supabase 全站账号已连接':'未登录也可以查看课程入口'}async function login(){try{await MinnaAuth.loginWithGoogle()}catch(e){alert('登录失败：'+e.message)}}async function logout(){try{await MinnaAuth.logout();progressRows=[];updateAuth();render()}catch(e){alert('退出失败：'+e.message)}}async function loadAll(){try{$('cloudStatus').textContent='读取全课进度中...';progressRows=await MinnaAuth.listProgress();$('cloudStatus').textContent='全课进度已读取：'+new Date().toLocaleTimeString();render()}catch(e){$('cloudStatus').textContent='读取失败';alert('读取全课进度失败：'+e.message);render()}}function soon(t){showModal(t,'<p>这个课程还没有生成。下一步可以让我继续升级，直接生成第2课互动页面。</p>')}function showModal(t,h){$('mt').textContent=t;$('mb').innerHTML=h;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show')}init();
</script>
</body>
</html>
