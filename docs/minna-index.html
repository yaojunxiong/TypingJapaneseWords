window.SITE_VISIT_LOG_CONFIG = {
  siteCode: 'minna',
  siteName: 'Minna no Nihongo AI Learning',
  getUser: function(){
    try {
      var profile = JSON.parse(localStorage.getItem('minna_profile') || 'null') || {};
      return {
        guestUserId: profile.id || localStorage.getItem('minna_guest_user_id') || null,
        guestUserName: profile.name || localStorage.getItem('minna_guest_user_name') || null,
        locale: localStorage.getItem('minna_locale') || document.documentElement.lang || 'zh'
      };
    } catch(e) {
      return { locale: document.documentElement.lang || 'zh' };
    }
  }
};
</script>
