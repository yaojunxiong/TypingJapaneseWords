<style>
:root{--bg:#f8fafc;--card:#fff;--ink:#0f172a;--line:#e2e8f0;--muted:#64748b;--blue:#2563eb;--purple:#7c3aed;--green:#22c55e;--dark:#334155}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,#dbeafe,var(--bg) 48%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Noto Sans JP","Microsoft YaHei",sans-serif}.wrap{max-width:1100px;margin:auto}.hero{background:linear-gradient(135deg,var(--blue),var(--purple));color:white;padding:28px 18px}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}.badge{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:5px 12px;font-weight:900}.quicklinks{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.quicklinks a{background:#e2e8f0;color:#0f172a;border-radius:14px;padding:9px 13px;text-decoration:none;font-weight:900}main{padding:18px}.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 30px rgba(15,23,42,.08);padding:16px;margin-bottom:14px}.cards4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.cards4 div{background:#f8fafc;border:1px solid var(--line);border-radius:18px;padding:12px;text-align:center}.cards4 b,.cards4 span{display:block}.cards4 span{font-size:26px;font-weight:1000}.vocabGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.vcard,.gcard,.example,.qcard{border:1px solid var(--line);border-radius:18px;background:#f8fafc;padding:12px;margin:10px 0}.vcard b{font-size:22px}.vcard small,.vcard span{display:block;margin-top:5px}.jp{font-size:22px;font-weight:900}.opts{display:grid;gap:8px}.opt{border:1px solid var(--line);background:white;border-radius:14px;padding:10px;text-align:left;font-weight:900;cursor:pointer}.opt.right{background:#dcfce7;border-color:#22c55e}.opt.wrong{background:#fee2e2;border-color:#ef4444}.small{color:var(--muted);font-size:13px;line-height:1.55}.scoreBox{font-size:22px;margin-top:14px}.langToggleV15{display:inline-flex;gap:6px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:5px}.langToggleV15 button{border:0;border-radius:999px;padding:7px 11px;background:transparent;color:white;font-weight:1000}.langToggleV15 button.active{background:white;color:#1d4ed8}.footer{text-align:center;color:var(--muted);font-size:13px;padding:22px}@media(max-width:700px){.topbar{display:block}.cards4{grid-template-columns:1fr 1fr}}
