<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Learning Center</title>
<link rel="stylesheet" href="./minna-stage.css?v=1.18">
<style>
.toolboxWrap{padding:24px 24px 120px}.toolHero{text-align:center;margin:28px auto 26px}.toolHero h1{font-size:40px;margin:12px 0 10px}.toolHero p{font-size:18px;color:#71717a;font-weight:800}.toolStats{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:760px;margin:0 auto 24px}.toolStat{background:#fff;border:3px solid #ececec;border-radius:24px;padding:22px 18px;box-shadow:0 4px 0 #ececec;text-align:center}.toolStat b{display:block;font-size:34px;font-weight:1000;margin-bottom:8px;color:#1daeea}.toolStat span{display:block;font-size:15px;color:#71717a;font-weight:900}.toolMenu{display:grid;gap:16px;max-width:760px;margin:0 auto}.toolLink{display:flex;align-items:center;justify-content:space-between;text-decoration:none;background:#fff;border:3px solid #ececec;border-radius:24px;padding:22px 20px;box-shadow:0 4px 0 #ececec;color:#3f3f46}.toolLeft{display:flex;align-items:center;gap:18px}.toolIcon{width:64px;height:64px;border-radius:20px;background:#f4f4f5;display:flex;align-items:center;justify-content:center;font-size:34px}.toolText b{display:block;font-size:22px;font-weight:1000;margin-bottom:4px}.toolText p{margin:0;font-size:15px;color:#71717a;font-weight:700}.toolArrow{font-size:26px;color:#a1a1aa;font-weight:1000}.emptyLine{height:18px}@media(max-width:520px){.toolboxWrap{padding:18px 20px 112px}.toolHero h1{font-size:34px}.toolStats{gap:14px}.toolStat{padding:20px 14px}.toolStat b{font-size:28px}.toolLink{padding:20px 18px}.toolIcon{width:58px;height:58px;font-size:30px}.toolText b{font-size:20px}}</style>
</head>
<body>
<div id="app"></div>
<script src="./minna-app-shell.js?v=1.1"></script>
<script>
(function(){
var XP='minna.xp.v1',CROWNS='minna.crowns.v1',MISTAKES='minna.mistakes.v1';
function xp(){try{return Number(localStorage.getItem(XP)||0)}catch(e){return 0}}
function crowns(){try{var c=JSON.parse(localStorage.getItem(CROWNS)||'{}')||{};return Object.keys(c).filter(function(k){return k.indexOf('.review')>0||k.indexOf('.examples')>0||k.indexOf('.grammar')>0||k.indexOf('.vocab')>0}).length}catch(e){return 0}}
function mistakes(){try{return(JSON.parse(localStorage.getItem(MISTAKES)||'[]')||[]).length}catch(e){return 0}}
function menu(icon,title,desc,href,count){return '<a class="toolLink" href="'+href+'"><div class="toolLeft"><div class="toolIcon">'+icon+'</div><div class="toolText"><b>'+title+'</b><p>'+desc+'</p></div></div><div class="toolArrow">'+(count!=null?count:'›')+'</div></a>'}
function render(){window.MinnaAppShell&&window.MinnaAppShell.injectTop({second:'🔥 '+mistakes(),right:'👑 '+crowns()});document.getElementById('app').innerHTML='<main class="toolboxWrap"><section class="toolHero"><div style="font-size:92px">🧰</div><h1>Learning Center</h1><p>学习数据与复习中心</p></section><section class="toolStats"><div class="toolStat"><b>💎 '+xp()+'</b><span>Total XP</span></div><div class="toolStat"><b>👑 '+crowns()+'</b><span>Total Crowns</span></div><div class="toolStat"><b>🔥 '+mistakes()+'</b><span>Mistakes</span></div><div class="toolStat"><b>📚 '+Math.max(1,Math.ceil(crowns()/4))+'</b><span>Lessons</span></div></section><section class="toolMenu">'+menu('🔥','错题复习','自动记录并强化复习','./minna-review-mistakes.html',mistakes())+menu('👑','Crown 收藏','查看学习成长进度','#',crowns())+menu('💎','XP 统计','累计学习经验','#',xp())+menu('📅','今日复习','后续将接入智能复习','#')+menu('🏆','学习成就','连续学习与奖励','#')+'</section><div class="emptyLine"></div></main>';window.MinnaAppShell&&window.MinnaAppShell.injectTabs('toolbox')}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',render);else render();
})();
</script>
</body>
</html>
