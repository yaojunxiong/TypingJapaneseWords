<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>日语台词查找</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- 引入 Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .video-block {
            margin-bottom: 2rem;
        }

            .video-block video {
                width: 100%;
                border-radius: 0.5rem;
            }

        .raw-text {
            font-size: 1.1rem;
            margin-top: 0.5rem;
        }

            .raw-text a {
                display: inline-block;
                margin-top: 0.3rem;
                color: #0d6efd;
                text-decoration: none;
            }

                .raw-text a:hover {
                    text-decoration: underline;
                }
    </style>
</head>
<body class="bg-light">

    <div class="container py-4">
        <h1 class="text-center text-primary mb-4">🎬 日语台词查找结果</h1>
        <div id="result" class="result">読み込み中...</div>
    </div>

    <script>
        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        const sentence = getQueryParam('sentencePara');
        const resultDiv = document.getElementById('result');

        if (!sentence) {
            resultDiv.innerHTML = '<div class="alert alert-warning">❌ 未提供台词参数。请使用 <code>?sentencePara=你的日语句子</code>。</div>';
        } else {
            fetch('videos.json')
                .then(response => {
                    if (!response.ok) throw new Error('无法加载 JSON 文件');
                    return response.json();
                })
                .then(videoData => {
                    const matches = videoData.filter(item =>
                        item.rawText && item.rawText.includes(sentence)
                    );

                    if (matches.length > 0) {
                        let html = `<p class="text-success">✅ 找到 <strong>${matches.length}</strong> 个匹配项：</p>`;
                        matches.forEach(match => {
                            const encodedFileName = encodeURIComponent(match.rawText) + '.mp4';
                            const mp4File = 'video/' + encodedFileName;

                            html += `
                                <div class="card video-block shadow-sm">
                                    <div class="card-body">
                                        <video controls src="${mp4File}"></video>
                                        <div class="raw-text">
                                            ${match.rawText}<br>
                                            <a href="${match.file}" target="_blank">▶ ページを見る</a>
                                        </div>
                                    </div>
                                </div>
                            `;
                        });
                        resultDiv.innerHTML = html;
                    } else {
                        // ❗JSON 没找到，直接尝试加载视频文件
                        const encodedFileName = encodeURIComponent(sentence) + '.mp4';
                        const mp4File = 'video/' + encodedFileName;

                        // ⚠️ 尝试用 HEAD 请求验证文件是否存在
                        fetch(mp4File, { method: 'HEAD' }).then(res => {
                            if (res.ok) {
                                resultDiv.innerHTML = `
                                    <p class="text-warning">⚠ JSON 中未找到记录，但发现匹配视频文件：</p>
                                    <div class="card video-block shadow-sm">
                                        <div class="card-body">
                                            <video controls src="${mp4File}"></video>
                                            <div class="raw-text">
                                                ${sentence}<br>
                                                <span class="text-muted">（未记录来源，仅从文件匹配）</span>
                                            </div>
                                        </div>
                                    </div>
                                `;
                            } else {
                                resultDiv.innerHTML = `<div class="alert alert-info">😢 没有找到包含「${sentence}」的视频或文件。</div>`;
                            }
                        });
                    }
                })
                .catch(error => {
                    resultDiv.innerHTML = `<div class="alert alert-danger">❌ 加载视频数据失败：${error.message}</div>`;
                    console.error(error);
                });
        }
    </script>


</body>
</html>
