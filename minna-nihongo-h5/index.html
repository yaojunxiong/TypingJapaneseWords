<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>日语教材结构学习助手</title>
  <meta name="theme-color" content="#d92d20" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <h1>日语教材结构学习助手</h1>
      <p>句型 / 例文 / 会话 / 练习 / 问题 / 单词 / 语法 · 每句可播放</p>
    </div>
    <button id="installBtn" class="ghost hidden">添加到桌面</button>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <div class="panel">
        <h2>课次</h2>
        <label class="field">选择课次
          <select id="lessonSelect"></select>
        </label>
      </div>
      <div class="panel">
        <h2>语音</h2>
        <label class="field">速度
          <input id="rate" type="range" min="0.45" max="1.2" step="0.05" value="0.75" />
          <span id="rateText">0.75x</span>
        </label>
        <label class="field">日语声音
          <select id="voiceSelect"></select>
        </label>
        <button id="stopBtn" class="secondary">停止播放</button>
      </div>
      <div class="panel small">
        <p><strong>个人学习模板：</strong>页面结构已改成教材结构。请在 data 文件里填入你自己整理或有权使用的内容。</p>
      </div>
    </aside>

    <section class="content">
      <div class="toolbar">
        <input id="searchInput" placeholder="搜索日语 / 中文 / 假名..." />
        <button id="resetBtn" class="secondary">清空搜索</button>
      </div>
      <article id="lessonView" class="lesson-view"></article>
    </section>
  </main>

  <footer>Personal study helper template.</footer>
  <script src="app.js"></script>
</body>
</html>
