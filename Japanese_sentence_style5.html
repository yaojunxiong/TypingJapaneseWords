<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日语句子语法信息</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: "Segoe UI", "Noto Sans JP", sans-serif;
        }

        code {
            background-color: #f1f1f1;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
        }
    </style>
</head>
<body class="bg-light">

    <div class="container py-4">
        <h2 class="text-primary mb-4 text-center">📚 日语句子语法信息</h2>

        <div class="card shadow-sm">
            <div class="card-body" id="output">
                <p class="text-muted">⏳ 加载中...</p>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const sentence = params.get("sentencePara");
        const output = document.getElementById("output");

        if (!sentence) {
            output.innerHTML = `
                    <p class="text-warning fw-bold">⚠️ 未提供句子参数 sentencePara。</p>
                    <p>请通过 <code>?sentencePara=句子内容</code> 在网址中传入目标句子。</p>
                `;
        } else {
            fetch("Japanese_sentence_grammar.json")
                .then(res => res.json())
                .then(data => {
                    const item = data[sentence];
                    if (!item) {
                        output.innerHTML = `
                                <p class="text-danger fw-bold">❌ 没有找到句子：</p>
                                <code class="d-block mb-3">${sentence}</code>
                            `;
                        return;
                    }

                    output.innerHTML = `
                            <p><strong>📌 目标句子：</strong><br><code>${sentence}</code></p>
                            <p><strong>🈶 中文翻译：</strong><br>${item.translation}</p>
                            <p><strong>📘 分级：</strong> <span class="badge bg-success">${item.level}</span></p>
                            <p><strong>📙 语法点：</strong><br>${item.grammar}</p>
                            <p><strong>📝 语法说明：</strong><br>${item.explanation}</p>
                        `;
                })
                .catch(err => {
                    output.innerHTML = "<p class='text-danger'>❌ 加载数据失败。</p>";
                    console.error(err);
                });
        }
    </script>

</body>
</html>
