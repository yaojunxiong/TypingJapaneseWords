<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>日语対話練習</title>
    <link href="japanese_shorts2.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.14.0/Sortable.min.js"></script> 
    <script src="kuromoji.js"></script> <!-- 形态素分析 -->
</head>
<body>

    <div class="container">
        <!-- 视频区 -->
        <div class="video-section">
            <video controls autoplay loop playsinline>
                <source id="video-source" src="" type="video/mp4" />
                お使いのブラウザは video タグをサポートしていません。
            </video>
        </div>

        <!-- 拖拽练习区 -->
        <div class="practice-section">
            <h2>🎌 ドラッグして正しい順に並べよう</h2>

            <!-- 女生对话 -->
            <div class="dialogue">
                <div class="speaker">
                    <img src="img/女の子.png" alt="girl" />
                    <span id="text1"></span>
                </div>
                <ul class="word-list" id="list1"></ul>
                <button onclick="checkAnswer('list1', answer1, 'result1')">答え合わせ</button>
                <div class="result" id="result1"></div>
            </div>

            <!-- 男生对话 -->
            <div class="dialogue">
                <div class="speaker">
                    <img src="img/男の子.png" alt="boy" />
                    <span id="text2"></span>
                </div>
                <ul class="word-list" id="list2"></ul>
                <button onclick="checkAnswer('list2', answer2, 'result2')">答え合わせ</button>
                <div class="result" id="result2"></div>
            </div>
        </div>
    </div>



    <!-- ✨ 只写这句！ -->
    <script>
        const rawText = "「このドーナツ 美味しいね」「うん もう3個食べちゃったよ」";
    </script>

    <!-- 功能逻辑 --> 
    <script>
        

        let answer1 = [];
        let answer2 = [];

        // 初始化 kuromoji 分词器
        kuromoji.builder({ dicPath: "kuromoji/dict" }).build(function (err, tokenizer) {
            if (err) {
                console.error("❌ 形態素解析器の初期化に失敗しました:", err);
                return;
            }

            // 提取 rawText 中的句子
            const match = rawText.match(/「(.+?)」\s*「(.+?)」/);
            if (!match) {
                alert("⚠️ rawText の形式が正しくありません。\n例：「句子１」「句子２」");
                return;
            }

            const sentence1 = match[1];
            const sentence2 = match[2];

            // 设置视频路径（编码防止路径错误）
            const videoPath = "video/" + encodeURIComponent(rawText) + ".mp4";
            const videoSource = document.getElementById("video-source");
            videoSource.src = videoPath;
            document.querySelector("video").load();

            // 设置页面对话文本
            document.getElementById("text1").textContent = `女：「${sentence1}」`;
            document.getElementById("text2").textContent = `男：「${sentence2}」`;

            // 分词生成词块数组
            answer1 = tokenizer.tokenize(sentence1).map(token => token.surface_form);
            answer2 = tokenizer.tokenize(sentence2).map(token => token.surface_form);

            // 创建拖拽练习列表（调用外部函数）
            createList("list1", answer1);
            createList("list2", answer2);
        });

    </script>
</body>
</html>
