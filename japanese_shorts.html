<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>短视频分页加载 Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
            touch-action: pan-y;
        }

        #app {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .video-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: transform 0.4s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: black;
        }

        .toast {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 16px;
            z-index: 99;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        ::cue {
            font-size: 18px;
            color: white;
            background: rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body>
    <div id="app">Loading...</div>
    <div id="toast" class="toast"></div>

    <script>
        const app = document.getElementById('app');
        const toast = document.getElementById('toast');
        let fullList = [];
        let loadedVideos = [];
        let videoElements = [];
        let currentIndex = 0;
        const pageSize = 3;

        function showToast(message) {
            toast.textContent = message;
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
            }, 1500);
        }

        async function loadVideoList() {
            const res = await fetch('videos.json');
            fullList = await res.json();
            loadNextPage();
        }

        function loadNextPage() {
            const nextBatch = fullList.slice(loadedVideos.length, loadedVideos.length + pageSize);
            nextBatch.forEach(videoData => {
                const index = loadedVideos.length;
                loadedVideos.push(videoData);
                createVideoElement(index, videoData);
            });
            showVideo(currentIndex);
        }

        function createVideoElement(index, videoData) {
            const wrapper = document.createElement('div');
            wrapper.className = 'video-slide';
            wrapper.style.transform = `translateY(${(index - currentIndex) * 100}%)`;

            const video = document.createElement('video');
            video.src = `video/${videoData.src}.mp4`;
            video.autoplay = false;
            video.playsInline = true;
            video.loop = true;
            video.controls = true;

            const track = document.createElement('track');
            track.kind = 'subtitles';
            track.label = '字幕';
            track.srclang = 'ja';
            track.src = `video/${videoData.src}.vtt`;
            track.default = true;
            video.appendChild(track);

            wrapper.appendChild(video);
            app.appendChild(wrapper);
            videoElements[index] = video;
        }

        function showVideo(index) {
            videoElements.forEach((video, i) => {
                const wrapper = video.parentElement;
                wrapper.style.transform = `translateY(${(i - index) * 100}%)`;
                if (i === index) {
                    video.play().catch(() => { });
                } else {
                    video.pause();
                }
            });

            // 加载下一页判断
            if (index >= loadedVideos.length - 2 && loadedVideos.length < fullList.length) {
                loadNextPage();
            }
        }

        // 手势逻辑
        let startY = 0;
        let isSwiping = false;

        app.addEventListener('touchstart', e => {
            startY = e.touches[0].clientY;
            isSwiping = true;
        });

        app.addEventListener('touchmove', e => {
            if (!isSwiping) return;
            const diff = e.touches[0].clientY - startY;

            if (Math.abs(diff) > 50) {
                if (diff < 0) {
                    if (currentIndex < loadedVideos.length - 1) {
                        currentIndex++;
                        showVideo(currentIndex);
                    } else if (loadedVideos.length < fullList.length) {
                        showToast('加载中…');
                    } else {
                        showToast('已经是最后一个视频啦');
                    }
                } else if (diff > 0) {
                    if (currentIndex > 0) {
                        currentIndex--;
                        showVideo(currentIndex);
                    } else {
                        showToast('已经是第一个视频啦');
                    }
                }
                isSwiping = false;
            }
        });

        loadVideoList();
    </script>
</body>
</html>
