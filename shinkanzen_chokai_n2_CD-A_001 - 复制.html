<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>字幕同步 Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        /* Custom Styling (optional) */
        .video-container {
            width: 100%;
            max-width: 600px; /* Max width for video */
            border-radius: 10px;
        }

        .subtitles-container {
            width: 100%;
            max-width: 400px; /* Max width for subtitles */
            border: 1px solid #444;
            background-color: #222;
            border-radius: 10px;
            padding: 10px;
            overflow-y: auto;
            /* Removed fixed height to let the container adjust based on content */
        }

        .subtitle {
            opacity: 0.7;
            transition: all 0.3s ease;
            text-align: center;
        }

        .active {
            opacity: 1;
            color: #00ffff;
            font-weight: bold;
        }

        .subtitle span {
            display: block;
        }

        .subtitle .japanese {
            color: #ffcc00;
        }

        .subtitle .chinese {
            color: #ffffff;
        }
    </style>
</head>
<body class="bg-dark text-white">

    <h1 class="text-center text-warning mb-4">🎬 字幕同步播放 Demo</h1>

    <div class="container">
        <div class="row">
            <!-- Video Section (for desktop and mobile) -->
            <div class="col-12 col-md-6">
                <video class="video-container" id="video" controls>
                    <source src="shinkanzen_chokai_n2_CD-A_001.mp4" type="video/mp4" />
                    お使いのブラウザは video タグに対応していません。
                </video>
            </div>

            <!-- Subtitles Section (for desktop and mobile) -->
            <div class="col-12 col-md-6">
                <div id="subtitles" class=""></div>
            </div>
        </div>
    </div>

    <script>
        // Function to fetch and parse the audio.json file
        async function fetchSubtitles() {
            const response = await fetch('audio.json');
            const data = await response.json();
            return data; // Return the array of subtitles directly
        }

        // Parse the subtitle JSON and return an array of subtitle objects
        function parseSubtitles(subtitles) {
            return subtitles.map(sub => {
                const start = timeToSeconds(sub.start);
                const end = timeToSeconds(sub.end);
                return { start, end, jp: sub.jp, zh: sub.zh, element: null };
            });
        }

        // Helper function to convert time format (hh:mm:ss,SSS) to seconds
        function timeToSeconds(time) {
            const [hours, minutes, seconds] = time.split(",")[0].split(":");
            const milliseconds = time.split(",")[1];
            return parseInt(hours) * 3600 + parseInt(minutes) * 60 + parseFloat(seconds) + parseInt(milliseconds) / 1000;
        }

        // Fetch and display subtitles
        async function loadSubtitles() {
            const subtitlesData = await fetchSubtitles();
            const subtitles = parseSubtitles(subtitlesData);
            const container = document.getElementById("subtitles");

            subtitles.forEach((line) => {
                const div = document.createElement("div");
                div.className = "subtitle";
                div.innerHTML = `<span class="japanese">${line.jp}</span><span class="chinese">${line.zh}</span>`;
                container.appendChild(div);
                line.element = div;
            });

            const video = document.getElementById("video");
            let lastActive = null;

            video.ontimeupdate = () => {
                const t = video.currentTime;
                subtitles.forEach((line) => {
                    const isActive = t >= line.start && t <= line.end;
                    const alreadyActive = line.element.classList.contains("active");

                    if (isActive && !alreadyActive) {
                        if (lastActive) lastActive.classList.remove("active");
                        line.element.classList.add("active");
                        line.element.scrollIntoView({ behavior: "smooth", block: "center" });
                        lastActive = line.element;
                    }
                });
            };
        }

        // Load subtitles when the page is ready
        loadSubtitles();
    </script>
</body>
</html>
